                                                key={idx}
                                                onClick={() => handleOptionSelect(exam.id, idx)}
                                                className={`quiz-option p-4 rounded-xl border-2 transition ${
                                                    answers[exam.id] === idx 
                                                        ? 'border-brand-gold bg-brand-gold/20' 
                                                        : 'border-white/10 hover:border-brand-gold/50'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${
                                                        answers[exam.id] === idx 
                                                            ? 'border-brand-gold bg-brand-gold text-black' 
                                                            : 'border-white/30'
                                                    }`}>
                                                        {answers[exam.id] === idx && '✓'}
                                                    </div>
                                                    <span>{option.text}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                {exam.type === 'essay' && (
                                    <div className="mb-8">
                                        <textarea
                                            value={answers[exam.id] || ''}
                                            onChange={(e) => handleEssayChange(exam.id, e.target.value)}
                                            placeholder="اكتب إجابتك هنا..."
                                            className="w-full p-4 bg-white/5 border border-white/10 rounded-xl h-40 resize-none"
                                        />
                                    </div>
                                )}
                                
                                {exam.type === 'whatsapp' && (
                                    <div className="mb-8 text-center">
                                        <div className="bg-yellow-500/10 p-6 rounded-xl mb-4">
                                            <Icon name="message-circle" size={48} className="mx-auto mb-3 text-green-500" />
                                            <p className="mb-4">هذا السؤال يتطلب إرسال الحل عبر واتساب مع صورة إن وجدت</p>
                                            {exam.imageUrl && (
                                                <a href={exam.imageUrl} target="_blank" className="block mb-4">
                                                    <img src={exam.imageUrl} className="max-h-40 mx-auto rounded-lg" />
                                                </a>
                                            )}
                                        </div>
                                        <a 
                                            href={`https://wa.me/201000000000?text=إجابة سؤال: ${exam.question}%0Aالطالب: ${user?.name}%0Aكود الطالب: ${user?.code}`}
                                            target="_blank"
                                            className="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold"
                                        >
                                            <Icon name="message-circle" /> إرسال الإجابة عبر واتساب
                                        </a>
                                    </div>
                                )}
                                
                                <div className="flex gap-3 pt-4 border-t border-white/10">
                                    <button onClick={onClose} className="flex-1 py-4 bg-white/10 rounded-xl font-bold">
                                        إلغاء
                                    </button>
                                    <button 
                                        onClick={handleSubmit} 
                                        disabled={exam.type !== 'whatsapp' && !answers[exam.id]}
                                        className="flex-1 btn-main py-4 rounded-xl font-bold disabled:opacity-50"
                                    >
                                        تسليم الإجابة
                                    </button>
                                </div>
                            </>
                        ) : (
                            <div className="text-center space-y-6">
                                <div className="w-24 h-24 mx-auto bg-green-500/20 rounded-full flex items-center justify-center">
                                    <Icon name="check-circle" size={48} className="text-green-500" />
                                </div>
                                
                                <h3 className="text-2xl font-bold">تم تسليم الإجابة بنجاح!</h3>
                                
                                {result && (
                                    <div className="glass-panel p-6 space-y-4">
                                        {result.correct !== undefined && (
                                            <>
                                                <div className="flex justify-between items-center">
                                                    <span>النتيجة:</span>
                                                    <span className={`text-xl font-bold ${result.correct ? 'text-green-500' : 'text-red-500'}`}>
                                                        {result.correct ? '✓ صحيح' : '✗ خطأ'}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <span>الدرجة:</span>
                                                    <span className="text-xl font-bold">{result.score} / {result.total}</span>
                                                </div>
                                                <div className="h-2 bg-white/10 rounded-full overflow-hidden">
                                                    <div 
                                                        className={`h-full ${result.correct ? 'bg-green-500' : 'bg-red-500'}`}
                                                        style={{ width: `${result.percentage}%` }}
                                                    ></div>
                                                </div>
                                                {result.correctAnswer && (
                                                    <div className="bg-green-500/10 p-3 rounded-lg">
                                                        <p className="text-sm text-green-400">الإجابة الصحيحة: {result.correctAnswer}</p>
                                                    </div>
                                                )}
                                            </>
                                        )}
                                        
                                        {result.message && (
                                            <p className="text-slate-300">{result.message}</p>
                                        )}
                                    </div>
                                )}
                                
                                <button onClick={onClose} className="btn-main px-8 py-3 rounded-xl font-bold">
                                    إغلاق
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ✅ NEW: Exams List Component for Students
        const ExamsList = ({ exams, user, onSelectExam }) => {
            const [filterGrade, setFilterGrade] = useState('all');
            const [filterCourse, setFilterCourse] = useState('all');
            const [courses, setCourses] = useState([]);
            
            useEffect(() => {
                // تحميل الكورسات
                const coursesRef = window.rtdb.ref(window.db, 'courses');
                window.rtdb.onValue(coursesRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const coursesData = Object.entries(snapshot.val()).map(([id, data]) => ({
                            id,
                            ...data
                        }));
                        setCourses(coursesData);
                    }
                });
            }, []);
            
            const userEnrolledCourses = user?.enrolledCourses || [];
            
            // فلترة الامتحانات حسب الصف والكورسات المسجل فيها الطالب
            const filteredExams = exams.filter(exam => {
                if (filterGrade !== 'all' && exam.grade !== filterGrade) return false;
                if (filterCourse !== 'all' && exam.courseId !== filterCourse) return false;
                
                // التحقق من أن الطالب مسجل في هذا الكورس
                return userEnrolledCourses.includes(exam.courseId);
            });
            
            return (
                <div className="glass-panel p-6 animate-slide-up">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="glass-icon bg-red-500/20 text-red-500 border-red-500/30">
                            <Icon name="clipboard-list" size={24} />
                        </div>
                        <div>
                            <h2 className="text-xl font-bold">♞ الامتحانات</h2>
                            <p className="text-xs text-slate-400">اختبر معلوماتك في الكورسات المسجل بها</p>
                        </div>
                    </div>
                    
                    {/* فلترة */}
                    <div className="flex flex-wrap gap-4 mb-6">
                        <div className="flex bg-white/5 p-1 rounded-xl border border-white/10">
                            {['all', '1sec', '2sec', '3sec'].map(g => (
                                <button
                                    key={g}
                                    onClick={() => setFilterGrade(g)}
                                    className={`px-4 py-2 rounded-lg text-sm font-bold transition ${
                                        filterGrade === g 
                                            ? 'bg-brand-primary text-white shadow-lg' 
                                            : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    {g === 'all' ? 'الكل' : g === '1sec' ? 'أولى' : g === '2sec' ? 'تانية' : 'تالتة'}
                                </button>
                            ))}
                        </div>
                        
                        <select 
                            value={filterCourse}
                            onChange={(e) => setFilterCourse(e.target.value)}
                            className="bg-white/5 border border-white/10 p-2 rounded-xl text-sm"
                        >
                            <option value="all">كل الكورسات</option>
                            {courses.filter(c => userEnrolledCourses.includes(c.id)).map(course => (
                                <option key={course.id} value={course.id}>{course.title}</option>
                            ))}
                        </select>
                    </div>
                    
                    {filteredExams.length === 0 ? (
                        <div className="text-center py-12 border border-dashed border-white/10 rounded-xl">
                            <GlassIcon name="clipboard" size={48} className="mx-auto mb-4 opacity-50" />
                            <h3 className="text-lg font-bold mb-2">لا توجد امتحانات متاحة</h3>
                            <p className="text-sm text-slate-400">ليس لديك امتحانات في هذه التصفية</p>
                        </div>
                    ) : (
                        <div className="grid md:grid-cols-2 gap-4">
                            {filteredExams.map(exam => {
                                const course = courses.find(c => c.id === exam.courseId);
                                return (
                                    <div 
                                        key={exam.id} 
                                        onClick={() => onSelectExam(exam)}
                                        className="bg-white/5 rounded-xl border border-white/10 overflow-hidden hover:border-red-500/50 hover:scale-[1.02] transition-all duration-300 cursor-pointer"
                                    >
                                        <div className="p-5">
                                            <div className="flex items-start justify-between mb-3">
                                                <span className={`px-2 py-1 rounded text-xs font-bold ${
                                                    exam.type === 'mcq' ? 'bg-blue-500/20 text-blue-300' :
                                                    exam.type === 'essay' ? 'bg-purple-500/20 text-purple-300' :
                                                    'bg-green-500/20 text-green-300'
                                                }`}>
                                                    {exam.type === 'mcq' ? 'اختياري' : exam.type === 'essay' ? 'مقالي' : 'واتساب'}
                                                </span>
                                                <span className="text-xs text-slate-400">{exam.date}</span>
                                            </div>
                                            
                                            <h3 className="font-bold text-lg mb-2 line-clamp-2">{exam.question}</h3>
                                            
                                            {course && (
                                                <div className="flex items-center gap-2 mt-3">
                                                    <span className="text-xs bg-white/10 px-2 py-1 rounded">
                                                        {course.title}
                                                    </span>
                                                    <span className="text-xs bg-white/10 px-2 py-1 rounded">
                                                        {exam.grade === '1sec' ? 'أولى' : exam.grade === '2sec' ? 'تانية' : 'تالتة'}
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // ✅ NEW: Results Page Component
        const ResultsPage = ({ user, exams }) => {
            const [results, setResults] = useState([]);
            const [courses, setCourses] = useState([]);
            
            useEffect(() => {
                // تحميل نتائج الطالب
                const resultsRef = window.rtdb.ref(window.db, 'examResults');
                window.rtdb.onValue(resultsRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const resultsData = Object.entries(snapshot.val())
                            .map(([id, data]) => ({ id, ...data }))
                            .filter(r => r.studentId === user?.uid)
                            .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        setResults(resultsData);
                    }
                });
                
                // تحميل الكورسات
                const coursesRef = window.rtdb.ref(window.db, 'courses');
                window.rtdb.onValue(coursesRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const coursesData = Object.entries(snapshot.val()).map(([id, data]) => ({
                            id,
                            ...data
                        }));
                        setCourses(coursesData);
                    }
                });
            }, [user]);
            
            // إحصائيات
            const totalExams = results.length;
            const totalScore = results.reduce((sum, r) => sum + (r.score || 0), 0);
            const totalPossible = results.reduce((sum, r) => sum + (r.total || 1), 0);
            const averagePercentage = totalPossible > 0 ? Math.round((totalScore / totalPossible) * 100) : 0;
            const correctCount = results.filter(r => r.correct === true).length;
            
            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="glass-panel p-6">
                        <h2 className="text-2xl font-bold flex items-center gap-2 mb-6">
                            <GlassIcon name="bar-chart-2" size={24} />
                            نتائج الامتحانات
                        </h2>
                        
                        {/* الإحصائيات */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <div className="bg-white/5 p-4 rounded-xl text-center">
                                <div className="text-2xl font-bold text-blue-400">{totalExams}</div>
                                <div className="text-xs text-slate-400">إجمالي الامتحانات</div>
                            </div>
                            <div className="bg-white/5 p-4 rounded-xl text-center">
                                <div className="text-2xl font-bold text-green-400">{totalScore}</div>
                                <div className="text-xs text-slate-400">إجمالي الدرجات</div>
                            </div>
                            <div className="bg-white/5 p-4 rounded-xl text-center">
                                <div className="text-2xl font-bold text-yellow-400">{averagePercentage}%</div>
                                <div className="text-xs text-slate-400">متوسط النجاح</div>
                            </div>
                            <div className="bg-white/5 p-4 rounded-xl text-center">
                                <div className="text-2xl font-bold text-purple-400">{correctCount}</div>
                                <div className="text-xs text-slate-400">إجابات صحيحة</div>
                            </div>
                        </div>
                        
                        {results.length === 0 ? (
                            <div className="text-center py-12">
                                <GlassIcon name="bar-chart-2" size={48} className="mx-auto mb-4 opacity-50" />
                                <p className="text-slate-400">لم تقم بحل أي امتحان بعد</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {results.map(result => {
                                    const exam = exams.find(e => e.id === result.examId);
                                    const course = exam ? courses.find(c => c.id === exam.courseId) : null;
                                    
                                    return (
                                        <div key={result.id} className="exam-result p-5 rounded-xl">
                                            <div className="flex flex-wrap items-center justify-between gap-4">
                                                <div className="flex-1">
                                                    <h3 className="font-bold text-lg mb-2">{exam?.question || 'امتحان'}</h3>
                                                    <div className="flex flex-wrap gap-2 text-sm">
                                                        <span className="bg-white/10 px-2 py-1 rounded">
                                                            {course?.title || 'غير معروف'}
                                                        </span>
                                                        <span className="bg-white/10 px-2 py-1 rounded">
                                                            {exam?.grade === '1sec' ? 'أولى' : exam?.grade === '2sec' ? 'تانية' : 'تالتة'}
                                                        </span>
                                                        <span className="bg-white/10 px-2 py-1 rounded">
                                                            {new Date(result.timestamp).toLocaleDateString('ar-EG')}
                                                        </span>
                                                    </div>
                                                </div>
                                                
                                                <div className="text-center">
                                                    {result.score !== undefined ? (
                                                        <>
                                                            <div className={`text-2xl font-bold ${result.correct ? 'text-green-500' : 'text-red-500'}`}>
                                                                {result.score} / {result.total}
                                                            </div>
                                                            <div className={`text-xs px-2 py-1 rounded ${result.correct ? 'bg-green-500/20 text-green-300' : 'bg-red-500/20 text-red-300'}`}>
                                                                {result.correct ? '✓ صحيح' : '✗ خطأ'}
                                                            </div>
                                                        </>
                                                    ) : (
                                                        <div className="text-yellow-500">
                                                            <Icon name="clock" size={24} className="mx-auto mb-1" />
                                                            <span className="text-xs">قيد التصحيح</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 🃏 Flashcard Component
        const Flashcard = ({ question, answer }) => {
            const [flipped, setFlipped] = useState(false);
            return (
                <div className="flashcard-container">
                    <div className={`flashcard ${flipped ? 'flipped' : ''}`} onClick={() => setFlipped(!flipped)}>
                        <div className="flashcard-front">
                            <div>
                                <Icon name="help-circle" size={32} className="text-blue-400 mb-3 mx-auto" />
                                <p className="text-lg font-bold">{question}</p>
                                <p className="text-xs text-slate-400 mt-2">اضغط للإجابة</p>
                            </div>
                        </div>
                        <div className="flashcard-back">
                            <div>
                                <Icon name="lightbulb" size={32} className="text-yellow-400 mb-3 mx-auto" />
                                <p className="text-lg font-bold">{answer}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 🏆 Rank Badge Component
        const RankBadge = ({ points }) => {
            let rank, rankClass;
            if (points >= 200) { rank = 'أسطوري'; rankClass = 'rank-legend'; }
            else if (points >= 51) { rank = 'متقدم'; rankClass = 'rank-advanced'; }
            else { rank = 'مبتدئ'; rankClass = 'rank-novice'; }
            return (
                <span className={`${rankClass} px-3 py-1 rounded-full text-xs font-bold`}>
                    {rank}
                </span>
            );
        };

        // 🔒 Locked Content Overlay
        const LockedOverlay = ({ message = 'المحتوى مغلق' }) => (
            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-10 rounded-xl">
                <div className="text-center">
                    <div className="glass-icon mx-auto mb-2"><Icon name="lock" size={32} /></div>
                    <p className="font-bold">{message}</p>
                </div>
            </div>
        );

        // 🔐 Admin Password Prompt
        const AdminPasswordPrompt = ({ onSubmit, onBack }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState(false);
            return (
                <div className="min-h-screen bg-brand-dark flex items-center justify-center p-4">
                    <div className="glass-panel p-8 w-full max-w-md text-center">
                        <GlassIcon name="shield" size={48} className="mx-auto mb-4" />
                        <h2 className="text-2xl font-bold mb-2">منطقة محمية</h2>
                        <p className="text-slate-400 mb-6">أدخل كلمة السر للوصول لبيانات الطلاب</p>
                        <input
                            type="password"
                            value={password}
                            onChange={e => { setPassword(e.target.value); setError(false); }}
                            className={`w-full p-4 bg-white/5 border ${error ? 'border-red-500' : 'border-white/10'} rounded-xl mb-4 text-center text-2xl tracking-widest`}
                            placeholder="••••••••"
                        />
                        {error && <p className="text-red-400 text-sm mb-4">كلمة السر غلط!</p>}
                        <div className="flex gap-3">
                            <button onClick={onBack} className="flex-1 py-3 bg-white/10 rounded-xl font-bold">رجوع</button>
                            <button onClick={() => {
                                if (password === ADMIN_SECRET_PASSWORD) onSubmit();
                                else setError(true);
                            }} className="flex-1 btn-main py-3 rounded-xl">دخول</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 📅 Attendance Table Component (for Admin)
        const AttendanceTable = ({ students, attendance, onUpdateAttendance, isSuperAdmin }) => {
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="flex justify-between items-center glass-panel p-4">
                        <h2 className="text-xl font-bold flex items-center gap-2">
                            <Icon name="calendar-check" /> الحضور والمتابعة
                        </h2>
                        <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)}
                            className="bg-black/20 border border-white/10 text-white rounded-lg px-3 py-2 cursor-pointer" />
                    </div>

                    <div className="glass-panel overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right min-w-[800px]">
                                <thead className="bg-white/5 text-slate-300">
                                    <tr>
                                        <th className="p-4">الطالب</th>
                                        <th className="p-4">الحالة</th>
                                        <th className="p-4">المستوى</th>
                                        <th className="p-4">إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5">
                                    {students.filter(s => !['admin', 'boss'].includes(s.role)).map(student => {
                                        const record = attendance[student.id]?.[selectedDate] || {};
                                        return (
                                            <tr key={student.id} className="hover:bg-white/5 transition">
                                                <td className="p-4 font-bold">{student.name}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded text-xs ${record.status === 'present' ? 'bg-green-500/20 text-green-300' : record.status === 'absent' ? 'bg-red-500/20 text-red-300' : 'bg-slate-500/20 text-slate-400'}`}>
                                                        {record.status === 'present' ? 'حاضر' : record.status === 'absent' ? 'غائب' : '-'}
                                                    </span>
                                                </td>
                                                <td className="p-4">

                                                            <button onClick={() => onUpdateAttendance(student.id, selectedDate, record.status || 'present', 'good')} className="block w-full text-right px-4 py-2 hover:bg-white/10 text-blue-400 text-xs">جيد</button>
                                                            <button onClick={() => onUpdateAttendance(student.id, selectedDate, record.status || 'present', 'needsWork')} className="block w-full text-right px-4 py-2 hover:bg-white/10 text-yellow-400 text-xs">يحتاج متابعة</button>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>

                            </table>
                        </div>
                    </div>
                </div>
            );

        // 👥 Admin Management Component
        const AdminManagement = ({ admins, onAddAdmin, onRemoveAdmin, isSuperAdmin, showNotification }) => {
            const [showAddForm, setShowAddForm] = useState(false);
            const [newAdminEmail, setNewAdminEmail] = useState('');
            const [newAdminRole, setNewAdminRole] = useState('admin');
            const [managerPassword, setManagerPassword] = useState('');
            const [passwordError, setPasswordError] = useState(false);

            const handleAddAdmin = () => {
                if (managerPassword !== MANAGER_PASSWORD) {
                    setPasswordError(true);
                    return;
                }
                if (!newAdminEmail) {
                    showNotification('أدخل إيميل الأدمن', 'error');
                    return;
                }
                onAddAdmin(newAdminEmail, newAdminRole);
                setShowAddForm(false);
                setNewAdminEmail('');
                setManagerPassword('');
                setPasswordError(false);
            };

            if (!isSuperAdmin) {
                return (
                    <div className="glass-panel p-8 text-center">
                        <div className="glass-icon mx-auto mb-4"><Icon name="lock" size={32} /></div>
                        <h3 className="text-xl font-bold mb-2">صلاحية غير متاحة</h3>
                        <p className="text-slate-400">هذا القسم متاح للمدير الأعلى فقط</p>

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="flex items-center justify-between">

                            إدارة المديرين

                        <button onClick={() => setShowAddForm(true)} className="btn-main px-6 py-2 rounded-xl font-bold flex items-center gap-2">
                            <Icon name="user-plus" size={18} /> إضافة مدير
                        </button>
                    </div>

                    <div className="glass-panel p-6">
                        <h3 className="font-bold mb-4 flex items-center gap-2">
                            <Icon name="users" size={18} /> المديرين الحاليين
                        </h3>
                        <div className="space-y-3">
                            {admins.map(admin => (
                                <div key={admin.id} className="bg-white/5 p-4 rounded-xl flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <img src={admin.photo} className="w-12 h-12 rounded-full border-2 border-brand-accent" />
                                        <div>
                                            <p className="font-bold">{admin.name}</p>
                                            <p className="text-xs text-slate-400">{admin.email}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${admin.email === SUPER_ADMIN_EMAIL ? 'bg-yellow-500/20 text-yellow-300' : 'bg-blue-500/20 text-blue-300'
                                            }`}>
                                            {admin.email === SUPER_ADMIN_EMAIL ? '👑 المدير الأعلى' : admin.role === 'boss' ? 'مدير' : 'مساعد'}
                                        </span>
                                        {admin.email !== SUPER_ADMIN_EMAIL && (
                                            <button onClick={() => onRemoveAdmin(admin.id)}
                                                className="p-2 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-red-300">
                                                <Icon name="trash-2" size={16} />
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {showAddForm && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={() => setShowAddForm(false)}>
                            <div className="glass-panel p-8 max-w-md w-full" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                                    <div className="glass-icon"><Icon name="user-plus" size={24} /></div>
                                    إضافة مدير جديد
                                </h3>

                                    <input
                                        type="email"
                                        placeholder="إيميل المدير الجديد"
                                        value={newAdminEmail}
                                        onChange={(e) => setNewAdminEmail(e.target.value)}
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none"
                                    />

                                    <select
                                        value={newAdminRole}
                                        onChange={(e) => setNewAdminRole(e.target.value)}
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none"
                                    >
                                        <option value="admin">مساعد</option>
                                        <option value="boss">مدير</option>
                                    </select>

                                    <input
                                        type="password"
                                        placeholder="كلمة سر المدير الأعلى"
                                        value={managerPassword}
                                        onChange={(e) => { setManagerPassword(e.target.value); setPasswordError(false); }}
                                        className={`w-full p-4 bg-white/5 border ${passwordError ? 'border-red-500' : 'border-white/10'} rounded-xl outline-none text-center tracking-widest`}

                                    {passwordError && <p className="text-red-400 text-sm text-center">كلمة السر غلط!</p>}

                                    <div className="flex gap-3">
                                        <button onClick={() => setShowAddForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl font-bold">إلغاء</button>

                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ✅ Updated Lecture Manager with Course selection
        const LectureManager = ({ courses, onAddLecture, onDeleteLecture, isSuperAdmin }) => {
            const [showAddForm, setShowAddForm] = useState(false);
            const [newLecture, setNewLecture] = useState({
                title: '',
                link: '',
                description: '',
                grade: '1sec',
                courseId: '',
                isFree: false
            });

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setNewLecture({
                    ...newLecture,
                    [name]: type === 'checkbox' ? checked : value

            };

            const handleSubmit = () => {
                if (!newLecture.title || !newLecture.link || !newLecture.courseId) {
                    alert('يرجى ملء جميع الحقول المطلوبة');
                    return;
                }
                onAddLecture(newLecture);
                setShowAddForm(false);
                setNewLecture({
                    title: '',
                    link: '',
                    description: '',
                    grade: '1sec',
                    courseId: '',
                    isFree: false
                });
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold flex items-center gap-2">
                            <GlassIcon name="video" size={24} /> إدارة المحاضرات
                        </h2>
                        <button onClick={() => setShowAddForm(true)} className="btn-main px-6 py-2 rounded-xl font-bold flex items-center gap-2">
                            <Icon name="plus" size={18} /> إضافة محاضرة
                        </button>
                    </div>
                    
                    {showAddForm && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={() => setShowAddForm(false)}>

                                <h3 className="text-2xl font-bold mb-6">إضافة محاضرة جديدة</h3>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold mb-2">عنوان المحاضرة</label>
                                        <input
                                            name="title"
                                            value={newLecture.title}
                                            onChange={handleInputChange}
                                            className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                            placeholder="مثال: شرح درس الميزان الصرفي"
                                        />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold mb-2">رابط الفيديو</label>
                                        <input
                                            name="link"
                                            value={newLecture.link}
                                            onChange={handleInputChange}
                                            className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                            placeholder="رابط YouTube أو MP4 مباشر"
                                        />
                                        <p className="text-xs text-slate-400 mt-1">يدعم: YouTube, youtu.be, MP4 مباشر</p>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold mb-2">الوصف</label>
                                        <textarea
                                            name="description"
                                            value={newLecture.description}
                                            onChange={handleInputChange}
                                            className="w-full p-3 bg-white/5 border border-white/10 rounded-xl h-24 resize-none"
                                            placeholder="وصف مختصر للمحاضرة"
                                        />
                                    </div>
                                    
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold mb-2">الصف</label>
                                            <select
                                                name="grade"
                                                value={newLecture.grade}
                                                onChange={handleInputChange}
                                                className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                            >
                                                <option value="1sec">أولى ثانوي</option>
                                                <option value="2sec">تانية ثانوي</option>
                                                <option value="3sec">تالتة ثانوي</option>
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-bold mb-2">الكورس</label>
                                            <select
                                                name="courseId"
                                                value={newLecture.courseId}
                                                onChange={handleInputChange}
                                                className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                            >
                                                <option value="">-- اختر كورس --</option>
                                                {courses.map(course => (
                                                    <option key={course.id} value={course.id}>
                                                        {course.title} ({course.grade === '1sec' ? 'أولى' : course.grade === '2sec' ? 'تانية' : 'تالتة'})
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center gap-2">
                                        <input
                                            type="checkbox"
                                            name="isFree"
                                            id="isFree"
                                            checked={newLecture.isFree}
                                            onChange={handleInputChange}
                                            className="w-5 h-5"
                                        />
                                        <label htmlFor="isFree">محاضرة مجانية (يمكن للجميع مشاهدتها)</label>
                                    </div>
                                    
                                    <div className="flex gap-3 pt-4">
                                        <button onClick={() => setShowAddForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl font-bold">
                                            إلغاء
                                        </button>
                                        <button onClick={handleSubmit} className="flex-1 btn-main py-3 rounded-xl font-bold">
                                            إضافة المحاضرة
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* قائمة المحاضرات */}
                    <div className="grid gap-4">
                        {/* سيتم عرض المحاضرات هنا */}
                    </div>
                </div>
            );
        };

        // ✅ Updated Whiteboard Manager with Grade selection
        const WhiteboardManager = ({ whiteboards, onAddWhiteboard, onDeleteWhiteboard }) => {
            const [showAddForm, setShowAddForm] = useState(false);
            const [newWhiteboard, setNewWhiteboard] = useState({
                title: '',
                link: '',
                grade: '1sec'
            });

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setNewWhiteboard({ ...newWhiteboard, [name]: value });
            };

            const handleSubmit = () => {
                if (!newWhiteboard.title || !newWhiteboard.link) {
                    alert('يرجى ملء جميع الحقول');
                    return;
                }
                onAddWhiteboard(newWhiteboard);
                setShowAddForm(false);
                setNewWhiteboard({ title: '', link: '', grade: '1sec' });
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold flex items-center gap-2">
                            <GlassIcon name="file-text" size={24} /> إدارة السبورات
                        </h2>
                        <button onClick={() => setShowAddForm(true)} className="btn-main px-6 py-2 rounded-xl font-bold flex items-center gap-2">
                            <Icon name="plus" size={18} /> إضافة سبورة
                        </button>
                    </div>
                    
                    {showAddForm && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={() => setShowAddForm(false)}>
                            <div className="glass-panel p-8 max-w-md w-full" onClick={e => e.stopPropagation()}>
                                <h3 className="text-2xl font-bold mb-6">إضافة سبورة جديدة</h3>
                                
                                <div className="space-y-4">
                                    <input
                                        name="title"
                                        value={newWhiteboard.title}
                                        onChange={handleInputChange}
                                        placeholder="عنوان السبورة"
                                        className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                    />
                                    
                                    <input
                                        name="link"
                                        value={newWhiteboard.link}
                                        onChange={handleInputChange}
                                        placeholder="رابط الصورة أو PDF"
                                        className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                    />
                                    
                                    <select
                                        name="grade"
                                        value={newWhiteboard.grade}
                                        onChange={handleInputChange}
                                        className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                    >
                                        <option value="1sec">الصف الأول الثانوي</option>
                                        <option value="2sec">الصف الثاني الثانوي</option>
                                        <option value="3sec">الصف الثالث الثانوي</option>
                                    </select>
                                    
                                    <div className="flex gap-3 pt-4">
                                        <button onClick={() => setShowAddForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl font-bold">
                                            إلغاء
                                        </button>
                                        <button onClick={handleSubmit} className="flex-1 btn-main py-3 rounded-xl font-bold">
                                            إضافة السبورة
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ✅ Updated Whiteboards Gallery with Grade filter
        const WhiteboardsGallery = ({ whiteboards, userGrade }) => {
            const [filterGrade, setFilterGrade] = useState('all');
            
            const filteredWhiteboards = whiteboards.filter(wb => {
                if (filterGrade !== 'all' && wb.grade !== filterGrade) return false;
                if (userGrade && wb.grade !== userGrade && wb.grade !== 'all') return false;
                return true;
            });
            
            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="glass-icon bg-purple-500/20 text-purple-500 border-purple-500/30">
                            <Icon name="image" size={24} />
                        </div>
                        <h2 className="text-2xl font-bold">السبورات والمذكرات</h2>
                    </div>
                    
                    {/* فلترة السبورات */}
                    <div className="flex gap-2 mb-4">
                        {['all', '1sec', '2sec', '3sec'].map(g => (
                            <button
                                key={g}
                                onClick={() => setFilterGrade(g)}
                                className={`px-4 py-2 rounded-xl font-bold transition ${
                                    filterGrade === g 
                                        ? 'bg-brand-primary text-white' 
                                        : 'bg-white/5 text-slate-400 hover:bg-white/10'
                                }`}
                            >
                                {g === 'all' ? 'الكل' : g === '1sec' ? 'أولى' : g === '2sec' ? 'تانية' : 'تالتة'}
                            </button>
                        ))}
                    </div>
                    
                    {filteredWhiteboards.length === 0 ? (
                        <div className="text-center py-12 text-slate-500">لا توجد سبورات حالياً</div>
                    ) : (
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            {filteredWhiteboards.map(wb => (
                                <div key={wb.id} className="glass-panel p-0 overflow-hidden group hover:-translate-y-1 transition duration-500">
                                    <div className="h-48 bg-slate-900 relative">
                                        <img src={wb.link} className="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-500" onError={(e) => { e.target.src = 'https://placehold.co/400x300?text=PDF'; }} />
                                        <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition backdrop-blur-sm">
                                            <a href={wb.link} target="_blank" className="bg-white text-black px-6 py-2 rounded-full font-bold flex items-center gap-2 hover:scale-105 transition">
                                                <Icon name="external-link" size={18} /> فتح
                                            </a>
                                        </div>
                                        <span className="absolute top-2 left-2 bg-brand-primary/80 text-white px-2 py-1 rounded text-xs">
                                            {wb.grade === '1sec' ? 'أولى' : wb.grade === '2sec' ? 'تانية' : 'تالتة'}
                                        </span>
                                    </div>
                                    <div className="p-4 border-t border-white/5">
                                        <h4 className="font-bold text-sm truncate">{wb.title}</h4>
                                        <span className="text-xs text-slate-400 mt-1 block">{wb.date}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ✅ دالة التحقق من صلاحية المحاضرة
        const isLectureAllowed = (lecture, user) => {
            if (!user) return false;
            
            // إذا كانت المحاضرة مجانية، الجميع يشوفها
            if (lecture.isFree) return true;
            
            // التحقق من أن الطالب مشترك في الكورس
            const userEnrolledCourses = user.enrolledCourses || [];
            return userEnrolledCourses.includes(lecture.courseId);
        };

        const RecordingsGallery = ({ recordings }) => (
            <div className="space-y-6 animate-slide-up">
                <div className="flex items-center gap-3 mb-6">
                    <div className="glass-icon bg-red-500/20 text-red-500 border-red-500/30">
                        <Icon name="mic" size={24} />
                    </div>
                    <h2 className="text-2xl font-bold">المكتبة الصوتية</h2>
                </div>
                {recordings.length === 0 ? (
                    <div className="text-center py-12 text-slate-500">لا توجد تسجيلات حالياً</div>
                ) : (
                    <div className="grid md:grid-cols-2 gap-4">
                        {recordings.map(rec => (
                            <div key={rec.id} className="glass-panel p-4 flex items-center gap-4 group hover:bg-white/5 transition">
                                <div className="w-12 h-12 rounded-full bg-brand-accent/10 flex items-center justify-center text-brand-accent group-hover:bg-brand-accent group-hover:text-white transition">
                                    <Icon name="play" size={24} />
                                </div>
                                <div className="flex-1">
                                    <h4 className="font-bold mb-2">{rec.title}</h4>
                                    <audio src={rec.link} controls className="w-full h-8 opacity-80 hover:opacity-100 transition" />
                                    <p className="text-xs text-slate-500 mt-2">{rec.date}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        // ✅ FIXED: ThemeToggle with proper RTL handling
        const ThemeToggle = ({ isDark, onToggle }) => (
            <button
                onClick={() => onToggle(!isDark)}
                className={`relative w-16 h-8 rounded-full transition-colors duration-300 flex items-center px-1 ${isDark ? 'bg-slate-700 justify-end' : 'bg-blue-300 justify-start'}`}
            >
                <div className="w-6 h-6 rounded-full shadow-md bg-white text-yellow-500 flex items-center justify-center transform transition-transform">
                    <Icon name={isDark ? "moon" : "sun"} size={14} className={isDark ? "text-slate-800" : "text-yellow-500"} />
                </div>
            </button>
        );

        // Main App Component
        const App = () => {
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [user, setUser] = useState(null);
            const [userType, setUserType] = useState(null);
            const [view, setView] = useState('loading');
            const [isDataCenterUnlocked, setIsDataCenterUnlocked] = useState(false);
            const [dataState, setDataState] = useState({
                students: [], requests: [], lectures: [], whiteboards: [],
                qa: [], exams: [], announcements: [], payments: [], subscriptions: {},
                flashcards: [], recordings: [], attendance: {}, courses: []
            });

            const [regData, setRegData] = useState({
                phone: '', parentPhone: '', school: '', governorate: '', city: '',
                grade: '1sec', accountType: 'student', linkedStudentEmail: '',
                firstName: '', fatherName: '', grandfatherName: '', bio: ''
            });

            const [showHelpMessage, setShowHelpMessage] = useState(false);
            const [showHelpTour, setShowHelpTour] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [studentYearFilter, setStudentYearFilter] = useState('all');
            const [selectedLecture, setSelectedLecture] = useState(null);
            const [currentLectureStep, setCurrentLectureStep] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [notification, setNotification] = useState(null);
            const [showStudentModal, setShowStudentModal] = useState(false);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [examBuilderType, setExamBuilderType] = useState(null);
            const [previewAsStudent, setPreviewAsStudent] = useState(false);
            const [showPhoneLogin, setShowPhoneLogin] = useState(false);
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);
            const isSuperAdmin = user?.email === SUPER_ADMIN_EMAIL;
            const [lectureGradeFilter, setLectureGradeFilter] = useState('all');
            const [showExamBuilder, setShowExamBuilder] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [selectedCourse, setSelectedCourse] = useState(null);
            const [selectedExam, setSelectedExam] = useState(null);
            const [showExamsList, setShowExamsList] = useState(false);

                                <div className="glass-panel p-6 max-w-sm text-center mt-2 border border-brand-accent/30 shadow-2xl">
                                    <div className="flex items-center justify-center gap-2 mb-3">
                                        <span className="text-3xl">♞</span>
                                        <Icon name="arrow-up" size={24} className="text-brand-accent" />
                                    </div>
                                    <h4 className="font-bold text-xl text-white mb-2">ابدأ رحلتك من هنا!</h4>
                                    <p className="text-slate-300 leading-relaxed mb-4">
                                        سجل دخولك في منصة <span className="text-brand-accent font-bold">سبيل التفوق</span> وابدأ مشوارك نحو التميز في اللغة العربية
                                    </p>
                                    <button
                                        onClick={(e) => { e.stopPropagation(); handleGoogleLogin(); setShowHelpTour(false); }}
                                        className="btn-main px-6 py-3 rounded-xl font-bold w-full flex items-center justify-center gap-2"
                                    >
                                        <Icon name="log-in" size={18} /> تسجيل الدخول الآن
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedCourse && (
                        <CoursePurchaseModal 
                            course={selectedCourse} 
                            onClose={() => setSelectedCourse(null)} 
                            teacherNumber={CONTACT_INFO.vodafoneNumber} 
                            user={user}
                            onRequireLogin={() => {
                                setSelectedCourse(null);
                                showNotification('يجب تسجيل الدخول أو إنشاء حساب أولاً لإتمام الاشتراك', 'info');
                                setShowLoginModal(true);
                            }}
                        />
                    )}
                </div>
            );

            if (view === 'waiting-approval') return (
                <div className="min-h-screen bg-brand-dark flex items-center justify-center p-4">
                    <div className="glass-panel p-6 md:p-10 max-w-lg w-full text-center animate-slide-up border-t-4 border-yellow-500 space-y-6">
                        <div className="w-16 h-16 md:w-20 md:h-20 bg-yellow-500/20 rounded-full flex items-center justify-center mx-auto animate-pulse">
                            <span className="text-4xl md:text-5xl">♞</span>
                        </div>

                        <h2 className="text-2xl md:text-3xl font-black text-white">الحساب قيد المراجعة ⏳</h2>

                        <div className="bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-4 md:p-6">
                            <p className="text-slate-200 leading-relaxed text-base md:text-lg font-bold">
                                ♞ تم استلام بياناتك بنجاح!
                            </p>
                            <p className="text-slate-300 leading-relaxed text-sm md:text-base mt-2">
                                حسابك الآن قيد المراجعة من قبل الإدارة.
                                <br />
                                سيتم تفعيل حسابك خلال <span className="text-yellow-400 font-bold">ساعات قليلة</span>.
                            </p>
                        </div>

                        <div className="bg-white/5 p-4 rounded-xl border border-white/10">
                            <p className="text-sm text-slate-400">
                                💡 سيتم تفعيل حسابك تلقائياً دون الحاجة لإعادة التسجيل.
                            </p>
                        </div>

                        <div className="flex flex-col gap-3">
                            <button
                                onClick={() => window.location.reload()}
                                className="bg-brand-accent/20 hover:bg-brand-accent/30 text-brand-accent px-6 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2"
                            >
                                <GlassIcon name="refresh-cw" size={18} />
                                اضغط هنا للتحديث
                            </button>
                            <button
                                onClick={() => window.authMethods.signOut(window.auth)}
                                className="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-6 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2"
                            >
                                <GlassIcon name="log-out" size={18} />
                                تسجيل خروج
                            </button>
                        </div>
                    </div>
                </div>
            );

                        </div>

                        <div className="space-y-4">
                            <div className="flex gap-4 mb-6">
                                <button onClick={() => setRegData({ ...regData, accountType: 'student' })}

                                    <GlassIcon name="user" size={24} className="mx-auto mb-2" />
                                    <p className="font-bold">طالب</p>
                                </button>
                                <button onClick={() => setRegData({ ...regData, accountType: 'parent' })}
                                    className={`flex-1 p-4 rounded-xl border-2 transition ${regData.accountType === 'parent' ? 'border-brand-accent bg-brand-accent/10' : 'border-white/10'}`}>
                                    <GlassIcon name="users" size={24} className="mx-auto mb-2" />
                                    <p className="font-bold">ولي أمر</p>
                                </button>
                            </div>

                            <div className="glass-panel p-4 border border-white/10">
                                <h4 className="text-sm font-bold text-brand-accent mb-3 flex items-center gap-2">
                                    <Icon name="user" size={16} /> الاسم الثلاثي (باللغة العربية)
                                </h4>
                                <div className="grid md:grid-cols-3 gap-4">
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white text-center focus:border-brand-accent transition" 
                                        placeholder="الاسم الأول"
                                        value={regData.firstName}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^[\u0600-\u06FFa-zA-Z\s]*$/.test(val)) setRegData({ ...regData, firstName: val });
                                        }} 
                                    />
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white text-center focus:border-brand-accent transition" 
                                        placeholder="اسم الأب"
                                        value={regData.fatherName}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^[\u0600-\u06FFa-zA-Z\s]*$/.test(val)) setRegData({ ...regData, fatherName: val });
                                        }} 
                                    />
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white text-center focus:border-brand-accent transition" 
                                        placeholder="اسم الجد"
                                        value={regData.grandfatherName}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^[\u0600-\u06FFa-zA-Z\s]*$/.test(val)) setRegData({ ...regData, grandfatherName: val });
                                        }} 
                                    />
                                </div>
                                <p className="text-xs text-slate-500 mt-2 text-center">⚠️ يرجى كتابة الاسم بدون أرقام أو رموز</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="relative">
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                        placeholder="رقم تليفونك (11 رقم)" 
                                        maxLength="11"
                                        value={regData.phone}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^\d*$/.test(val)) setRegData({ ...regData, phone: val });
                                            else showNotification('أرقام فقط مسموح بها في الهاتف', 'error');
                                        }} 
                                    />
                                    <div className="absolute left-4 top-4 text-slate-500"><Icon name="smartphone" size={18}/></div>
                                </div>
                                <div className="relative">
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                        placeholder="رقم ولي الأمر (11 رقم)" 
                                        maxLength="11"
                                        value={regData.parentPhone}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^\d*$/.test(val)) setRegData({ ...regData, parentPhone: val });
                                            else showNotification('أرقام فقط مسموح بها', 'error');
                                        }} 
                                    />
                                    <div className="absolute left-4 top-4 text-slate-500"><Icon name="phone" size={18}/></div>
                                </div>
                            </div>

                            <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                placeholder="اسم المدرسة 🏫" 
                                value={regData.school}
                                onChange={e => setRegData({ ...regData, school: e.target.value })} 
                            />

                            <div className="grid md:grid-cols-2 gap-4">
                                <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                    placeholder="المحافظة 🗺️" 
                                    value={regData.governorate}
                                    onChange={e => setRegData({ ...regData, governorate: e.target.value })} 
                                />
                                <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                    placeholder="المدينة 📍" 
                                    value={regData.city}
                                    onChange={e => setRegData({ ...regData, city: e.target.value })} 
                                />
                            </div>

                            {regData.accountType === 'student' && (
                                <select className="w-full p-4 bg-black/30 border border-white/10 rounded-xl outline-none text-white appearance-none cursor-pointer" 
                                    onChange={e => setRegData({ ...regData, grade: e.target.value })} value={regData.grade}>
                                    <option value="1sec">الصف الأول الثانوي</option>
                                    <option value="2sec">الصف الثاني الثانوي</option>
                                    <option value="3sec">الصف الثالث الثانوي</option>
                                </select>
                            )}

                            {regData.accountType === 'parent' && (
                                <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white" 
                                    placeholder="إيميل الطالب المرتبط (اختياري)" 
                                    onChange={e => setRegData({ ...regData, linkedStudentEmail: e.target.value })} 
                                />
                            )}
