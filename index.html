                                        onClick={() => setYearFilter(y)}
                                        className={`px-4 py-2 rounded-lg text-sm font-bold transition ${yearFilter === y ? 'bg-brand-primary text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        {y === 'all' ? 'الكل' : y === '1sec' ? '1ث' : y === '2sec' ? '2ث' : '3ث'}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="glass-panel overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right min-w-[900px]">
                                <thead className="bg-white/5 text-slate-300">
                                    <tr>
                                        <th className="p-4">الطالب</th>
                                        <th className="p-4">الصف الدراسي</th>
                                        <th className="p-4">تاريخ الانتهاء</th>
                                        <th className="p-4">إجراءات المدير</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredStudents.map(student => {
                                        const daysLeft = student.subscriptionEnd ? Math.ceil((new Date(student.subscriptionEnd) - new Date()) / (1000 * 60 * 60 * 24)) : 0;

                                        return (
                                            <tr key={student.id} className="border-b border-white/5 hover:bg-white/5 transition">
                                                <td className="p-4">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 rounded-full bg-slate-700 overflow-hidden">
                                                            <img src={student.photo} className="w-full h-full object-cover" />
                                                        </div>
                                                        <div>
                                                            <p className="font-bold">{student.name}</p>
                                                            <p className="text-xs text-slate-400">{student.email}</p>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="p-4">
                                                    <span className="bg-brand-accent/10 text-brand-accent px-2 py-1 rounded text-xs font-bold">
                                                        {student.grade === '1sec' ? 'أولى ثانوي' : student.grade === '2sec' ? 'تانية ثانوي' : 'تالتة ثانوي'}
                                                    </span>
                                                </td>
                                                <td className="p-4 font-mono text-sm">
                                                    {student.isPaid && student.subscriptionEnd ? (
                                                        <div className={daysLeft > 0 ? "text-green-400" : "text-red-400"}>
                                                            {new Date(student.subscriptionEnd).toLocaleDateString('en-CA')}
                                                            <div className="text-xs opacity-70">
                                                                {daysLeft > 0 ? `باقي ${daysLeft} يوم` : 'منتهي'}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <span className="text-slate-500 font-bold">--</span>
                                                    )}
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex gap-2 flex-wrap">
                                                        {activatingId === student.id ? (
                                                            <span className="bg-yellow-500/20 text-yellow-400 px-4 py-1 rounded-lg text-xs font-bold animate-pulse">جاري التفعيل...</span>
                                                        ) : (
                                                            <>
                                                                <button 
                                                                    onClick={() => handleOpenAddSubscription(student)} 
                                                                    className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md"
                                                                    title="إضافة اشتراك جديد"
                                                                >
                                                                    <Icon name="plus-circle" size={14} /> إضافة
                                                                </button>
                                                                
                                                                <button 
                                                                    onClick={() => handleOpenActivation(student)} 
                                                                    className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md"
                                                                    title="تفعيل الاشتراك"
                                                                >
                                                                    <Icon name="zap" size={14} /> تفعيل
                                                                </button>
                                                                
                                                                <button 
                                                                    onClick={() => {
                                                                        if (confirm(`هل أنت متأكد من إلغاء اشتراك ${student.name}؟`)) {
                                                                            onDeactivate(student.id);
                                                                        }
                                                                    }} 
                                                                    className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md"
                                                                    title="إلغاء الاشتراك"
                                                                >
                                                                    <Icon name="x-circle" size={14} /> إلغاء
                                                                </button>
                                                            </>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const RecordingsGallery = ({ recordings }) => (
            <div className="space-y-6 animate-slide-up">
                <div className="flex items-center gap-3 mb-6">
                    <div className="glass-icon bg-red-500/20 text-red-500 border-red-500/30">
                        <Icon name="mic" size={24} />
                    </div>
                    <h2 className="text-2xl font-bold">المكتبة الصوتية</h2>
                </div>
                {recordings.length === 0 ? (
                    <div className="text-center py-12 text-slate-500">لا توجد تسجيلات حالياً</div>
                ) : (
                    <div className="grid md:grid-cols-2 gap-4">
                        {recordings.map(rec => (
                            <div key={rec.id} className="glass-panel p-4 flex items-center gap-4 group hover:bg-white/5 transition">
                                <div className="w-12 h-12 rounded-full bg-brand-accent/10 flex items-center justify-center text-brand-accent group-hover:bg-brand-accent group-hover:text-white transition">
                                    <Icon name="play" size={24} />
                                </div>
                                <div className="flex-1">
                                    <h4 className="font-bold mb-2">{rec.title}</h4>
                                    <audio src={rec.link} controls className="w-full h-8 opacity-80 hover:opacity-100 transition" />
                                    <p className="text-xs text-slate-500 mt-2">{rec.date}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const WhiteboardsGallery = ({ whiteboards }) => (
            <div className="space-y-6 animate-slide-up">
                <div className="flex items-center gap-3 mb-6">
                    <div className="glass-icon bg-purple-500/20 text-purple-500 border-purple-500/30">
                        <Icon name="image" size={24} />
                    </div>
                    <h2 className="text-2xl font-bold">السبورات والمذكرات</h2>
                </div>
                {whiteboards.length === 0 ? (
                    <div className="text-center py-12 text-slate-500">لا توجد سبورات حالياً</div>
                ) : (
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        {whiteboards.map(wb => (
                            <div key={wb.id} className="glass-panel p-0 overflow-hidden group hover:-translate-y-1 transition duration-500">
                                <div className="h-48 bg-slate-900 relative">
                                    <img src={wb.link} className="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-500" onError={(e) => { e.target.src = 'https://placehold.co/400x300?text=PDF'; }} />
                                    <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition backdrop-blur-sm">
                                        <a href={wb.link} target="_blank" className="bg-white text-black px-6 py-2 rounded-full font-bold flex items-center gap-2 hover:scale-105 transition">
                                            <Icon name="external-link" size={18} /> فتح
                                        </a>
                                    </div>
                                </div>
                                <div className="p-4 border-t border-white/5">
                                    <h4 className="font-bold text-sm truncate">{wb.title}</h4>
                                    <span className="text-xs text-slate-400 mt-1 block">{wb.date}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const ThemeToggle = ({ isDark, onToggle }) => (
            <button
                onClick={() => onToggle(!isDark)}
                className={`relative w-16 h-8 rounded-full transition-colors duration-300 flex items-center px-1 ${isDark ? 'bg-slate-700' : 'bg-blue-300'}`}
            >
                <div className={`w-6 h-6 rounded-full shadow-md transform transition-transform duration-300 flex items-center justify-center ${isDark ? 'translate-x-0 bg-black text-white' : 'translate-x-8 bg-white text-yellow-500'}`}>
                    <Icon name={isDark ? "moon" : "sun"} size={14} />
                </div>
            </button>
        );

        // Main App Component
        const App = () => {
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [user, setUser] = useState(null);
            const [userType, setUserType] = useState(null);
            const [view, setView] = useState('loading');
            const [isDataCenterUnlocked, setIsDataCenterUnlocked] = useState(false);
            const [dataState, setDataState] = useState({
                students: [], requests: [], lectures: [], whiteboards: [],
                qa: [], exams: [], announcements: [], payments: [], subscriptions: {},
                flashcards: [], recordings: [], attendance: {}, courses: []
            });

            // FIX 1: Added 'bio: ''' to the initial state object
            const [regData, setRegData] = useState({
                phone: '', parentPhone: '', school: '', governorate: '', city: '',
                grade: '1sec', accountType: 'student', linkedStudentEmail: '',
                firstName: '', fatherName: '', grandfatherName: '', bio: ''
            });

            const [showHelpMessage, setShowHelpMessage] = useState(false);
            const [showHelpTour, setShowHelpTour] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [studentYearFilter, setStudentYearFilter] = useState('all');
            const [selectedLecture, setSelectedLecture] = useState(null);

            if (view === 'waiting-approval') return (
                <div className="min-h-screen bg-brand-dark flex items-center justify-center p-4">
                    <div className="glass-panel p-6 md:p-10 max-w-lg w-full text-center animate-slide-up border-t-4 border-yellow-500 space-y-6">
                        <div className="w-16 h-16 md:w-20 md:h-20 bg-yellow-500/20 rounded-full flex items-center justify-center mx-auto animate-pulse">
                            <span className="text-4xl md:text-5xl">♞</span>
                        </div>

                        <h2 className="text-2xl md:text-3xl font-black text-white">الحساب قيد المراجعة ⏳</h2>

                        <div className="bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-4 md:p-6">
                            <p className="text-slate-200 leading-relaxed text-base md:text-lg font-bold">
                                ♞ تم استلام بياناتك بنجاح!
                            </p>
                            <p className="text-slate-300 leading-relaxed text-sm md:text-base mt-2">
                                حسابك الآن قيد المراجعة من قبل الإدارة.
                                <br />
                                سيتم تفعيل حسابك خلال <span className="text-yellow-400 font-bold">ساعات قليلة</span>.
                            </p>
                        </div>

                        <div className="bg-white/5 p-4 rounded-xl border border-white/10">
                            <p className="text-sm text-slate-400">
                                💡 سيتم تفعيل حسابك تلقائياً دون الحاجة لإعادة التسجيل.
                            </p>
                        </div>

                        <div className="flex flex-col gap-3">
                            <button
                                onClick={() => window.location.reload()}
                                className="bg-brand-accent/20 hover:bg-brand-accent/30 text-brand-accent px-6 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2"
                            >
                                <GlassIcon name="refresh-cw" size={18} />
                                اضغط هنا للتحديث
                            </button>
                            <button
                                onClick={() => window.authMethods.signOut(window.auth)}
                                className="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-6 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2"
                            >
                                <GlassIcon name="log-out" size={18} />
                                تسجيل خروج
                            </button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'complete-profile') return (
                <div className="min-h-screen bg-brand-dark flex items-center justify-center p-4">
                    <div className="glass-panel p-8 w-full max-w-2xl animate-slide-up border-t-4 border-brand-accent">
                        <div className="text-center mb-8">
                            <img src={user?.photo || 'https://via.placeholder.com/150'} className="w-20 h-20 rounded-full mx-auto mb-4 border-4 border-brand-accent" />
                            <h2 className="text-3xl font-bold text-white mb-2">أهلاً بك يا بطل! 👋</h2>
                            <p className="text-slate-400">استكمل بياناتك بدقة عشان طلبك يوصل للإدارة</p>
                        </div>

                        <div className="space-y-4">
                            {/* نوع الحساب */}
                            <div className="flex gap-4 mb-6">
                                <button onClick={() => setRegData({ ...regData, accountType: 'student' })}
                                    className={`flex-1 p-4 rounded-xl border-2 transition ${regData.accountType === 'student' ? 'border-brand-accent bg-brand-accent/10' : 'border-white/10'}`}>
                                    <GlassIcon name="user" size={24} className="mx-auto mb-2" />
                                    <p className="font-bold">طالب</p>
                                </button>
                                <button onClick={() => setRegData({ ...regData, accountType: 'parent' })}
                                    className={`flex-1 p-4 rounded-xl border-2 transition ${regData.accountType === 'parent' ? 'border-brand-accent bg-brand-accent/10' : 'border-white/10'}`}>
                                    <GlassIcon name="users" size={24} className="mx-auto mb-2" />
                                    <p className="font-bold">ولي أمر</p>
                                </button>
                            </div>

                            {/* الاسم الثلاثي - حروف فقط */}
                            <div className="glass-panel p-4 border border-white/10">
                                <h4 className="text-sm font-bold text-brand-accent mb-3 flex items-center gap-2">
                                    <Icon name="user" size={16} /> الاسم الثلاثي (باللغة العربية)
                                </h4>
                                <div className="grid md:grid-cols-3 gap-4">
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white text-center focus:border-brand-accent transition" 
                                        placeholder="الاسم الأول"
                                        value={regData.firstName}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^[\u0600-\u06FFa-zA-Z\s]*$/.test(val)) setRegData({ ...regData, firstName: val });
                                        }} 
                                    />
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white text-center focus:border-brand-accent transition" 
                                        placeholder="اسم الأب"
                                        value={regData.fatherName}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^[\u0600-\u06FFa-zA-Z\s]*$/.test(val)) setRegData({ ...regData, fatherName: val });
                                        }} 
                                    />
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white text-center focus:border-brand-accent transition" 
                                        placeholder="اسم الجد"
                                        value={regData.grandfatherName}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^[\u0600-\u06FFa-zA-Z\s]*$/.test(val)) setRegData({ ...regData, grandfatherName: val });
                                        }} 
                                    />
                                </div>
                                <p className="text-xs text-slate-500 mt-2 text-center">⚠️ يرجى كتابة الاسم بدون أرقام أو رموز</p>
                            </div>

                            {/* أرقام الهواتف - أرقام فقط */}
                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="relative">
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                        placeholder="رقم تليفونك (11 رقم)" 
                                        maxLength="11"
                                        value={regData.phone}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^\d*$/.test(val)) setRegData({ ...regData, phone: val });
                                            else showNotification('أرقام فقط مسموح بها في الهاتف', 'error');
                                        }} 
                                    />
                                    <div className="absolute left-4 top-4 text-slate-500"><Icon name="smartphone" size={18}/></div>
                                </div>
                                <div className="relative">
                                    <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                        placeholder="رقم ولي الأمر (11 رقم)" 
                                        maxLength="11"
                                        value={regData.parentPhone}
                                        onChange={e => {
                                            const val = e.target.value;
                                            if (/^\d*$/.test(val)) setRegData({ ...regData, parentPhone: val });
                                            else showNotification('أرقام فقط مسموح بها', 'error');
                                        }} 
                                    />
                                    <div className="absolute left-4 top-4 text-slate-500"><Icon name="phone" size={18}/></div>
                                </div>
                            </div>

                            {/* بيانات المدرسة والعنوان */}
                            <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                placeholder="اسم المدرسة 🏫" 
                                value={regData.school}
                                onChange={e => setRegData({ ...regData, school: e.target.value })} 
                            />

                            <div className="grid md:grid-cols-2 gap-4">
                                <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                    placeholder="المحافظة 🗺️" 
                                    value={regData.governorate}
                                    onChange={e => setRegData({ ...regData, governorate: e.target.value })} 
                                />
                                <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white focus:border-brand-accent transition" 
                                    placeholder="المدينة 📍" 
                                    value={regData.city}
                                    onChange={e => setRegData({ ...regData, city: e.target.value })} 
                                />
                            </div>

                            {regData.accountType === 'student' && (
                                <select className="w-full p-4 bg-black/30 border border-white/10 rounded-xl outline-none text-white appearance-none cursor-pointer" 
                                    onChange={e => setRegData({ ...regData, grade: e.target.value })} value={regData.grade}>
                                    <option value="1sec">الصف الأول الثانوي</option>
                                    <option value="2sec">الصف الثاني الثانوي</option>
                                    <option value="3sec">الصف الثالث الثانوي</option>
                                </select>
                            )}

                            {regData.accountType === 'parent' && (
                                <input className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-white" 
                                    placeholder="إيميل الطالب المرتبط (اختياري)" 
                                    onChange={e => setRegData({ ...regData, linkedStudentEmail: e.target.value })} 
                                />
                            )}

                            <div className="glass-panel p-4 border border-blue-500/20">
                                <h4 className="text-sm font-bold text-blue-400 mb-3 flex items-center gap-2">
                                    <Icon name="edit-3" size={16} /> ♞ نبذة عنك (إجباري)
                                </h4>
                                <textarea
                                    placeholder="اكتب وصف لنفسك... من أنت؟ وما هو هدفك؟ (للمساعدة في قبولك)"
                                    className="w-full p-4 bg-white/5 border border-blue-500/20 rounded-xl outline-none text-white h-24 resize-none placeholder-slate-500"
                                    onChange={e => setRegData({ ...regData, bio: e.target.value })}
                                />
                            </div>

                            <button 
                                onClick={handleStudentRegistration}
                                className="btn-main w-full py-4 rounded-xl text-lg font-bold flex items-center justify-center gap-2 hover:scale-105 transition-transform shadow-lg shadow-brand-accent/20"
                            >
                                <Icon name="send" /> حفظ البيانات وإرسال الطلب
                            </button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'student') {
                const daysLeft = calculateSubscriptionDays(user?.subscriptionEnd);
                const points = calculatePoints(user?.uid);
                const enrolledCourses = user?.isPaid && daysLeft > 0 ? dataState.courses.filter(c => c.grade === user?.grade) : [];

                return (
                    <div className={`min-h-screen flex flex-col md:flex-row ${isDarkMode ? 'bg-brand-dark text-white' : 'bg-slate-50 text-slate-900'}`}>
                        <aside className={`fixed inset-y-0 right-0 z-50 w-64 ${isDarkMode ? 'bg-brand-card' : 'bg-white'} border-l border-white/5 flex flex-col transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : 'translate-x-full'} md:translate-x-0 md:static shrink-0`}>
                            <div className="p-6 text-center border-b border-white/5">
                                <div className="relative inline-block">
                                    <img src={user?.photo} className="w-20 h-20 rounded-full border-4 border-brand-dark mx-auto mb-3" />
                                    <div className={`absolute bottom-2 right-0 w-5 h-5 rounded-full border-2 border-brand-card ${user?.isPaid ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                </div>
                                <h3 className="font-bold text-lg">{user?.name}</h3>
                                <div className="flex flex-col items-center gap-1 mt-1">
                                    <p className="text-xs text-slate-400 font-mono">{user?.code}</p>
                                    <span className="bg-brand-accent/20 text-brand-accent px-3 py-1 rounded-full text-xs font-bold border border-brand-accent/30">
                                        {user?.grade === '1sec' ? 'الصف الأول الثانوي' : user?.grade === '2sec' ? 'الصف الثاني الثانوي' : 'الصف الثالث الثانوي'}
                                    </span>
                                </div>
                                <div className="mt-2 flex justify-center gap-2">
                                    <RankBadge points={points} />
                                    {user?.isPaid && daysLeft > 0 && (
                                        <span className="bg-green-500/20 text-green-300 px-3 py-1 rounded-full text-xs">باقي {daysLeft} يوم</span>
                                    )}
                                </div>
                            </div>

                            <nav className="p-4 space-y-2 flex-1">
                                {[
                                    { id: 'home', l: 'الرئيسية', i: 'home' },
                                    { id: 'lectures', l: 'المحاضرات', i: 'play-circle' },
                                    { id: 'whiteboards', l: 'السبورات', i: 'image' },
                                    { id: 'recordings', l: 'التسجيلات', i: 'mic' },
                                    { id: 'flashcards', l: 'البطاقات', i: 'layers' },
                                    { id: 'subscription', l: 'الاشتراك', i: 'credit-card' },
                                    { id: 'qa', l: 'أسئلة وأجوبة', i: 'help-circle' }
                                ].map(item => (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setSelectedLecture(null); setSidebarOpen(false); }}
                                        className={`w-full flex items-center gap-3 p-3 rounded-xl transition font-bold ${activeTab === item.id ? 'bg-brand-primary text-white shadow-lg' : 'text-slate-400 hover:bg-white/5 hover:text-white'}`}>
                                        <GlassIcon name={item.i} size={18} /> {item.l}
                                    </button>
                                ))}
                            </nav>

                            <div className="p-4 border-t border-white/5 space-y-2">
                                <ThemeToggle isDark={isDarkMode} onToggle={setIsDarkMode} />
                                <button onClick={() => window.authMethods.signOut(window.auth)} className="flex items-center justify-center gap-2 text-red-400 w-full p-3 hover:bg-red-500/10 rounded-xl font-bold">
                                    <Icon name="log-out" size={18} /> خروج
                                </button>
                            </div>
                        </aside>

                        <div className="flex-1 flex flex-col h-screen overflow-y-auto relative">
                            <div className="absolute inset-0 math-grid opacity-10 pointer-events-none"></div>

                            <header className="p-4 flex justify-between items-center md:hidden sticky top-0 z-40 bg-brand-dark/80 backdrop-blur-md border-b border-white/5">
                                <h1 className="font-black text-xl text-brand-accent">{PLATFORM_SHORT}</h1>
                                <button onClick={() => setSidebarOpen(true)}><Icon name="menu" /></button>
                            </header>

                            <main className="px-4 md:px-8 max-w-6xl mx-auto w-full relative z-10">
                                {!user?.isPaid && activeTab !== 'home' && activeTab !== 'subscription' ? (
                                    <div className="glass-panel p-10 text-center mt-10 animate-slide-up">
                                        <GlassIcon name="lock" size={48} className="mx-auto mb-6" />
                                        <h2 className="text-3xl font-bold mb-3">المحتوى مغلق 🔒</h2>
                                        <p className="text-slate-400 mb-8">الحساب غير مفعل.. يرجى الاشتراك لفتح المحتوى التعليمي</p>
                                        <button onClick={() => setActiveTab('subscription')} className="btn-main px-8 py-3 rounded-xl text-lg">اشترك الآن</button>
                                    </div>
                                ) : (
                                    <>
                                        {activeTab === 'home' && (
                                            <div className="space-y-6 animate-slide-up">
                                                <div className="bg-gradient-to-r from-brand-primary to-blue-900 rounded-2xl p-8 relative overflow-hidden shadow-2xl">
                                                    <div className="relative z-10">
                                                        <h2 className="text-3xl font-black mb-2">أهلاً {user?.name?.split(' ')[0]} 👋</h2>
                                                        <p className="text-blue-100 mb-4">رتبتك: <RankBadge points={points} /></p>
                                                        <div className="flex flex-wrap gap-4">
                                                            <div className="bg-black/30 px-4 py-2 rounded-lg flex items-center gap-2 border border-white/10">
                                                                <Icon name="video" size={16} className="text-brand-accent" /> {dataState.lectures.length} محاضرة
                                                            </div>
                                                            {user?.isPaid && daysLeft > 0 && (
                                                                <div className="bg-green-500/20 px-4 py-2 rounded-lg flex items-center gap-2 border border-green-500">
                                                                    <Icon name="calendar" size={16} className="text-green-300" /> باقي {daysLeft} يوم
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>

                                                <SubscriptionStatusCard user={user} enrolledCourses={enrolledCourses} />

                                                <div className="glass-panel p-6 border-r-4 border-blue-500 relative overflow-hidden" style={{ background: 'linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(23, 23, 23, 0.9) 100%)' }}>
                                                    <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
                                                    <div className="relative z-10">
                                                        <div className="flex items-center gap-4 mb-4">
                                                            <div className="glass-icon bg-blue-500/20 text-blue-400 border-blue-500/30">
                                                                <Icon name="user" size={24} />
                                                            </div>
                                                            <div>
                                                                <h3 className="text-xl font-bold text-blue-300">♞ الملف الشخصي</h3>
                                                                <p className="text-xs text-slate-400">عرّف عن نفسك لزملائك</p>
                                                            </div>
                                                        </div>

                                                        {user?.bio && (
                                                            <div className="bg-blue-500/10 border border-blue-500/20 rounded-xl p-4 mb-4 backdrop-blur-sm">
                                                                <p className="text-slate-200 leading-relaxed whitespace-pre-wrap">{user.bio}</p>
                                                            </div>
                                                        )}

                                                        <div className="space-y-3">
                                                            <textarea
                                                                id="studentBioInput"
                                                                defaultValue={user?.bio || ''}
                                                                placeholder="اكتب وصف لنفسك... (مثلاً: طالب طموح أحب اللغة العربية والأدب)"
                                                                className="w-full p-4 bg-white/5 border border-blue-500/20 rounded-xl outline-none text-white h-24 resize-none focus:border-blue-500/50 transition placeholder-slate-500"
                                                            />
                                                            <button
                                                                onClick={async () => {
                                                                    const bio = document.getElementById('studentBioInput').value;
                                                                    await window.rtdb.update(window.rtdb.ref(window.db, `users/${user.uid}`), { bio });
                                                                    showNotification('تم حفظ الوصف ✅');
                                                                }}
                                                                className="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-6 py-2 rounded-xl font-bold transition flex items-center gap-2 border border-blue-500/30"
                                                            >
                                                                <Icon name="save" size={16} /> حفظ الوصف
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>

                                                <HonorBoard students={dataState.students} isDarkMode={isDarkMode} />

                                                {user?.notes && (
                                                    <div className="glass-panel p-6 border-r-4 border-brand-accent flex gap-4 items-start">
                                                        <GlassIcon name="lightbulb" size={24} />
                                                        <div>
                                                            <h3 className="font-bold text-brand-accent mb-1">ملاحظة من المستر:</h3>
                                                            <p className="text-slate-300 leading-relaxed">{user.notes}</p>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="glass-panel p-6">
                                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                                        <GlassIcon name="bell" size={20} /> أحدث التنبيهات
                                                    </h3>
                                                    <div className="space-y-3">
                                                        {dataState.announcements.length === 0 ? (
                                                            <p className="text-slate-500 text-center py-4">مفيش إعلانات حالياً</p>
                                                        ) : (
                                                            dataState.announcements.slice(0, 3).map(ann => (
                                                                <div key={ann.id} className="bg-white/5 p-4 rounded-xl border-r-4 border-brand-primary">
                                                                    <h4 className="font-bold">{ann.title}</h4>
                                                                    <p className="text-slate-400 text-sm mt-1">{ann.content}</p>
                                                                </div>
                                                            ))
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {activeTab === 'flashcards' && (
                                            <div className="space-y-6 animate-slide-up">
                                                <h2 className="text-2xl font-bold flex items-center gap-2">
                                                    <GlassIcon name="layers" size={24} /> بطاقات المراجعة
                                                </h2>
                                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                    {dataState.flashcards.length === 0 ? (
                                                        <div className="col-span-full text-center py-12 glass-panel">
                                                            <GlassIcon name="layers" size={48} className="mx-auto mb-4" />
                                                            <p className="text-slate-500">مفيش بطاقات حالياً</p>
                                                        </div>
                                                    ) : (
                                                        dataState.flashcards.map(card => (
                                                            <Flashcard key={card.id} question={card.question} answer={card.answer} />
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                        )}

                                        {activeTab === 'lectures' && !selectedLecture && (
                                            <div className="space-y-6 animate-slide-up">
                                                <div className="flex flex-wrap gap-2">
                                                    {[
                                                        { id: 'all', label: 'الكل' },
                                                        { id: '1sec', label: 'الصف الأول' },
                                                        { id: '2sec', label: 'الصف الثاني' },
                                                        { id: '3sec', label: 'الصف الثالث' }
                                                    ].map(tab => (
                                                        <button key={tab.id} onClick={() => setLectureGradeFilter(tab.id)}
                                                            className={`px-4 py-2 rounded-xl font-bold transition ${lectureGradeFilter === tab.id
                                                                ? 'bg-brand-accent text-brand-dark'
                                                                : 'bg-white/10 hover:bg-white/20'
                                                                }`}>
                                                            {tab.label}
                                                        </button>
                                                    ))}
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                    {dataState.lectures.filter(lec =>
                                                        lectureGradeFilter === 'all' || lec.grade === lectureGradeFilter
                                                    ).length === 0 ? (
                                                        <div className="col-span-full text-center py-12 glass-panel">
                                                            <GlassIcon name="video-off" size={48} className="mx-auto mb-3" />
                                                            <p className="text-slate-500 font-bold">مفيش محاضرات حالياً</p>
                                                        </div>
                                                    ) : (
                                                        dataState.lectures
                                                            .filter(lec => lectureGradeFilter === 'all' || lec.grade === lectureGradeFilter)
                                                            .map(lec => {
                                                                const isSubscriptionActive = user?.isPaid && (!user.subscriptionEnd || new Date(user.subscriptionEnd) > new Date());
                                                                const isLocked = !lec.isFree && !isSubscriptionActive;
                                                                return (
                                                                    <div key={lec.id}
                                                                        onClick={() => {
                                                                            if (isLocked) {
                                                                                showNotification('المحتوى مغلق - اشترك الآن للوصول الكامل', 'error');
                                                                                setActiveTab('subscription');
                                                                                return;
                                                                            }
                                                                            setSelectedLecture(lec);
                                                                            setCurrentLectureStep('video');
                                                                            setQuizSubmitted(false);
                                                                            setQuizAnswers({});
                                                                        }}
                                                                        className={`glass-panel overflow-hidden cursor-pointer group hover:border-brand-accent/50 transition relative ${isLocked ? 'opacity-80' : ''}`}>

                                                                        {isLocked && (
                                                                            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-10 rounded-xl">

                                        <div className="bg-white/5 p-4 rounded-xl">
                                            <h4 className="font-bold mb-3">ملاحظة للطالب</h4>
                                            <textarea id="studentNotes" defaultValue={selectedStudent.notes || ''}
                                                placeholder="اكتب ملاحظة تظهر للطالب فقط..."
                                                className="w-full bg-black/20 border border-white/10 p-3 rounded-lg h-20 mb-2"></textarea>
                                            <button onClick={() => {
                                                const notes = document.getElementById('studentNotes').value;
                                                updateStudent(selectedStudent.id, { notes });
                                            }} className="bg-brand-primary px-4 py-2 rounded-lg text-sm font-bold">حفظ الملاحظة</button>
                                        </div>

                                        <div className="bg-white/5 p-4 rounded-xl">
                                            <h4 className="font-bold mb-3">بيانات الطالب</h4>
                                            <div className="text-sm space-y-2 text-slate-300">
                                                <p>📱 {selectedStudent.phone}</p>
                                                <p>👨‍👩‍👦 {selectedStudent.parentPhone}</p>
                                                <p>🏫 {selectedStudent.school}</p>
                                                <p>📍 {selectedStudent.governorate} - {selectedStudent.city}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={() => setShowStudentModal(false)} className="mt-6 w-full py-3 bg-white/10 rounded-xl font-bold">إغلاق</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'loading') return (
                <div className="h-screen bg-brand-dark flex items-center justify-center text-brand-accent font-bold text-xl animate-pulse">
                    <div className="text-center">
                        <GlassIcon name="loader" size={48} className="mx-auto mb-4 animate-spin" />
                        <p>جاري التحميل...</p>
                    </div>
                </div>
            );

            return (
                <>
                    {notification && (
                        <div className={`fixed top-5 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl font-bold z-[100] text-white flex items-center gap-4 ${notification.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>
                            <div className="flex items-center gap-2">
                                <Icon name={notification.type === 'error' ? 'alert-circle' : 'check-circle'} />
                                {notification.message}
                            </div>
                            {notification.action && (
                                <button
                                    onClick={notification.action.onClick}
                                    className="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm transition"
                                >
                                    {notification.action.label}
                                </button>
                            )}
                        </div>
                    )}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
