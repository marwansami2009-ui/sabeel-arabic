                                <h4 className="text-sm font-bold text-blue-400 mb-3 flex items-center gap-2">
                                    <Icon name="edit-3" size={16} /> ♞ نبذة عنك (إجباري)
                                </h4>
                                <textarea
                                    placeholder="اكتب وصف لنفسك... من أنت؟ وما هو هدفك؟ (للمساعدة في قبولك)"
                                    className="w-full p-4 bg-white/5 border border-blue-500/20 rounded-xl outline-none text-white h-24 resize-none placeholder-slate-500"
                                    onChange={e => setRegData({ ...regData, bio: e.target.value })}
                                />
                            </div>

                            <button 
                                onClick={handleStudentRegistration}
                                className="btn-main w-full py-4 rounded-xl text-lg font-bold flex items-center justify-center gap-2 hover:scale-105 transition-transform shadow-lg shadow-brand-accent/20"
                            >
                                <Icon name="send" /> حفظ البيانات وإرسال الطلب
                            </button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'student') {
                const daysLeft = calculateSubscriptionDays(user?.subscriptionEnd);
                const points = calculatePoints(user?.uid);
                
                const enrolledCourses = user?.enrolledCourses || [];
                const paidCourses = dataState.courses.filter(c => enrolledCourses.includes(c.id));
                const availableCourses = dataState.courses.filter(c => !enrolledCourses.includes(c.id));
                
                // فلترة المحاضرات حسب الكورسات المسجل فيها الطالب
                const filteredLectures = dataState.lectures.filter(lec => 
                    lec.isFree || enrolledCourses.includes(lec.courseId)
                );

                return (
                    <div className={`min-h-screen flex flex-col md:flex-row ${isDarkMode ? 'bg-brand-dark text-white' : 'bg-slate-50 text-slate-900'}`}>
                        <aside className={`fixed inset-y-0 right-0 z-50 w-64 ${isDarkMode ? 'bg-brand-card' : 'bg-white'} border-l border-white/5 flex flex-col transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : 'translate-x-full'} md:translate-x-0 md:static shrink-0`}>
                            <div className="p-6 text-center border-b border-white/5">
                                <div className="relative inline-block">
                                    <img src={user?.photo} className="w-20 h-20 rounded-full border-4 border-brand-dark mx-auto mb-3" />
                                    <div className={`absolute bottom-2 right-0 w-5 h-5 rounded-full border-2 border-brand-card ${user?.isPaid ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                </div>
                                <h3 className="font-bold text-lg">{user?.name}</h3>
                                <div className="flex flex-col items-center gap-1 mt-1">
                                    <p className="text-xs text-slate-400 font-mono">{user?.code}</p>
                                    <span className="bg-brand-accent/20 text-brand-accent px-3 py-1 rounded-full text-xs font-bold border border-brand-accent/30">
                                        {user?.grade === '1sec' ? 'الصف الأول الثانوي' : user?.grade === '2sec' ? 'الصف الثاني الثانوي' : 'الصف الثالث الثانوي'}
                                    </span>
                                </div>
                                <div className="mt-2 flex justify-center gap-2">
                                    <RankBadge points={points} />
                                    {user?.isPaid && daysLeft > 0 && (
                                        <span className="bg-green-500/20 text-green-300 px-3 py-1 rounded-full text-xs">باقي {daysLeft} يوم</span>
                                    )}
                                </div>
                            </div>

                            <nav className="p-4 space-y-2 flex-1">
                                {[
                                    { id: 'home', l: 'الرئيسية', i: 'home' },
                                    { id: 'lectures', l: 'المحاضرات', i: 'play-circle' },
                                    { id: 'exams', l: 'الامتحانات', i: 'clipboard-list' },
                                    { id: 'results', l: 'نتائجي', i: 'bar-chart-2' },
                                    { id: 'whiteboards', l: 'السبورات', i: 'image' },
                                    { id: 'recordings', l: 'التسجيلات', i: 'mic' },
                                    { id: 'flashcards', l: 'البطاقات', i: 'layers' },
                                    { id: 'attendance', l: 'الحضور', i: 'calendar-check' },
                                    { id: 'mycourses', l: 'كورساتي المفعلة', i: 'check-circle' },
                                    { id: 'qa', l: 'أسئلة وأجوبة', i: 'help-circle' }
                                ].map(item => (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setSelectedLecture(null); setSidebarOpen(false); }}
                                        className={`w-full flex items-center gap-3 p-3 rounded-xl transition font-bold ${activeTab === item.id ? 'bg-brand-primary text-white shadow-lg' : 'text-slate-400 hover:bg-white/5 hover:text-white'}`}>
                                        <GlassIcon name={item.i} size={18} /> {item.l}
                                    </button>
                                ))}
                            </nav>

                            <div className="p-4 border-t border-white/5 space-y-2">
                                <ThemeToggle isDark={isDarkMode} onToggle={setIsDarkMode} />
                                <button onClick={() => window.authMethods.signOut(window.auth)} className="flex items-center justify-center gap-2 text-red-400 w-full p-3 hover:bg-red-500/10 rounded-xl font-bold">
                                    <Icon name="log-out" size={18} /> خروج
                                </button>
                            </div>
                        </aside>

                        <div className="flex-1 flex flex-col h-screen overflow-y-auto relative">
                            <div className="absolute inset-0 math-grid opacity-10 pointer-events-none"></div>

                            <header className="p-4 flex justify-between items-center md:hidden sticky top-0 z-40 bg-brand-dark/80 backdrop-blur-md border-b border-white/5">
                                <h1 className="font-black text-xl text-brand-accent">{PLATFORM_SHORT}</h1>
                                <button onClick={() => setSidebarOpen(true)}><Icon name="menu" /></button>
                            </header>

                            <main className="px-4 md:px-8 max-w-6xl mx-auto w-full relative z-10">
                                {!user?.isPaid && activeTab !== 'home' && activeTab !== 'mycourses' && activeTab !== 'attendance' && activeTab !== 'results' ? (
                                    <div className="glass-panel p-10 text-center mt-10 animate-slide-up">
                                        <GlassIcon name="lock" size={48} className="mx-auto mb-6" />
                                        <h2 className="text-3xl font-bold mb-3">المحتوى مغلق 🔒</h2>
                                        <p className="text-slate-400 mb-8">الحساب غير مفعل.. يرجى الاشتراك لفتح المحتوى التعليمي</p>
                                        <button onClick={() => setActiveTab('home')} className="btn-main px-8 py-3 rounded-xl text-lg">العودة للرئيسية وشراء كورس</button>
                                    </div>
                                ) : (
                                    <>
                                        {activeTab === 'home' && (
                                            <div className="space-y-6 animate-slide-up">
                                                <div className="bg-gradient-to-r from-brand-primary to-blue-900 rounded-2xl p-8 relative overflow-hidden shadow-2xl">
                                                    <div className="relative z-10">
                                                        <h2 className="text-3xl font-black mb-2">أهلاً {user?.name?.split(' ')[0]} 👋</h2>
                                                        <p className="text-blue-100 mb-4">رتبتك: <RankBadge points={points} /></p>
                                                        <div className="flex flex-wrap gap-4">
                                                            <div className="bg-black/30 px-4 py-2 rounded-lg flex items-center gap-2 border border-white/10">
                                                                <Icon name="video" size={16} className="text-brand-accent" /> {filteredLectures.length} محاضرة
                                                            </div>
                                                            {user?.isPaid && daysLeft > 0 && (
                                                                <div className="bg-green-500/20 px-4 py-2 rounded-lg flex items-center gap-2 border border-green-500">
                                                                    <Icon name="calendar" size={16} className="text-green-300" /> باقي {daysLeft} يوم
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>

                                                <SubscriptionStatusCard user={user} enrolledCourses={paidCourses} />

                                                {availableCourses.length > 0 && (
                                                    <div className="glass-panel p-6">
                                                        <div className="flex items-center justify-between mb-6">
                                                            <div className="flex items-center gap-3">
                                                                <div className="glass-icon bg-purple-500/20 text-purple-500 border-purple-500/30">
                                                                    <Icon name="shopping-cart" size={24} />
                                                                </div>
                                                                <div>
                                                                    <h2 className="text-xl font-bold">♞ كورسات متاحة للشراء</h2>
                                                                    <p className="text-xs text-slate-400">اختر الكورس المناسب لك واشترك الآن</p>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div className="grid md:grid-cols-3 gap-4">
                                                            {availableCourses.map(course => (
                                                                <div 
                                                                    key={course.id} 
                                                                    onClick={() => setSelectedCourse(course)}
                                                                    className="bg-white/5 rounded-xl border border-white/10 overflow-hidden hover:scale-105 hover:border-purple-500/50 transition-all duration-300 cursor-pointer"
                                                                >
                                                                    <div className="h-32 bg-slate-800 relative">
                                                                        <img src={course.image || 'https://via.placeholder.com/300x150?text=Course'} className="w-full h-full object-cover opacity-60" />
                                                                        <span className="absolute top-2 right-2 bg-brand-accent/20 text-brand-accent px-2 py-1 rounded-lg text-xs font-bold border border-brand-accent/30">
                                                                            {course.grade === '1sec' ? 'أولى ثانوي' : course.grade === '2sec' ? 'تانية ثانوي' : 'تالتة ثانوي'}
                                                                        </span>
                                                                    </div>
                                                                    <div className="p-4">
                                                                        <h3 className="font-bold text-base mb-1 line-clamp-1">{course.title}</h3>
                                                                        <p className="text-xs text-slate-400 mb-3 line-clamp-2">{course.description}</p>
                                                                        <div className="flex justify-between items-center">
                                                                            <span className="text-xl font-black text-green-400">{course.price} <span className="text-xs text-slate-500">ج.م</span></span>
                                                                            <span className="bg-blue-500/20 text-blue-300 px-2 py-1 rounded text-xs">{course.duration} يوم</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="glass-panel p-6 bg-gradient-to-r from-green-900/30 to-green-800/20">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-3">
                                                            <GlassIcon name="check-circle" className="text-green-500" size={24} />
                                                            <div>
                                                                <h3 className="font-bold text-lg">كورساتي المفعلة</h3>
                                                                <p className="text-sm text-slate-400">لديك {paidCourses.length} كورس مفعل</p>
                                                            </div>
                                                        </div>
                                                        <button 
                                                            onClick={() => setActiveTab('mycourses')}
                                                            className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2"
                                                        >
                                                            <Icon name="arrow-left" size={16} /> عرض الكورسات
                                                        </button>
                                                    </div>
                                                </div>

                                                <HonorBoard students={dataState.students} isDarkMode={isDarkMode} />

                                                {user?.notes && (
                                                    <div className="glass-panel p-6 border-r-4 border-brand-accent flex gap-4 items-start">
                                                        <GlassIcon name="lightbulb" size={24} />
                                                        <div>
                                                            <h3 className="font-bold text-brand-accent mb-1">ملاحظة من المستر:</h3>
                                                            <p className="text-slate-300 leading-relaxed">{user.notes}</p>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="glass-panel p-6">
                                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                                        <GlassIcon name="bell" size={20} /> أحدث التنبيهات
                                                    </h3>
                                                    <div className="space-y-3">
                                                        {dataState.announcements.length === 0 ? (
                                                            <p className="text-slate-500 text-center py-4">مفيش إعلانات حالياً</p>
                                                        ) : (
                                                            dataState.announcements.slice(0, 3).map(ann => (
                                                                <div key={ann.id} className="bg-white/5 p-4 rounded-xl border-r-4 border-brand-primary">
                                                                    <h4 className="font-bold">{ann.title}</h4>
                                                                    <p className="text-slate-400 text-sm mt-1">{ann.content}</p>
                                                                </div>
                                                            ))
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                                                            showNotification('تم رفض الطلب');
                                                                        }
                                                                    }} className="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-5 py-2 rounded-xl font-bold flex items-center gap-2 transition border border-red-500/30">
                                                                        <Icon name="x" size={18} /> رفض
                                                                    </button>
                                                                </div>
                                                            ) : (
                                                                <span className="text-slate-400 text-sm px-4 py-2 bg-white/5 rounded-xl self-start">
                                                                    ⏳ انتظار موافقة المدير الأعلى
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {activeTab === 'datacenter' && (
                                    !isDataCenterUnlocked ? (
                                        <AdminPasswordPrompt onSubmit={() => setIsDataCenterUnlocked(true)} onBack={() => setActiveTab('lectures')} />
                                    ) : (
                                        <div className="space-y-6 animate-slide-up">
                                            <div className="flex items-center justify-between mb-6">
                                                <h2 className="text-2xl font-bold flex items-center gap-2">
                                                    <GlassIcon name="database" size={24} /> مركز البيانات
                                                </h2>
                                                <input placeholder="بحث..." className="bg-white/5 border border-white/10 px-4 py-2 rounded-xl w-64"
                                                    value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                                            </div>

                                            {dataState.requests.length > 0 && (
                                                <div className="glass-panel p-4 mb-4 bg-yellow-500/10 border border-yellow-500/20 flex items-center gap-3">
                                                    <Icon name="alert-circle" size={20} className="text-yellow-400" />
                                                    <span className="text-yellow-200 text-sm">لديك {dataState.requests.length} طلب التحاق معلق.</span>
                                                    <button onClick={() => setActiveTab('requests')} className="bg-yellow-500 hover:bg-yellow-600 text-black px-4 py-1 rounded-lg text-sm font-bold mr-auto">
                                                        عرض الطلبات
                                                    </button>
                                                </div>
                                            )}

                                            <div className="flex gap-2 mb-4 flex-wrap">
                                                {[
                                                    { id: '1sec', l: 'أولى ثانوي' },
                                                    { id: '2sec', l: 'تانية ثانوي' },
                                                    { id: '3sec', l: 'تالتة ثانوي' },
                                                    { id: 'parents', l: 'أولياء الأمور' },
                                                    { id: 'admins', l: 'الإدارة' }
                                                ].map(tab => (
                                                    <button key={tab.id} onClick={() => setStudentYearFilter(tab.id)}
                                                        className={`px-4 py-2 rounded-xl font-bold transition ${studentYearFilter === tab.id ? 'bg-brand-primary text-white' : 'bg-white/5 text-slate-400 hover:bg-white/10'}`}>
                                                        {tab.l}
                                                    </button>
                                                ))}
                                            </div>

                                            <div className="grid gap-4">
                                                {(studentYearFilter === 'parents' ? parentsList :
                                                    studentYearFilter === 'admins' ? adminsList : studentsList).map(s => (
                                                        <div key={s.id} className="glass-panel p-5 flex flex-col md:flex-row justify-between gap-4">
                                                            <div className="flex items-center gap-4">
                                                                <img src={s.photo} className="w-14 h-14 rounded-full border-2 border-white/20" />
                                                                <div>
                                                                    <p className="font-bold text-lg">{s.name}</p>
                                                                    <p className="text-xs text-slate-400">{s.email}</p>
                                                                    <div className="flex flex-wrap gap-2 mt-2">
                                                                        <RankBadge points={calculatePoints(s.id)} />
                                                                        {s.isPaid && <span className="bg-green-500/20 text-green-300 px-2 py-1 rounded text-xs">مفعل</span>}
                                                                        {!s.isPaid && <span className="bg-red-500/20 text-red-300 px-2 py-1 rounded text-xs">غير مفعل</span>}
                                                                        {s.level && <span className={`px-2 py-1 rounded text-xs ${s.level === 'ممتاز' ? 'bg-green-500/20 text-green-300' : s.level === 'جيد' ? 'bg-blue-500/20 text-blue-300' : s.level === 'ضعيف' ? 'bg-red-500/20 text-red-300' : 'bg-white/10'}`}>{s.level}</span>}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div className="flex flex-wrap gap-2 items-center self-start md:self-center">
                                                                <select
                                                                    value={s.level || 'جديد'}
                                                                    onChange={async (e) => {
                                                                        await window.rtdb.update(window.rtdb.ref(window.db, `users/${s.id}`), { level: e.target.value });
                                                                        showNotification('تم تحديث المستوى ✅');
                                                                    }}
                                                                    className="bg-white/5 border border-white/20 text-white px-3 py-2 rounded-xl text-sm font-bold cursor-pointer"
                                                                >
                                                                    <option value="جديد">📊 تقييم المستوى</option>
                                                                    <option value="ممتاز">⭐ ممتاز</option>
                                                                    <option value="جيد">👍 جيد</option>
                                                                    <option value="ضعيف">⚠️ ضعيف</option>
                                                                </select>

                                                                <button onClick={() => { setSelectedStudent(s); setShowStudentModal(true); }}
                                                                    className="bg-brand-primary hover:bg-blue-700 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1 transition">
                                                                    <Icon name="settings" size={16} /> إدارة
                                                                </button>

                                                                {isSuperAdmin && (
                                                                    <button onClick={async () => {
                                                                        if (confirm(`⚠️ تحذير: هل تريد طرد "${s.name}" وإجباره على إعادة التسجيل؟\n\nهذا سيحذف الحساب تماماً.`)) {
                                                                            await window.rtdb.remove(window.rtdb.ref(window.db, `users/${s.id}`));
                                                                            showNotification('تم طرد المستخدم - سيحتاج لإعادة التسجيل');
                                                                        }
                                                                    }} className="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1 transition border border-red-500/30">
                                                                        <Icon name="trash-2" size={16} /> طرد وإعادة تسجيل
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))}
                                            </div>
                                        </div>
                                    )
                                )}

                                {activeTab === 'subscriptions_manager' && (
                                    <SubscriptionManager
                                        students={dataState.students}
                                        courses={dataState.courses}
                                        onConfirmPayment={confirmPayment}
                                        onDeactivate={(id) => updateStudent(id, { isPaid: false, subscriptionEnd: null, enrolledCourses: [] })}
                                        isSuperAdmin={isSuperAdmin}
                                    />
                                )}

                                {activeTab === 'courses' && (
                                    <CourseManager
                                        courses={dataState.courses}
                                        onAddCourse={addCourse}
                                        onDeleteCourse={deleteCourse}
                                        isSuperAdmin={isSuperAdmin}
                                    />
                                )}

                                {activeTab === 'lectures' && (
                                    <LectureManager
                                        courses={dataState.courses}
                                        onAddLecture={addLecture}
                                        onDeleteLecture={deleteLecture}
                                        isSuperAdmin={isSuperAdmin}
                                    />
                                )}

                                {activeTab === 'exams' && (
                                    <div className="space-y-6 animate-slide-up">
                                        <div className="flex justify-between items-center">
                                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                                <GlassIcon name="clipboard-list" size={24} /> الامتحانات
                                            </h2>
                                            <button onClick={() => setShowExamBuilder(true)} className="btn-main px-6 py-3 rounded-xl font-bold flex items-center gap-2">
                                                <Icon name="plus" /> إنشاء امتحان جديد
                                            </button>
                                        </div>

                                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {dataState.exams.length === 0 ? (
                                                <div className="col-span-full text-center py-12 glass-panel">
                                                    <GlassIcon name="clipboard" size={48} className="mx-auto mb-3" />
                                                    <p className="text-slate-500 font-bold">مفيش امتحانات حالياً</p>
                                                </div>
                                            ) : (
                                                dataState.exams.filter(e => isSuperAdmin || e.grade === 'all' || e.grade === (user?.grade)).map(exam => (
                                                    <div key={exam.id} className="glass-panel p-5 relative group">
                                                        <div className="absolute top-4 left-4 opacity-0 group-hover:opacity-100 transition">
                                                            <button onClick={() => window.rtdb.remove(window.rtdb.ref(window.db, 'exams/' + exam.id))} className="text-red-400 hover:bg-white/10 p-2 rounded-lg">
                                                                <Icon name="trash-2" size={18} />
                                                            </button>
                                                        </div>
                                                        <span className={`text-xs px-2 py-1 rounded mb-3 inline-block ${exam.type === 'mcq' ? 'bg-blue-500/20 text-blue-300' : exam.type === 'essay' ? 'bg-purple-500/20 text-purple-300' : 'bg-green-500/20 text-green-300'}`}>
                                                            {exam.type === 'mcq' ? 'اختياري' : exam.type === 'essay' ? 'مقالي' : 'واتساب'}
                                                        </span>
                                                        <h3 className="font-bold text-lg mb-2 line-clamp-2">{exam.question}</h3>
                                                        <p className="text-sm text-slate-400 flex items-center gap-2">
                                                            <Icon name="users" size={14} /> للصف: {exam.grade === 'all' ? 'الكل' : exam.grade}
                                                        </p>
                                                        <p className="text-sm text-slate-400 flex items-center gap-2 mt-1">
                                                            <Icon name="book-open" size={14} /> كورس: {dataState.courses.find(c => c.id === exam.courseId)?.title || 'غير معروف'}
                                                        </p>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'whiteboards' && (
                                    <WhiteboardManager
                                        whiteboards={dataState.whiteboards}
                                        onAddWhiteboard={addWhiteboard}
                                        onDeleteWhiteboard={deleteWhiteboard}
                                    />
                                )}

                                {activeTab === 'recordings' && (
                                    <div className="space-y-6 animate-slide-up">
                                        <div className="glass-panel p-6">
                                            <h3 className="font-bold mb-4">إضافة تسجيل صوتي</h3>
                                            <input id="recTitle" placeholder="عنوان التسجيل" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl mb-4" />
                                            <input id="recLink" placeholder="رابط الملف الصوتي (URL)" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl mb-4" />
                                            <button onClick={() => {
                                                const title = document.getElementById('recTitle').value;
                                                const link = document.getElementById('recLink').value;
                                                if (title && link) {
                                                    uploadItem('recordings', { title, link });
                                                    document.getElementById('recTitle').value = '';
                                                    document.getElementById('recLink').value = '';
                                                }
                                            }} className="btn-main px-6 py-3 rounded-xl font-bold">نشر التسجيل</button>
                                        </div>

                                        <div className="grid md:grid-cols-2 gap-4">
                                            {dataState.recordings.map(rec => (
                                                <div key={rec.id} className="glass-panel p-4 flex justify-between items-center group">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center text-red-500">
                                                            <Icon name="mic" size={20} />
                                                        </div>
                                                        <div>
                                                            <h4 className="font-bold">{rec.title}</h4>
                                                            <p className="text-xs text-slate-400">{rec.date}</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <audio src={rec.link} controls className="h-8 w-32" />
                                                        <button onClick={() => {
                                                            if (confirm('حذف التسجيل؟')) window.rtdb.remove(window.rtdb.ref(window.db, 'recordings/' + rec.id));
                                                        }} className="text-red-400 hover:bg-white/10 p-2 rounded-lg opacity-0 group-hover:opacity-100 transition">
                                                            <Icon name="trash-2" size={18} />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'flashcards' && (
                                    <div className="space-y-6 animate-slide-up">
                                        <div className="glass-panel p-6">
                                            <h3 className="font-bold mb-4">إضافة بطاقة جديدة</h3>
                                            <div className="grid md:grid-cols-2 gap-4 mb-4">
                                                <input id="cardQ" placeholder="السؤال/القانون" className="bg-white/5 border border-white/10 p-3 rounded-xl" />
                                                <input id="cardA" placeholder="الإجابة" className="bg-white/5 border border-white/10 p-3 rounded-xl" />
                                            </div>
                                            <button onClick={() => {
                                                const q = document.getElementById('cardQ').value;
                                                const a = document.getElementById('cardA').value;
                                                if (q && a) {
                                                    uploadItem('flashcards', { question: q, answer: a });
                                                    document.getElementById('cardQ').value = '';
                                                    document.getElementById('cardA').value = '';
                                                }
                                            }} className="btn-main px-6 py-3 rounded-xl font-bold">إضافة البطاقة</button>
                                        </div>

                                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {dataState.flashcards.map(card => (
                                                <div key={card.id} className="glass-panel p-4">
                                                    <p className="font-bold text-brand-accent mb-2">{card.question}</p>
                                                    <p className="text-sm text-slate-300">{card.answer}</p>
                                                    <button onClick={() => window.rtdb.remove(window.rtdb.ref(window.db, 'flashcards/' + card.id))}
                                                        className="text-red-400 hover:text-red-300 mt-2">
                                                        <Icon name="trash-2" size={16} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'qa' && (
                                    <div className="space-y-4 animate-slide-up">
                                        {dataState.qa.map(q => (
                                            <div key={q.id} className="glass-panel p-5">
                                                <div className="flex items-start gap-3 mb-3">
                                                    <div className="w-10 h-10 rounded-full bg-brand-primary flex items-center justify-center font-bold text-sm">
                                                        {q.studentName?.charAt(0)}
                                                    </div>
                                                    <div className="flex-1">
                                                        <p className="font-bold">{q.studentName}</p>
                                                        <p className="text-slate-300 bg-black/20 p-3 rounded-lg mt-2">{q.question}</p>
                                                    </div>
                                                </div>
                                                {q.reply ? (
                                                    <div className="ml-12 bg-green-500/10 p-3 rounded-lg border-r-2 border-green-500">
                                                        <p className="text-sm text-green-300">{q.reply}</p>
                                                    </div>
                                                ) : (
                                                    <div className="ml-12 flex gap-2">
                                                        <input id={`reply-${q.id}`} placeholder="اكتب الرد..." className="flex-1 bg-white/5 border border-white/10 p-2 rounded-lg text-sm" />
                                                        <button onClick={async () => {
                                                            const reply = document.getElementById(`reply-${q.id}`).value;
                                                            if (reply) {
                                                                await window.rtdb.update(window.rtdb.ref(window.db, `qa/${q.id}`), { reply });
                                                                showNotification('تم إرسال الرد');
                                                            }
                                                        }} className="bg-brand-primary px-4 py-2 rounded-lg text-sm font-bold">رد</button>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {activeTab === 'announcements' && (
                                    <div className="space-y-6 animate-slide-up">
                                        <div className="glass-panel p-6">
                                            <h3 className="font-bold mb-4">إعلان جديد</h3>
                                            <input id="annTitle" placeholder="عنوان الإعلان" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl mb-4" />
                                            <textarea id="annContent" placeholder="محتوى الإعلان" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl h-24 mb-4"></textarea>
                                            <button onClick={() => {
                                                const title = document.getElementById('annTitle').value;
                                                const content = document.getElementById('annContent').value;
                                                if (title && content) {
                                                    uploadItem('announcements', { title, content });
                                                    document.getElementById('annTitle').value = '';
                                                    document.getElementById('annContent').value = '';
                                                }
                                            }} className="btn-main px-6 py-3 rounded-xl font-bold">نشر الإعلان</button>
                                        </div>

                                        <div className="space-y-4">
                                            {dataState.announcements.map(ann => (
                                                <div key={ann.id} className="glass-panel p-4 flex justify-between items-center">
                                                    <div className="flex-1">
                                                        <h4 className="font-bold">{ann.title}</h4>
                                                        <p className="text-sm text-slate-400 whitespace-pre-wrap">{ann.content}</p>
                                                    </div>
                                                    {isSuperAdmin && (
                                                        <button onClick={() => deleteAnnouncement(ann.id)} className="text-red-400 hover:text-red-300 p-2">
                                                            <Icon name="trash-2" size={18} />
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'attendance' && (
                                    <AttendanceTable
                                        students={dataState.students}
                                        attendance={dataState.attendance}
                                        onUpdateAttendance={updateAttendance}
                                        isSuperAdmin={isSuperAdmin}
                                    />
                                )}

                                {activeTab === 'managers' && (
                                    <AdminManagement
                                        admins={adminsList}
                                        onAddAdmin={addNewAdmin}
                                        onRemoveAdmin={removeAdmin}
                                        isSuperAdmin={isSuperAdmin}
                                        showNotification={showNotification}
                                    />
                                )}
                            </main>
                        </div>

                        {showExamBuilder && (
                            <ExamBuilder
                                onClose={() => setShowExamBuilder(false)}
                                onSave={(examData) => { addExam(examData); setShowExamBuilder(false); }}
                                isDarkMode={isDarkMode}
                            />
                        )}

                        {showStudentModal && selectedStudent && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={() => setShowStudentModal(false)}>
                                <div className="glass-panel p-8 max-w-lg w-full max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                    <div className="flex items-center gap-4 mb-6">
                                        <img src={selectedStudent.photo} className="w-16 h-16 rounded-full border-4 border-brand-accent" />
                                        <div>
                                            <h3 className="text-xl font-bold">{selectedStudent.name}</h3>
                                            <p className="text-sm text-slate-400">{selectedStudent.email}</p>
                                            <RankBadge points={calculatePoints(selectedStudent.id)} />
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="bg-white/5 p-4 rounded-xl">
                                            <h4 className="font-bold mb-3">ملاحظة للطالب</h4>
                                            <textarea id="studentNotes" defaultValue={selectedStudent.notes || ''}
                                                placeholder="اكتب ملاحظة تظهر للطالب فقط..."
                                                className="w-full bg-black/20 border border-white/10 p-3 rounded-lg h-20 mb-2"></textarea>
                                            <button onClick={() => {
                                                const notes = document.getElementById('studentNotes').value;
                                                updateStudent(selectedStudent.id, { notes });
                                            }} className="bg-brand-primary px-4 py-2 rounded-lg text-sm font-bold">حفظ الملاحظة</button>
                                        </div>

                                        <div className="bg-white/5 p-4 rounded-xl">
                                            <h4 className="font-bold mb-3">بيانات الطالب</h4>
                                            <div className="text-sm space-y-2 text-slate-300">
                                                <p>📱 {selectedStudent.phone}</p>
                                                <p>👨‍👩‍👦 {selectedStudent.parentPhone}</p>
                                                <p>🏫 {selectedStudent.school}</p>
                                                <p>📍 {selectedStudent.governorate} - {selectedStudent.city}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={() => setShowStudentModal(false)} className="mt-6 w-full py-3 bg-white/10 rounded-xl font-bold">إغلاق</button>
                                </div>
                            </div>
                        )}

                        {selectedCourse && (
                            <CoursePurchaseModal 
                                course={selectedCourse} 
                                onClose={() => setSelectedCourse(null)} 
                                teacherNumber={CONTACT_INFO.vodafoneNumber} 
                                user={user}
                                onRequireLogin={() => {
                                    setSelectedCourse(null);
                                    showNotification('يجب تسجيل الدخول أو إنشاء حساب أولاً لإتمام الاشتراك', 'info');
                                    setShowLoginModal(true);
                                }}
                            />
                        )}
                    </div>
                );
            }

            if (view === 'loading') return (
                <div className="h-screen bg-brand-dark flex items-center justify-center text-brand-accent font-bold text-xl animate-pulse">
                    <div className="text-center">
                        <GlassIcon name="loader" size={48} className="mx-auto mb-4 animate-spin" />
                        <p>جاري التحميل...</p>
                    </div>
                </div>
            );

            return (
                <>
                    {notification && (
                        <div className={`fixed top-5 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl font-bold z-[100] text-white flex items-center gap-4 ${notification.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>
                            <div className="flex items-center gap-2">
                                <Icon name={notification.type === 'error' ? 'alert-circle' : 'check-circle'} />
                                {notification.message}
                            </div>
                            {notification.action && (
                                <button
                                    onClick={notification.action.onClick}
                                    className="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm transition"
                                >
                                    {notification.action.label}
                                </button>
                            )}
                        </div>
                    )}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
