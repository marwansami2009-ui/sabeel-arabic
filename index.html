                                                ? 'يدعم: youtube.com, youtu.be, youtube.com/embed'
                                                : 'يدعم: archive.org/details/ أو archive.org/download/'}
                                        </p>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold mb-2">الوصف</label>
                                        <textarea
                                            name="description"
                                            value={newLecture.description}
                                            onChange={handleInputChange}
                                            className="w-full p-3 bg-white/5 border border-white/10 rounded-xl h-24 resize-none"
                                            placeholder="وصف مختصر للمحاضرة"
                                        />
                                    </div>
                                    
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold mb-2">الصف</label>
                                            <select
                                                name="grade"
                                                value={newLecture.grade}
                                                onChange={handleInputChange}
                                                className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                            >
                                                <option value="1sec">أولى ثانوي</option>
                                                <option value="2sec">تانية ثانوي</option>
                                                <option value="3sec">تالتة ثانوي</option>
                                            </select>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-bold mb-2">الكورس</label>
                                            <select
                                                name="courseId"
                                                value={newLecture.courseId}
                                                onChange={handleInputChange}
                                                className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                            >
                                                <option value="">-- اختر كورس --</option>
                                                {courses.map(course => (
                                                    <option key={course.id} value={course.id}>
                                                        {course.title}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center gap-2">
                                        <input
                                            type="checkbox"
                                            name="isFree"
                                            id="isFree"
                                            checked={newLecture.isFree}
                                            onChange={handleInputChange}
                                            className="w-5 h-5"
                                        />
                                        <label htmlFor="isFree">محاضرة مجانية (يمكن للجميع مشاهدتها)</label>
                                    </div>
                                    
                                    <div className="flex gap-3 pt-4">
                                        <button onClick={() => setShowAddForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl font-bold">
                                            إلغاء
                                        </button>
                                        <button onClick={handleSubmit} className="flex-1 btn-main py-3 rounded-xl font-bold">
                                            إضافة المحاضرة
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==================== المكون الرئيسي للتطبيق ====================
        const App = () => {
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [user, setUser] = useState(null);
            const [userType, setUserType] = useState(null);
            const [view, setView] = useState('loading');
            const [dataState, setDataState] = useState({
                students: [], requests: [], lectures: [], whiteboards: [],
                qa: [], exams: [], announcements: [], payments: [], subscriptions: {},
                flashcards: [], recordings: [], attendance: {}, courses: []
            });

            useEffect(() => {
                document.body.classList.toggle('light-mode', !isDarkMode);
            }, [isDarkMode]);

            // تحميل البيانات من Firebase
            useEffect(() => {
                const collections = ['lectures', 'whiteboards', 'qa', 'announcements', 'exams', 'flashcards', 'recordings', 'courses'];
                collections.forEach(t =>
                    window.rtdb.onValue(window.rtdb.ref(window.db, t), s =>
                        setDataState(p => ({
                            ...p,
                            [t]: s.val() ? Object.entries(s.val()).map(([k, v]) => ({ id: k, ...v })).sort((a, b) => (b.ts || 0) - (a.ts || 0)) : []
                        }))
                    )
                );

                if (user && ['admin', 'boss'].includes(user.role)) {
                    window.rtdb.onValue(window.rtdb.ref(window.db, 'requests'), s =>
                        setDataState(p => ({ ...p, requests: s.val() ? Object.entries(s.val()).map(([k, v]) => ({ id: k, ...v })) : [] }))
                    );
                    window.rtdb.onValue(window.rtdb.ref(window.db, 'users'), s =>
                        setDataState(p => ({ ...p, students: s.val() ? Object.entries(s.val()).map(([k, v]) => ({ id: k, ...v })) : [] }))
                    );
                    window.rtdb.onValue(window.rtdb.ref(window.db, 'payments'), s =>
                        setDataState(p => ({ ...p, payments: s.val() ? Object.entries(s.val()).map(([k, v]) => ({ id: k, ...v })) : [] }))
                    );
                    window.rtdb.onValue(window.rtdb.ref(window.db, 'attendance'), s =>
                        setDataState(p => ({ ...p, attendance: s.val() || {} }))
                    );
                }
            }, [user]);

            const addLecture = async (lectureData) => {
                await window.rtdb.push(window.rtdb.ref(window.db, 'lectures'), {
                    ...lectureData,
                    date: new Date().toLocaleDateString('ar-EG'),
                    ts: Date.now()
                });
                alert('تم إضافة المحاضرة بنجاح ✅');
            };

            // عرض التحميل
            if (view === 'loading') {
                return (
                    <div className="h-screen bg-brand-dark flex items-center justify-center">
                        <div className="text-center">
                            <GlassIcon name="loader" size={48} className="mx-auto mb-4 animate-spin" />
                            <p className="text-brand-accent">جاري تحميل المنصة...</p>
                        </div>
                    </div>
                );
            }

            // عرض واجهة الأدمن
            if (view === 'admin') {
                return (
                    <div className="min-h-screen bg-brand-dark text-white p-8">
                        <h1 className="text-3xl font-bold mb-8">لوحة تحكم الأدمن</h1>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {/* إدارة الاشتراكات */}
                            <SubscriptionManager
                                students={dataState.students}
                                courses={dataState.courses}
                                onConfirmPayment={(id, days) => console.log('Payment confirmed', id, days)}
                                onDeactivate={(id) => console.log('Deactivated', id)}
                                isSuperAdmin={checkSuperAdmin(user)}
                            />

                            {/* إدارة المحاضرات */}
                            <LectureManager
                                courses={dataState.courses}
                                onAddLecture={addLecture}
                                onDeleteLecture={(id) => console.log('Delete', id)}
                                isSuperAdmin={checkSuperAdmin(user)}
                            />

                            {/* التقارير المتقدمة */}
                            <AdvancedReports
                                students={dataState.students}
                                attendance={dataState.attendance}
                                exams={dataState.exams}
                                courses={dataState.courses}
                            />

                            {/* النسخ الاحتياطي */}
                            <BackupSystem />
                        </div>
                    </div>
                );
            }

            // عرض واجهة الطالب
            return (
                <div className="min-h-screen bg-brand-dark text-white p-8">
                    <h1 className="text-3xl font-bold mb-8">{PLATFORM_NAME}</h1>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {/* مشغل الفيديو */}
                        <div className="glass-panel p-6">
                            <h2 className="text-xl font-bold mb-4">آخر المحاضرات</h2>
                            {dataState.lectures.slice(0, 3).map(lecture => (
                                <div key={lecture.id} className="mb-4 p-4 bg-white/5 rounded-xl">
                                    <h3 className="font-bold">{lecture.title}</h3>
                                    <AdvancedVideoPlayer src={lecture.link} title={lecture.title} />
                                </div>
                            ))}
                        </div>

                        {/* نظام المحادثة */}
                        <ChatSystem user={user} />
                    </div>
                </div>
            );
        };

        // تشغيل التطبيق مع التحقق من وجود createRoot
        const rootElement = document.getElementById('root');
        if (ReactDOM.createRoot) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        } else {
            ReactDOM.render(<App />, rootElement);
        }
    </script>
</body>
</html>
