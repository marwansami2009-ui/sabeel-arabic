    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #171717;
            --text-primary: #fafafa;

            --grid-color: rgba(255, 255, 255, 0.04);

            --plyr-control-toggle-checked-background: #d4af37;
            --plyr-video-control-background-hover: rgba(212, 175, 55, 0.3);
        }

        .light-mode {
            --bg-primary: #fafafa;
            --bg-secondary: #f4f4f5;
            --text-primary: #0a0a0a;
            --text-secondary: #52525b;
            --grid-color: rgba(0, 0, 0, 0.06);
            --glow-color: rgba(161, 161, 170, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            margin: 0;
            transition: all 0.3s ease;
        }

        .glass-panel {
            background: rgba(23, 23, 23, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 16px;
        }

        .light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
        }

        .glass-icon {
            background: linear-gradient(135deg, rgba(161, 161, 170, 0.25) 0%, rgba(82, 82, 91, 0.15) 100%);

            border: 1px solid rgba(228, 228, 231, 0.3);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(161, 161, 170, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.03);

        }

        .glass-icon:hover {
            box-shadow: 0 0 30px rgba(228, 228, 231, 0.35), inset 0 0 25px rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .btn-main {
            background: linear-gradient(135deg, #e4e4e7 0%, #a1a1aa 100%);

            font-weight: 800;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(228, 228, 231, 0.25);
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(228, 228, 231, 0.4);
        }

        /* Plyr custom styles */
        .plyr--video {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .plyr__controls {
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%);
            direction: ltr;
        }
        
        .plyr__control--overlaid {
            background: #8b0000;
            border: 2px solid #d4af37;
        }
        
        .plyr__control--overlaid:hover {
            background: #a00000;
        }
        
        .math-grid {
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .hero-glow {
            background: radial-gradient(circle at 50% 50%, var(--glow-color) 0%, transparent 50%);
        }

        .arabic-text {
            font-feature-settings: "kern" 1, "liga" 1;
            line-height: 2;
        }

        .tashkil {
            font-size: 1.1em;
            line-height: 2.2;
        }

        ::-webkit-scrollbar { width: 8px; }

        /* Chat styles */
        .chat-container {

            height: 500px;

            display: flex;

            max-width: 70%;

            border-radius: 1rem;

        .message.sent {

            color: white;
            border-bottom-right-radius: 0;
        }

        .message.received {

            background: #2d3748;
            color: white;
            border-bottom-left-radius: 0;

            right: -5px;
            background: #ef4444;
            color: white;

            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Animation for new messages */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .new-message {
            animation: pulse 0.5s ease-in-out;

</head>

<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ==================== الثوابت والإعدادات ====================
        const SUPER_ADMIN_EMAIL = 'marwansami2009@gmail.com';
        const SUPER_ADMIN_UID = 'O3NqanKElfVqOpilTTl4lME9m1q2';
        const ADMIN_SECRET_PASSWORD = '123456789';
        const MANAGER_PASSWORD = '01023456789';

        const CONTACT_INFO = {
            whatsapp: 'https://wa.me/201000000000',
            facebook: 'https://facebook.com/yourpage',
            youtube: 'https://youtube.com/yourchannel',
            telegram: 'https://t.me/yourchannel',
            vodafoneNumber: '01023456789',
            supportWhatsapp: 'https://wa.me/201000000000'
        };

        const PLATFORM_NAME = 'منصة سبيل التفوق';
        const PLATFORM_SHORT = 'سبيل التفوق';
        const TEACHER_NAME = 'أستاذ محمد حامد';
        const SUBJECT_NAME = 'اللغة العربية';

        // ==================== دوال مساعدة ====================
        const generateUniqueCode = () => {
            const prefix = 'SABEEL';
            const random = Math.floor(100000 + Math.random() * 900000);
            return `${prefix}${random}`;
        };

        const checkSuperAdmin = (user) => {
            return user?.email === SUPER_ADMIN_EMAIL || user?.uid === SUPER_ADMIN_UID;
        };

        const addTashkil = (text) => {
            if (!window.Tashkil || !text) return text;
            try {
                return window.Tashkil.process(text);
            } catch (e) {
                console.warn('Tashkil error:', e);
                return text;
            }
        };

        const formatDate = (dateString) => {
            if (!dateString) return 'غير محدد';
            try {
                return new Date(dateString).toLocaleDateString('ar-EG');
            } catch {
                return 'غير صالح';
            }
        };

        // ==================== مكون الأيقونات ====================
        const Icon = ({ name, size = 20, className = '' }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const GlassIcon = ({ name, size = 24, className = '' }) => (
            <div className={`glass-icon inline-flex items-center justify-center ${className}`}>
                <Icon name={name} size={size} />
            </div>
        );

        // ==================== دالة تحليل روابط الفيديو ====================
        const parseVideoUrl = (url) => {
            if (!url) return { type: 'unknown', url: '' };

            // YouTube - جميع الصيغ
            const youtubeRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const youtubeMatch = url.match(youtubeRegex);
            
            if (youtubeMatch) {
                return {
                    type: 'youtube',
                    videoId: youtubeMatch[1],
                    url: `https://www.youtube.com/watch?v=${youtubeMatch[1]}`,
                    embedUrl: `https://www.youtube.com/embed/${youtubeMatch[1]}`
                };
            }

            // Archive.org
            const archiveRegex = /archive\.org\/(?:details|download)\/([^\/\?]+)/i;
            const archiveMatch = url.match(archiveRegex);
            
            if (archiveMatch) {
                const identifier = archiveMatch[1];
                return {
                    type: 'archive',
                    identifier: identifier,
                    url: `https://archive.org/download/${identifier}/${identifier}.mp4`,
                    manifest: `https://archive.org/download/${identifier}/${identifier}.mp4`
                };
            }

            // رابط مباشر MP4
            if (url.match(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i)) {
                return {
                    type: 'direct',
                    url: url
                };
            }

            // رابط غير معروف
            return {
                type: 'unknown',
                url: url
            };
        };

        // ==================== مشغل الفيديو المتطور ====================
        const AdvancedVideoPlayer = ({ src, title = "فيديو", poster, onProgress, onComplete }) => {
            const videoRef = useRef(null);
            const playerRef = useRef(null);
            const [videoInfo, setVideoInfo] = useState({ type: 'unknown', url: src });
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                if (!src) return;
                
                // تحليل الرابط
                const parsed = parseVideoUrl(src);
                setVideoInfo(parsed);
                setLoading(false);

                // إذا كان HLS
                if (src.includes('.m3u8') && window.Hls && Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(src);
                    hls.attachMedia(videoRef.current);
                }

                // إنشاء مشغل Plyr
                if (videoRef.current && !playerRef.current) {
                    const player = new Plyr(videoRef.current, {
                        controls: [
                            'play-large', 'play', 'rewind', 'fast-forward',
                            'progress', 'current-time', 'duration', 'mute',
                            'volume', 'captions', 'settings', 'fullscreen'
                        ],
                        settings: ['captions', 'quality', 'speed'],
                        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
                        quality: { default: 720, options: [4320, 2880, 2160, 1440, 1080, 720, 576, 480, 360, 240] },
                        i18n: {
                            rewind: 'رجوع ١٠ ثواني',
                            fastForward: 'تقديم ١٠ ثواني',
                            play: 'تشغيل',
                            pause: 'إيقاف',
                            volume: 'مستوى الصوت',
                            mute: 'كتم الصوت',
                            unmute: 'إلغاء كتم الصوت',
                            enterFullscreen: 'ملء الشاشة',
                            exitFullscreen: 'خروج من ملء الشاشة',
                            settings: 'الإعدادات',
                        }
                    });

                    player.on('timeupdate', () => {
                        const currentProgress = (player.currentTime / player.duration) * 100;
                        setProgress(currentProgress);
                        if (onProgress) onProgress(currentProgress);
                    });

                    player.on('ended', () => {
                        if (onComplete) onComplete();
                    });

                    playerRef.current = player;
                }

                return () => {
                    if (playerRef.current) {
                        playerRef.current.destroy();
                    }
                };
            }, [src]);

            if (loading) {
                return (
                    <div className="flex items-center justify-center h-64 glass-panel">
                        <GlassIcon name="loader" size={48} className="animate-spin" />
                        <p className="mr-3">جاري تحميل المشغل...</p>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="glass-panel p-8 text-center border-red-500">
                        <GlassIcon name="alert-circle" size={48} className="mx-auto mb-4 text-red-500" />
                        <h3 className="text-xl font-bold mb-2">عذراً، حدث خطأ</h3>
                        <p className="text-slate-400">{error}</p>
                        <button 
                            onClick={() => window.open(src, '_blank')}
                            className="btn-main mt-4 px-6 py-2 rounded-xl"
                        >
                            فتح الرابط مباشرة
                        </button>
                    </div>
                );
            }

            return (
                <div className="video-player-container">
                    <video
                        ref={videoRef}
                        className="plyr"
                        playsInline
                        controls
                        crossOrigin="anonymous"
                        poster={poster}
                    >
                        {videoInfo.type === 'youtube' && (
                            <source src={videoInfo.embedUrl} type="video/youtube" />
                        )}
                        {videoInfo.type === 'archive' && (
                            <>
                                <source src={videoInfo.url} type="video/mp4" />
                                <source src={videoInfo.url.replace('.mp4', '.webm')} type="video/webm" />
                            </>
                        )}
                        {videoInfo.type === 'direct' && (
                            <source src={videoInfo.url} type="video/mp4" />
                        )}
                        <a href={src} download>تحميل الفيديو</a>
                    </video>

                    {/* شريط التقدم */}
                    {progress > 0 && (
                        <div className="mt-2 h-1 bg-white/10 rounded-full overflow-hidden">
                            <div 
                                className="h-full bg-gradient-to-r from-brand-red to-brand-gold transition-all duration-300"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                    )}
                </div>
            );
        };

        // ==================== مكون الدفع الإلكتروني ====================
        const PaymentModal = ({ amount, studentId, courseId, onSuccess, onClose }) => {
            const [method, setMethod] = useState('vodafone');
            const [processing, setProcessing] = useState(false);
            const [paymentCode, setPaymentCode] = useState('');

            useEffect(() => {
                // إنشاء كود دفع فريد
                setPaymentCode(`PAY-${Date.now()}-${Math.floor(Math.random() * 1000)}`);
            }, []);

            const processPayment = async () => {
                setProcessing(true);
                try {
                    // هنا يمكن إضافة التكامل مع Paymob أو Fawry
                    const paymentData = {
                        amount,
                        studentId,
                        courseId,
                        method,
                        paymentCode,
                        timestamp: Date.now(),
                        status: 'pending'
                    };

                    // حفظ في Firebase
                    await window.rtdb.push(window.rtdb.ref(window.db, 'payments'), paymentData);

                    // إرسال إشعار للمشرف
                    await window.rtdb.push(window.rtdb.ref(window.db, 'notifications'), {
                        type: 'new_payment',
                        data: paymentData,
                        read: false,
                        timestamp: Date.now()
                    });

                    onSuccess(paymentData);
                } catch (error) {
                    console.error('Payment error:', error);
                    alert('حدث خطأ في عملية الدفع');
                } finally {
                    setProcessing(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[1000] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="glass-panel p-8 max-w-md w-full animate-scale-in" onClick={e => e.stopPropagation()}>
                        <h2 className="text-2xl font-bold mb-6 flex items-center gap-2">
                            <GlassIcon name="credit-card" />
                            الدفع الإلكتروني
                        </h2>

                        <div className="space-y-4">
                            <div className="bg-white/5 p-4 rounded-xl">
                                <p className="text-sm text-slate-400">المبلغ المطلوب</p>
                                <p className="text-3xl font-bold text-green-400">{amount} ج.م</p>
                            </div>

                            <div>
                                <label className="block text-sm font-bold mb-2">طريقة الدفع</label>
                                <select 
                                    value={method}
                                    onChange={(e) => setMethod(e.target.value)}
                                    className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                >
                                    <option value="vodafone">فودافون كاش</option>
                                    <option value="credit">بطاقة ائتمان</option>
                                    <option value="fawry">فوري</option>
                                    <option value="instapay">إنستا باي</option>
                                </select>
                            </div>

                            <div className="bg-blue-500/10 p-4 rounded-xl border border-blue-500/20">
                                <p className="text-sm text-blue-400 mb-2">كود الدفع الخاص بك</p>
                                <p className="text-2xl font-mono font-bold text-center select-all">{paymentCode}</p>
                            </div>

                            <div className="flex gap-3 pt-4">
                                <button 
                                    onClick={onClose}
                                    className="flex-1 py-3 bg-white/10 rounded-xl font-bold"
                                >
                                    إلغاء
                                </button>
                                <button 
                                    onClick={processPayment}
                                    disabled={processing}
                                    className="flex-1 btn-main py-3 rounded-xl font-bold disabled:opacity-50"
                                >
                                    {processing ? 'جاري المعالجة...' : 'تأكيد الدفع'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==================== مكون المراسلة الفورية ====================
        const ChatSystem = ({ user, teacherId = 'teacher' }) => {
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [unreadCount, setUnreadCount] = useState(0);
            const messagesEndRef = useRef(null);
            const chatId = user?.uid ? [user.uid, teacherId].sort().join('_') : '';

            useEffect(() => {
                if (!user?.uid) return;

                // الاستماع للرسائل الجديدة
                const messagesRef = window.rtdb.ref(window.db, `chats/${chatId}`);
                
                const unsubscribe = window.rtdb.onValue(messagesRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const msgs = Object.entries(snapshot.val())
                            .map(([id, data]) => ({ id, ...data }))
                            .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                        
                        setMessages(msgs);

                        // تحديث عدد الرسائل غير المقروءة
                        const unread = msgs.filter(m => !m.read && m.sender !== user.uid).length;
                        setUnreadCount(unread);

                        // تمرير للأسفل
                        setTimeout(() => {
                            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
                        }, 100);
                    }
                });

                // تحديث حالة القراءة
                const markAsRead = async () => {
                    const updates = {};
                    messages.forEach(msg => {
                        if (!msg.read && msg.sender !== user.uid) {
                            updates[`chats/${chatId}/${msg.id}/read`] = true;
                        }
                    });
                    if (Object.keys(updates).length > 0) {
                        await window.rtdb.update(window.rtdb.ref(window.db), updates);
                    }
                };

                markAsRead();

                return () => unsubscribe();
            }, [user, chatId]);

            const sendMessage = async () => {
                if (!newMessage.trim() || !user?.uid) return;

                const message = {
                    text: newMessage,
                    sender: user.uid,
                    senderName: user.name,
                    senderPhoto: user.photo,
                    receiver: teacherId,
                    timestamp: Date.now(),
                    read: false
                };

                await window.rtdb.push(window.rtdb.ref(window.db, `chats/${chatId}`), message);
                
                // إشعار للمستلم
                await window.rtdb.push(window.rtdb.ref(window.db, `notifications/${teacherId}`), {
                    type: 'new_message',
                    from: user.uid,
                    fromName: user.name,
                    message: newMessage.substring(0, 50),
                    chatId,
                    timestamp: Date.now(),
                    read: false
                });

                setNewMessage('');
            };

            const formatMessageTime = (timestamp) => {
                if (!timestamp) return '';
                const date = new Date(timestamp);
                return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            };

            return (
                <div className="glass-panel p-4 flex flex-col h-[600px]">
                    <div className="flex items-center justify-between mb-4 pb-2 border-b border-white/10">
                        <h3 className="font-bold flex items-center gap-2">
                            <GlassIcon name="message-circle" size={20} />
                            المحادثة مع {TEACHER_NAME}
                        </h3>
                        {unreadCount > 0 && (
                            <span className="bg-red-500 text-white px-2 py-1 rounded-full text-xs">
                                {unreadCount} رسالة جديدة
                            </span>
                        )}
                    </div>

                    <div className="messages-list flex-1 overflow-y-auto mb-4">
                        {messages.length === 0 ? (
                            <div className="text-center text-slate-500 py-8">
                                <GlassIcon name="message-circle" size={32} className="mx-auto mb-2 opacity-50" />
                                <p>لا توجد رسائل بعد</p>
                                <p className="text-sm">ابدأ المحادثة مع المستر</p>
                            </div>
                        ) : (
                            messages.map((msg, idx) => (
                                <div 
                                    key={msg.id || idx} 
                                    className={`message ${msg.sender === user.uid ? 'sent' : 'received'} ${!msg.read && msg.sender !== user.uid ? 'new-message' : ''}`}
                                >
                                    {msg.sender !== user.uid && (
                                        <div className="flex items-center gap-2 mb-1">
                                            <img src={msg.senderPhoto} className="w-6 h-6 rounded-full" />
                                            <span className="text-xs font-bold">{msg.senderName}</span>
                                        </div>
                                    )}
                                    <p className="arabic-text">{addTashkil(msg.text)}</p>
                                    <div className="message-time flex justify-between items-center">
                                        <span>{formatMessageTime(msg.timestamp)}</span>
                                        {msg.sender === user.uid && msg.read && (
                                            <span className="text-xs text-blue-400 mr-2">✓ مقروءة</span>
                                        )}
                                    </div>
                                </div>
                            ))
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="flex gap-2">
                        <input
                            type="text"
                            value={newMessage}
                            onChange={(e) => setNewMessage(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                            placeholder="اكتب رسالتك هنا..."
                            className="flex-1 p-3 bg-white/5 border border-white/10 rounded-xl outline-none"
                        />
                        <button 
                            onClick={sendMessage}
                            disabled={!newMessage.trim()}
                            className="btn-main px-4 rounded-xl disabled:opacity-50"
                        >
                            <Icon name="send" size={20} />
                        </button>
                    </div>
                </div>
            );
        };

        // ==================== مكون التقارير المتقدمة ====================
        const AdvancedReports = ({ students, attendance, exams, courses }) => {
            const [reportType, setReportType] = useState('summary');
            const [dateRange, setDateRange] = useState({ start: '', end: '' });

            const generateReport = useCallback(() => {
                const report = {
                    summary: {
                        totalStudents: students.length,
                        activeStudents: students.filter(s => s.isPaid).length,
                        pendingStudents: students.filter(s => !s.isPaid).length,
                        totalCourses: courses.length,
                        totalExams: exams.length,
                        totalLectures: 0 // سيتم حسابه لاحقاً
                    },
                    attendance: calculateAttendanceStats(),
                    performance: calculatePerformanceStats(),
                    financial: calculateFinancialStats()
                };
                return report;
            }, [students, attendance, exams, courses]);

            const calculateAttendanceStats = () => {
                let total = 0;
                let present = 0;
                
                Object.values(attendance).forEach(studentAttendance => {
                    Object.values(studentAttendance).forEach(day => {
                        total++;
                        if (day.status === 'present') present++;
                    });
                });

                return {
                    total,
                    present,
                    absent: total - present,
                    rate: total > 0 ? ((present / total) * 100).toFixed(1) : 0
                };
            };

            const calculatePerformanceStats = () => {
                const stats = {
                    excellent: 0,
                    good: 0,
                    average: 0,
                    weak: 0
                };

                students.forEach(s => {
                    if (s.level === 'ممتاز') stats.excellent++;
                    else if (s.level === 'جيد') stats.good++;
                    else if (s.level === 'متوسط') stats.average++;
                    else if (s.level === 'ضعيف') stats.weak++;
                });

                return stats;
            };

            const calculateFinancialStats = () => {
                let totalRevenue = 0;
                let paidCount = 0;

                students.forEach(s => {
                    if (s.isPaid) {
                        paidCount++;
                        // يمكن إضافة حساب الإيرادات بناءً على الكورسات المشترك فيها
                    }
                });

                return {
                    totalRevenue,
                    paidCount,
                    pendingCount: students.length - paidCount
                };
            };

            const exportToExcel = () => {
                const report = generateReport();
                
                // إنشاء sheets متعددة
                const wb = XLSX.utils.book_new();

                // Sheet الطلاب
                const studentsSheet = XLSX.utils.json_to_sheet(
                    students.map(s => ({
                        الاسم: s.name,
                        البريد: s.email,
                        الهاتف: s.phone,
                        الصف: s.grade,
                        الحالة: s.isPaid ? 'مفعل' : 'غير مفعل',
                        المستوى: s.level || 'جديد'
                    }))
                );
                XLSX.utils.book_append_sheet(wb, studentsSheet, "الطلاب");

                // Sheet الإحصائيات
                const statsSheet = XLSX.utils.json_to_sheet([
                    { 'المؤشر': 'إجمالي الطلاب', 'القيمة': report.summary.totalStudents },
                    { 'المؤشر': 'الطلاب المفعلين', 'القيمة': report.summary.activeStudents },
                    { 'المؤشر': 'نسبة الحضور', 'القيمة': `${report.attendance.rate}%` },
                    { 'المؤشر': 'عدد الحضور', 'القيمة': report.attendance.present },
                    { 'المؤشر': 'عدد الغياب', 'القيمة': report.attendance.absent }
                ]);
                XLSX.utils.book_append_sheet(wb, statsSheet, "إحصائيات");

                // تصدير الملف
                XLSX.writeFile(wb, `تقرير_سبيل_التفوق_${new Date().toLocaleDateString()}.xlsx`);
            };

            const report = generateReport();

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="glass-panel p-6">
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                <GlassIcon name="bar-chart-2" size={24} />
                                التقارير المتقدمة
                            </h2>
                            <button onClick={exportToExcel} className="btn-main px-4 py-2 rounded-xl font-bold flex items-center gap-2">
                                <Icon name="download" size={18} />
                                تصدير Excel
                            </button>
                        </div>

                        <div className="flex gap-4 mb-6">
                            <select 
                                value={reportType}
                                onChange={(e) => setReportType(e.target.value)}
                                className="bg-white/5 border border-white/10 px-4 py-2 rounded-xl"
                            >
                                <option value="summary">تقرير شامل</option>
                                <option value="attendance">تقرير الحضور</option>
                                <option value="performance">تقرير الأداء</option>
                                <option value="financial">تقرير مالي</option>
                            </select>
                        </div>

                        {/* بطاقات الإحصائيات */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                            <div className="bg-white/5 p-4 rounded-xl">
                                <p className="text-sm text-slate-400">إجمالي الطلاب</p>
                                <p className="text-3xl font-bold text-blue-400">{report.summary.totalStudents}</p>
                            </div>
                            <div className="bg-white/5 p-4 rounded-xl">
                                <p className="text-sm text-slate-400">الطلاب المفعلين</p>
                                <p className="text-3xl font-bold text-green-400">{report.summary.activeStudents}</p>
                            </div>
                            <div className="bg-white/5 p-4 rounded-xl">
                                <p className="text-sm text-slate-400">نسبة الحضور</p>
                                <p className="text-3xl font-bold text-yellow-400">{report.attendance.rate}%</p>
                            </div>
                            <div className="bg-white/5 p-4 rounded-xl">
                                <p className="text-sm text-slate-400">عدد الامتحانات</p>
                                <p className="text-3xl font-bold text-purple-400">{report.summary.totalExams}</p>
                            </div>
                        </div>

                        {/* رسم بياني بسيط */}
                        {reportType === 'performance' && (
                            <div className="mt-6">
                                <h3 className="font-bold mb-4">توزيع مستويات الطلاب</h3>
                                <div className="space-y-3">
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span>ممتاز</span>
                                            <span>{report.performance.excellent} طالب</span>
                                        </div>
                                        <div className="h-2 bg-white/10 rounded-full overflow-hidden">
                                            <div 
                                                className="h-full bg-green-500"
                                                style={{ width: `${(report.performance.excellent / report.summary.totalStudents) * 100}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span>جيد</span>
                                            <span>{report.performance.good} طالب</span>
                                        </div>
                                        <div className="h-2 bg-white/10 rounded-full overflow-hidden">
                                            <div 
                                                className="h-full bg-blue-500"
                                                style={{ width: `${(report.performance.good / report.summary.totalStudents) * 100}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span>متوسط</span>
                                            <span>{report.performance.average} طالب</span>
                                        </div>
                                        <div className="h-2 bg-white/10 rounded-full overflow-hidden">
                                            <div 
                                                className="h-full bg-yellow-500"
                                                style={{ width: `${(report.performance.average / report.summary.totalStudents) * 100}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span>ضعيف</span>
                                            <span>{report.performance.weak} طالب</span>
                                        </div>
                                        <div className="h-2 bg-white/10 rounded-full overflow-hidden">
                                            <div 
                                                className="h-full bg-red-500"
                                                style={{ width: `${(report.performance.weak / report.summary.totalStudents) * 100}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==================== مكون النسخ الاحتياطي ====================
        const BackupSystem = ({ onBackupComplete }) => {
            const [backupHistory, setBackupHistory] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                // تحميل سجل النسخ الاحتياطية
                const backupsRef = window.rtdb.ref(window.db, 'backups');
                window.rtdb.onValue(backupsRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const backups = Object.entries(snapshot.val())
                            .map(([id, data]) => ({ id, ...data }))
                            .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        setBackupHistory(backups);
                    }
                });
            }, []);

            const createBackup = async () => {
                setLoading(true);
                try {
                    // جمع جميع البيانات
                    const data = {
                        users: await getAllData('users'),
                        courses: await getAllData('courses'),
                        lectures: await getAllData('lectures'),
                        exams: await getAllData('exams'),
                        whiteboards: await getAllData('whiteboards'),
                        recordings: await getAllData('recordings'),
                        flashcards: await getAllData('flashcards'),
                        announcements: await getAllData('announcements'),
                        attendance: await getAllData('attendance'),
                        timestamp: Date.now(),
                        version: '2.0'
                    };

                    // ضغط البيانات
                    const compressed = LZString.compress(JSON.stringify(data));

                    // حفظ في Firebase
                    const backupRef = await window.rtdb.push(window.rtdb.ref(window.db, 'backups'), {
                        timestamp: Date.now(),
                        size: compressed.length,
                        type: 'automatic'
                    });

                    // حفظ في localStorage كنسخة احتياطية محلية
                    localStorage.setItem('sabeel_backup', compressed);

                    // تحميل كملف
                    const blob = new Blob([compressed], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `sabeel_backup_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();

                    if (onBackupComplete) onBackupComplete(data);
                    
                    alert('تم إنشاء النسخة الاحتياطية بنجاح');
                } catch (error) {
                    console.error('Backup error:', error);
                    alert('حدث خطأ أثناء إنشاء النسخة الاحتياطية');
                } finally {
                    setLoading(false);
                }
            };

            const getAllData = async (path) => {
                const snapshot = await window.rtdb.get(window.rtdb.ref(window.db, path));
                return snapshot.exists() ? snapshot.val() : {};
            };

            const restoreBackup = async (file) => {
                setLoading(true);
                try {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const decompressed = LZString.decompress(e.target.result);
                            const data = JSON.parse(decompressed);

                            // استعادة البيانات
                            for (const [key, value] of Object.entries(data)) {
                                if (key !== 'timestamp' && key !== 'version') {
                                    await window.rtdb.set(window.rtdb.ref(window.db, key), value);
                                }
                            }

                            alert('تم استعادة النسخة الاحتياطية بنجاح');
                            window.location.reload();
                        } catch (error) {
                            console.error('Restore error:', error);
                            alert('خطأ في استعادة البيانات');
                        }
                    };
                    reader.readAsText(file);
                } catch (error) {
                    console.error('File read error:', error);
                    alert('خطأ في قراءة الملف');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="glass-panel p-6">
                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                        <GlassIcon name="database" size={20} />
                        النسخ الاحتياطي
                    </h3>

                    <div className="space-y-4">
                        <button 
                            onClick={createBackup}
                            disabled={loading}
                            className="btn-main w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50"
                        >
                            {loading ? (
                                <>
                                    <Icon name="loader" className="animate-spin" />
                                    جاري النسخ...
                                </>
                            ) : (
                                <>
                                    <Icon name="download" />
                                    إنشاء نسخة احتياطية جديدة
                                </>
                            )}
                        </button>

                        <div className="relative">
                            <input
                                type="file"
                                accept=".json"
                                onChange={(e) => restoreBackup(e.target.files[0])}
                                className="absolute inset-0 opacity-0 cursor-pointer"
                                disabled={loading}
                            />
                            <button className="w-full py-3 bg-white/5 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-white/10 transition">
                                <Icon name="upload" />
                                استعادة نسخة احتياطية
                            </button>
                        </div>

                        {backupHistory.length > 0 && (
                            <div className="mt-4">
                                <h4 className="font-bold mb-2 text-sm">آخر النسخ الاحتياطية:</h4>
                                <div className="space-y-2 max-h-40 overflow-y-auto">
                                    {backupHistory.slice(0, 5).map(backup => (
                                        <div key={backup.id} className="bg-white/5 p-2 rounded-lg text-xs flex justify-between">
                                            <span>{new Date(backup.timestamp).toLocaleString('ar-EG')}</span>
                                            <span className="text-slate-400">{Math.round(backup.size / 1024)} KB</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==================== مكون الإشعارات ====================
        const NotificationsSystem = ({ userId }) => {
            const [notifications, setNotifications] = useState([]);
            const [showDropdown, setShowDropdown] = useState(false);

            useEffect(() => {
                if (!userId) return;

                // الاستماع للإشعارات
                const notificationsRef = window.rtdb.ref(window.db, `notifications/${userId}`);
                
                const unsubscribe = window.rtdb.onValue(notificationsRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const notifs = Object.entries(snapshot.val())
                            .map(([id, data]) => ({ id, ...data }))
                            .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        setNotifications(notifs);
                    }
                });

                // طلب إذن الإشعارات
                if (Notification.permission === 'default') {
                    Notification.requestPermission();
                }

                // إعداد FCM
                if (window.messaging) {
                    getToken(window.messaging, { vapidKey: 'YOUR_VAPID_KEY' })
                        .then((currentToken) => {
                            if (currentToken) {
                                console.log('FCM Token:', currentToken);
                            }
                        });
                }

                return () => unsubscribe();
            }, [userId]);

            const markAsRead = async (notificationId) => {
                await window.rtdb.update(
                    window.rtdb.ref(window.db, `notifications/${userId}/${notificationId}`),
                    { read: true }
                );
            };

            const markAllAsRead = async () => {
                const updates = {};
                notifications.forEach(n => {
                    if (!n.read) {
                        updates[`notifications/${userId}/${n.id}/read`] = true;
                    }
                });
                await window.rtdb.update(window.rtdb.ref(window.db), updates);
            };

            const unreadCount = notifications.filter(n => !n.read).length;

            return (
                <div className="relative">
                    <button 
                        onClick={() => setShowDropdown(!showDropdown)}
                        className="relative p-2 hover:bg-white/10 rounded-lg transition"
                    >
                        <Icon name="bell" size={20} />
                        {unreadCount > 0 && (
                            <span className="notification-badge">{unreadCount}</span>
                        )}
                    </button>

                    {showDropdown && (
                        <div className="absolute left-0 top-full mt-2 w-80 glass-panel p-2 z-50">
                            <div className="flex items-center justify-between mb-2 pb-2 border-b border-white/10">
                                <h3 className="font-bold">الإشعارات</h3>
                                {unreadCount > 0 && (
                                    <button 
                                        onClick={markAllAsRead}
                                        className="text-xs text-blue-400 hover:underline"
                                    >
                                        تحديد الكل كمقروء
                                    </button>
                                )}
                            </div>

                            <div className="max-h-96 overflow-y-auto">
                                {notifications.length === 0 ? (
                                    <p className="text-center text-slate-500 py-4">لا توجد إشعارات</p>
                                ) : (
                                    notifications.map(notif => (
                                        <div 
                                            key={notif.id}
                                            onClick={() => markAsRead(notif.id)}
                                            className={`p-3 rounded-lg mb-1 cursor-pointer transition ${
                                                notif.read ? 'bg-white/5' : 'bg-blue-500/10 border-r-2 border-blue-500'
                                            }`}
                                        >
                                            <p className="text-sm font-bold">{notif.type === 'new_message' ? 'رسالة جديدة' : 'إشعار'}</p>
                                            <p className="text-xs text-slate-400 mt-1">{notif.message}</p>
                                            <p className="text-xs text-slate-500 mt-1">
                                                {new Date(notif.timestamp).toLocaleString('ar-EG')}
                                            </p>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==================== مكون إدارة الاشتراكات (معدل) ====================
        const SubscriptionManager = ({ students, courses, onConfirmPayment, onDeactivate, isSuperAdmin }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [yearFilter, setYearFilter] = useState('all');
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [showActivationModal, setShowActivationModal] = useState(false);
            const [loading, setLoading] = useState(false);
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [selectedCourseForPayment, setSelectedCourseForPayment] = useState(null);

            if (!students || !courses) {
                return (
                    <div className="glass-panel p-8 text-center">
                        <GlassIcon name="loader" size={48} className="mx-auto mb-4 animate-spin" />
                        <p>جاري تحميل البيانات...</p>
                    </div>
                );
            }

            const filteredStudents = students.filter(s => {
                const matchesSearch = s.name?.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                    s.email?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    s.code?.toLowerCase().includes(searchTerm.toLowerCase());
                if (yearFilter !== 'all' && s.grade !== yearFilter) return false;
                return matchesSearch && !['admin', 'boss'].includes(s.role);
            });

            const handleActivateSubscription = async (studentId, courseId, days) => {
                setLoading(true);
                try {
                    const endDate = new Date();
                    endDate.setDate(endDate.getDate() + parseInt(days));
                    
                    const student = students.find(s => s.id === studentId);
                    const currentEnrolled = student?.enrolledCourses || [];
                    
                    if (!currentEnrolled.includes(courseId)) {
                        const updatedEnrolled = [...currentEnrolled, courseId];
                        
                        await window.rtdb.update(window.rtdb.ref(window.db, `users/${studentId}`), {
                            isPaid: true,
                            enrolledCourses: updatedEnrolled,
                            subscriptionEnd: endDate.toISOString(),
                            subscriptionStart: new Date().toISOString()
                        });

                        // إضافة إشعار للطالب
                        await window.rtdb.push(window.rtdb.ref(window.db, `notifications/${studentId}`), {
                            type: 'subscription_activated',
                            message: `تم تفعيل اشتراكك في كورس: ${courses.find(c => c.id === courseId)?.title}`,
                            timestamp: Date.now(),
                            read: false
                        });
                        
                        if (onConfirmPayment) onConfirmPayment(studentId, days);
                    }
                } catch (error) {
                    console.error('Activation error:', error);
                    alert('حدث خطأ أثناء التفعيل');
                } finally {
                    setLoading(false);
                    setShowActivationModal(false);
                }
            };

            const handlePaymentClick = (student, course) => {
                setSelectedStudent(student);
                setSelectedCourseForPayment(course);
                setShowPaymentModal(true);
            };

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="glass-panel p-6 space-y-4">
                        <h2 className="text-2xl font-bold flex items-center gap-2">
                            <GlassIcon name="credit-card" size={24} /> إدارة الاشتراكات
                        </h2>

                        <div className="flex flex-wrap gap-4 items-center">
                            <input
                                placeholder="بحث بالاسم أو البريد أو الكود..."
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                className="bg-white/5 border border-white/10 p-3 rounded-xl flex-1 min-w-[250px] focus:border-brand-primary/50 transition outline-none"
                            />

                            <div className="flex bg-white/5 p-1 rounded-xl border border-white/10">
                                {['all', '1sec', '2sec', '3sec'].map(y => (
                                    <button
                                        key={y}
                                        onClick={() => setYearFilter(y)}
                                        className={`px-4 py-2 rounded-lg text-sm font-bold transition ${yearFilter === y ? 'bg-brand-primary text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        {y === 'all' ? 'الكل' : y === '1sec' ? '1ث' : y === '2sec' ? '2ث' : '3ث'}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {filteredStudents.length === 0 ? (
                        <div className="glass-panel p-12 text-center">
                            <GlassIcon name="users" size={48} className="mx-auto mb-4 opacity-50" />
                            <h3 className="text-xl font-bold mb-2">لا يوجد طلاب</h3>
                            <p className="text-slate-400">لا توجد نتائج مطابقة للبحث</p>
                        </div>
                    ) : (
                        <div className="glass-panel overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-right min-w-[1000px]">
                                    <thead className="bg-white/5 text-slate-300">
                                        <tr>
                                            <th className="p-4">الطالب</th>
                                            <th className="p-4">الكود</th>
                                            <th className="p-4">الكورسات المفعلة</th>
                                            <th className="p-4">تاريخ الانتهاء</th>
                                            <th className="p-4">إجراءات</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredStudents.map(student => {
                                            const daysLeft = student.subscriptionEnd ? 
                                                Math.ceil((new Date(student.subscriptionEnd) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
                                            const enrolledCourses = student.enrolledCourses || [];
                                            const enrolledCourseDetails = courses.filter(c => enrolledCourses.includes(c.id));

                                            return (
                                                <tr key={student.id} className="border-b border-white/5 hover:bg-white/5 transition">
                                                    <td className="p-4">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded-full bg-slate-700 overflow-hidden">
                                                                <img 
                                                                    src={student.photo || 'https://via.placeholder.com/40'} 
                                                                    className="w-full h-full object-cover"
                                                                    onError={(e) => { e.target.src = 'https://via.placeholder.com/40'; }}
                                                                />
                                                            </div>
                                                            <div>
                                                                <p className="font-bold">{student.name || 'بدون اسم'}</p>
                                                                <p className="text-xs text-slate-400">{student.email || 'بريد غير متوفر'}</p>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="p-4 font-mono text-sm">
                                                        {student.code || '---'}
                                                    </td>
                                                    <td className="p-4">
                                                        {enrolledCourseDetails.length > 0 ? (
                                                            <div className="flex flex-wrap gap-1">
                                                                {enrolledCourseDetails.map(c => (
                                                                    <span key={c.id} className="bg-green-500/20 text-green-300 px-2 py-1 rounded text-xs font-bold">
                                                                        {c.title}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        ) : (
                                                            <span className="text-slate-500 text-sm">لا يوجد</span>
                                                        )}
                                                    </td>
                                                    <td className="p-4">
                                                        {student.isPaid && student.subscriptionEnd ? (
                                                            <div className={daysLeft > 0 ? "text-green-400" : "text-red-400"}>
                                                                {formatDate(student.subscriptionEnd)}
                                                                <div className="text-xs opacity-70">
                                                                    {daysLeft > 0 ? `باقي ${daysLeft} يوم` : 'منتهي'}
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <span className="text-slate-500 font-bold">غير مفعل</span>
                                                        )}
                                                    </td>
                                                    <td className="p-4">
                                                        <div className="flex gap-2 flex-wrap">
                                                            <button 
                                                                onClick={() => {
                                                                    setSelectedStudent(student);
                                                                    setShowActivationModal(true);
                                                                }}
                                                                className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md"
                                                            >
                                                                <Icon name="zap" size={14} /> تفعيل كورس
                                                            </button>
                                                            
                                                            {student.isPaid && (
                                                                <button 
                                                                    onClick={() => handlePaymentClick(student, enrolledCourseDetails[0])}
                                                                    className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md"
                                                                >
                                                                    <Icon name="credit-card" size={14} /> تجديد
                                                                </button>
                                                            )}
                                                            
                                                            <button 
                                                                onClick={() => {
                                                                    if (confirm(`هل أنت متأكد من إلغاء اشتراك ${student.name}؟`)) {
                                                                        onDeactivate(student.id);
                                                                    }
                                                                }} 
                                                                className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md"
                                                            >
                                                                <Icon name="x-circle" size={14} /> إلغاء
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* نافذة تفعيل الاشتراك */}
                    {showActivationModal && selectedStudent && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4" onClick={() => setShowActivationModal(false)}>
                            <div className="glass-panel p-8 max-w-md w-full animate-scale-in" onClick={e => e.stopPropagation()}>
                                <h3 className="text-2xl font-bold mb-6 flex items-center gap-2">
                                    <GlassIcon name="zap" className="text-green-500" />
                                    تفعيل اشتراك الطالب
                                </h3>

                                <div className="mb-6">
                                    <p className="text-sm text-slate-400 mb-2">الطالب:</p>
                                    <div className="bg-white/5 p-3 rounded-xl flex items-center gap-3">
                                        <img 
                                            src={selectedStudent.photo || 'https://via.placeholder.com/40'} 
                                            className="w-10 h-10 rounded-full"
                                            onError={(e) => { e.target.src = 'https://via.placeholder.com/40'; }}
                                        />
                                        <div>
                                            <p className="font-bold">{selectedStudent.name}</p>
                                            <p className="text-xs text-slate-400">{selectedStudent.email}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-sm font-bold mb-2">اختر الكورس</label>
                                        <select 
                                            id="courseSelect"
                                            className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none"
                                            defaultValue=""
                                        >
                                            <option value="">-- اختر كورس --</option>
                                            {courses.map(course => (
                                                <option key={course.id} value={course.id}>
                                                    {course.title} - {course.grade === '1sec' ? 'أولى ثانوي' : course.grade === '2sec' ? 'تانية ثانوي' : 'تالتة ثانوي'} ({course.price} ج.م)
                                                </option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold mb-2">مدة الاشتراك (أيام)</label>
                                        <input 
                                            id="daysInput"
                                            type="number"
                                            defaultValue="30"
                                            min="1"
                                            max="365"
                                            className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setShowActivationModal(false)}
                                        className="flex-1 py-4 bg-white/10 rounded-xl font-bold hover:bg-white/20 transition"
                                    >
                                        إلغاء
                                    </button>
                                    <button 
                                        onClick={() => {
                                            const courseId = document.getElementById('courseSelect').value;
                                            const days = document.getElementById('daysInput').value;
                                            if (!courseId) {
                                                alert('الرجاء اختيار كورس');
                                                return;
                                            }
                                            handleActivateSubscription(selectedStudent.id, courseId, days);
                                        }}
                                        disabled={loading}
                                        className="flex-1 btn-main py-4 rounded-xl font-bold disabled:opacity-50"
                                    >
                                        {loading ? 'جاري التفعيل...' : 'تفعيل الاشتراك'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* نافذة الدفع */}
                    {showPaymentModal && selectedStudent && selectedCourseForPayment && (
                        <PaymentModal
                            amount={selectedCourseForPayment.price}
                            studentId={selectedStudent.id}
                            courseId={selectedCourseForPayment.id}
                            onSuccess={() => {
                                setShowPaymentModal(false);
                                alert('تم إرسال طلب الدفع وسيتم تفعيل الاشتراك بعد التأكيد');
                            }}
                            onClose={() => setShowPaymentModal(false)}
                        />
                    )}
                </div>
            );
        };

        // ==================== مكون إدارة المحاضرات (معدل) ====================
        const LectureManager = ({ courses, onAddLecture, onDeleteLecture, isSuperAdmin }) => {
            const [showAddForm, setShowAddForm] = useState(false);
            const [newLecture, setNewLecture] = useState({
                title: '',
                link: '',
                description: '',
                grade: '1sec',
                courseId: '',
                isFree: false,
                source: 'youtube' // youtube أو archive
            });

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setNewLecture({
                    ...newLecture,
                    [name]: type === 'checkbox' ? checked : value
                });
            };

            const handleSourceChange = (source) => {
                setNewLecture({ ...newLecture, source });
            };

            const handleSubmit = () => {
                if (!newLecture.title || !newLecture.link || !newLecture.courseId) {
                    alert('يرجى ملء جميع الحقول المطلوبة');
                    return;
                }

                // تحليل الرابط حسب المصدر
                const parsed = parseVideoUrl(newLecture.link);
                
                const lectureData = {
                    ...newLecture,
                    parsedUrl: parsed,
                    timestamp: Date.now()
                };

                onAddLecture(lectureData);
                setShowAddForm(false);
                setNewLecture({
                    title: '',
                    link: '',
                    description: '',
                    grade: '1sec',
                    courseId: '',
                    isFree: false,
                    source: 'youtube'
                });
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold flex items-center gap-2">
                            <GlassIcon name="video" size={24} /> إدارة المحاضرات
                        </h2>
                        <button onClick={() => setShowAddForm(true)} className="btn-main px-6 py-2 rounded-xl font-bold flex items-center gap-2">
                            <Icon name="plus" size={18} /> إضافة محاضرة
                        </button>
                    </div>
                    
                    {showAddForm && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={() => setShowAddForm(false)}>
                            <div className="glass-panel p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <h3 className="text-2xl font-bold mb-6">إضافة محاضرة جديدة</h3>
                                
                                <div className="space-y-4">
                                    {/* اختيار المصدر */}
                                    <div>
                                        <label className="block text-sm font-bold mb-2">مصدر الفيديو</label>
                                        <div className="flex gap-4">
                                            <button
                                                onClick={() => handleSourceChange('youtube')}
                                                className={`flex-1 p-4 rounded-xl border-2 transition ${
                                                    newLecture.source === 'youtube' 
                                                        ? 'border-red-500 bg-red-500/10' 
                                                        : 'border-white/10'
                                                }`}
                                            >
                                                <Icon name="youtube" size={24} className="mx-auto mb-2" />
                                                <span>YouTube</span>
                                            </button>
                                            <button
                                                onClick={() => handleSourceChange('archive')}
                                                className={`flex-1 p-4 rounded-xl border-2 transition ${
                                                    newLecture.source === 'archive' 
                                                        ? 'border-blue-500 bg-blue-500/10' 
                                                        : 'border-white/10'
                                                }`}
                                            >
                                                <Icon name="archive" size={24} className="mx-auto mb-2" />
                                                <span>Archive.org</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold mb-2">عنوان المحاضرة</label>
                                        <input
                                            name="title"
                                            value={newLecture.title}
                                            onChange={handleInputChange}
                                            className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                            placeholder="مثال: شرح درس الميزان الصرفي"
                                        />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold mb-2">
                                            {newLecture.source === 'youtube' ? 'رابط YouTube' : 'رابط Archive.org'}
                                        </label>
                                        <input
                                            name="link"
                                            value={newLecture.link}
                                            onChange={handleInputChange}
                                            className="w-full p-3 bg-white/5 border border-white/10 rounded-xl"
                                            placeholder={newLecture.source === 'youtube' 
                                                ? 'https://youtube.com/watch?v=... أو https://youtu.be/...' 
                                                : 'https://archive.org/details/...'}
                                        />
                                        <p className="text-xs text-slate-400 mt-1">
                                            {newLecture.source === 'youtube'
