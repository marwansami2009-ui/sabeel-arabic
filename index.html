<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سبيل التفوق | أستاذ محمد حامد</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="module">

        import { getDatabase, ref, set, get, child, push, update, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, signInWithPhoneNumber, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: 'AIzaSyDZ9y1XLS0wMR0kKdEOO91utF7-5p9vp_M',
            authDomain: 'sabeel-platform-official.firebaseapp.com',
            projectId: 'sabeel-platform-official',
            storageBucket: 'sabeel-platform-official.firebasestorage.app',
            messagingSenderId: '150583731393',
            appId: '1:150583731393:web:8c181e212832356af2e040',
            measurementId: 'G-65HE8PB0XT',
            databaseURL: 'https://sabeel-platform-official-default-rtdb.asia-southeast1.firebasedatabase.app'

        const app = initializeApp(firebaseConfig);

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0a0a0a',
                            card: '#171717',
                            primary: '#a1a1aa',
                            accent: '#e4e4e7',
                        }
                    },
                    fontFamily: { 'cairo': ['Cairo', 'sans-serif'] },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.8s ease-out',
                        'flip': 'flip 0.6s ease-in-out',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        flip: { '0%': { transform: 'rotateY(0deg)' }, '100%': { transform: 'rotateY(180deg)' } },
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #171717;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --grid-color: rgba(255, 255, 255, 0.04);
            --glow-color: rgba(228, 228, 231, 0.12);
        }

        .light-mode {
            --bg-primary: #fafafa;
            --bg-secondary: #f4f4f5;
            --text-primary: #0a0a0a;
            --text-secondary: #52525b;
            --grid-color: rgba(0, 0, 0, 0.06);
            --glow-color: rgba(161, 161, 170, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            margin: 0;
            transition: all 0.3s ease;
        }

        .glass-panel {
            background: rgba(23, 23, 23, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 16px;
        }

        .light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
        }

        .glass-icon {
            background: linear-gradient(135deg, rgba(161, 161, 170, 0.25) 0%, rgba(82, 82, 91, 0.15) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(228, 228, 231, 0.3);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(161, 161, 170, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        .glass-icon:hover {
            box-shadow: 0 0 30px rgba(228, 228, 231, 0.35), inset 0 0 25px rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .btn-main {
            background: linear-gradient(135deg, #e4e4e7 0%, #a1a1aa 100%);
            color: #0a0a0a;
            font-weight: 800;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(228, 228, 231, 0.25);
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(228, 228, 231, 0.4);
        }

        .embed-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .embed-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .math-grid {
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .hero-glow {
            background: radial-gradient(circle at 50% 50%, var(--glow-color) 0%, transparent 50%);
        }

        .light-mode .hero-glow {
            background: radial-gradient(circle at 50% 50%, rgba(161, 161, 170, 0.1) 0%, rgba(250, 250, 250, 0.95) 50%);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #fbbf24;
        }

        .theme-toggle button {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle button.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .auth-dropdown {
            position: relative;
        }

        .auth-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .auth-dropdown:hover .auth-menu,
        .auth-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .auth-menu button {
            width: 100%;
            padding: 12px 16px;
            text-align: right;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-menu button:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .flashcard-container {
            perspective: 1000px;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 200px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .flashcard-front {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3) 0%, rgba(30, 41, 59, 0.9) 100%);
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .flashcard-back {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.3) 0%, rgba(30, 41, 59, 0.9) 100%);
            border: 1px solid rgba(251, 191, 36, 0.4);
            transform: rotateY(180deg);
        }

        .locked-content {
            position: relative;
            overflow: hidden;
        }

        .locked-content::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .rank-novice {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
        }

        .rank-advanced {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .rank-legend {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #0f172a;
        }

        .quiz-option {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .quiz-option:hover {
            transform: translateX(-5px);
            border-color: #fbbf24;
        }

        .quiz-option.selected {
            background: rgba(251, 191, 36, 0.2);
            border-color: #fbbf24;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 🔐 Security Constants
        const SUPER_ADMIN_EMAIL = 'marwansami2009@gmail.com';
        const SUPER_ADMIN_UID = 'O3NqanKElfVqOpilTTl4lME9m1q2';
        const ADMIN_SECRET_PASSWORD = '123456789';
        const MANAGER_PASSWORD = '01023456789';

        // 📱 Contact Info
        const CONTACT_INFO = {
            whatsapp: 'https://wa.me/201000000000',
            facebook: 'https://facebook.com/yourpage',
            youtube: 'https://youtube.com/yourchannel',
            telegram: 'https://t.me/yourchannel',
            vodafoneNumber: '010xxxxxxxx',
            supportWhatsapp: 'https://wa.me/201000000000'
        };

        // 🏷️ Platform Branding
        const PLATFORM_NAME = 'منصة سبيل التفوق';
        const PLATFORM_SHORT = 'سبيل التفوق';
        const TEACHER_NAME = 'أستاذ محمد حامد';
        const SUBJECT_NAME = 'اللغة العربية';

        // 🎨 Icon Component
        const Icon = ({ name, size = 20, className = '' }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // 🎨 Glass Icon Component
        const GlassIcon = ({ name, size = 24, className = '' }) => (
            <div className={`glass-icon inline-flex items-center justify-center ${className}`}>
                <Icon name={name} size={size} />
            </div>
        );

        // ✅ Phone Login Component
        const PhoneLoginModal = ({ onClose, onLoginSuccess }) => {
            const [phoneNumber, setPhoneNumber] = useState('');
            const [otp, setOtp] = useState('');
            const [step, setStep] = useState('phone');
            const [verificationId, setVerificationId] = useState(null);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const setupRecaptcha = () => {
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new window.authMethods.RecaptchaVerifier('recaptcha-container', {
                        'size': 'invisible',
                        'callback': () => { }
                    }, window.auth);
                }
            };

            const handleSendOtp = async () => {
                setLoading(true);
                setError('');
                try {
                    setupRecaptcha();
                    const formattedPhone = phoneNumber.startsWith('+20') ? phoneNumber : `+2${phoneNumber}`;
                    const confirmation = await window.authMethods.signInWithPhoneNumber(window.auth, formattedPhone, window.recaptchaVerifier);
                    setVerificationId(confirmation.verificationId);
                    setStep('otp');
                } catch (err) {
                    console.error("Phone auth error:", err);
                    setError('فشل إرسال الرمز. تأكد من رقم الهاتف وحاول مجدداً.');
                } finally {
                    setLoading(false);
                }
            };

            const handleVerifyOtp = async () => {
                setLoading(true);
                setError('');
                try {
                    const credential = window.auth.PhoneAuthProvider.credential(verificationId, otp);
                    const userCredential = await window.auth.signInWithCredential(credential);
                    onLoginSuccess(userCredential.user);
                    onClose();
                } catch (err) {
                    console.error("OTP verification error:", err);
                    setError('الرمز غير صحيح. حاول مجدداً.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={onClose}>
                    <div className="glass-panel p-8 max-w-md w-full" onClick={e => e.stopPropagation()}>
                        <h2 className="text-2xl font-bold mb-6 text-center">تسجيل الدخول برقم الهاتف</h2>
                        <div id="recaptcha-container"></div>

                        {step === 'phone' && (
                            <>
                                <input
                                    type="tel"
                                    placeholder="رقم الهاتف (مثال: 01001234567)"
                                    value={phoneNumber}
                                    onChange={(e) => setPhoneNumber(e.target.value.replace(/[^0-9]/g, ''))}
                                    className="w-full p-4 bg-white/5 border border-white/10 rounded-xl mb-4 outline-none text-center"
                                />
                                {error && <p className="text-red-400 text-sm mb-4 text-center">{error}</p>}
                                <button
                                    onClick={handleSendOtp}
                                    disabled={loading}
                                    className="btn-main w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50"
                                >
                                    {loading ? 'جاري الإرسال...' : 'إرسال رمز التحقق'}
                                    <Icon name="send" size={18} />
                                </button>
                            </>
                        )}

                        {step === 'otp' && (
                            <>
                                <input
                                    type="text"
                                    placeholder="أدخل الرمز المكون من 6 أرقام"
                                    value={otp}
                                    onChange={(e) => setOtp(e.target.value.replace(/[^0-9]/g, ''))}
                                    className="w-full p-4 bg-white/5 border border-white/10 rounded-xl mb-4 outline-none text-center tracking-widest"
                                />
                                {error && <p className="text-red-400 text-sm mb-4 text-center">{error}</p>}
                                <button
                                    onClick={handleVerifyOtp}
                                    disabled={loading}
                                    className="btn-main w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50"
                                >
                                    {loading ? 'جاري التحقق...' : 'تأكيد الرمز'}
                                    <Icon name="check" size={18} />
                                </button>
                            </>
                        )}

                        <button onClick={onClose} className="mt-4 w-full py-3 bg-white/10 rounded-xl font-bold text-sm">
                            إلغاء
                        </button>
                    </div>
                </div>
            );
        };

        // ✅ New Auth Modal Component
        const AuthModal = ({ isOpen, onClose, onGoogleLogin, onPhoneLogin }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-[200] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="glass-panel p-8 w-full max-w-md relative animate-slide-up border border-white/10" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 left-4 p-2 hover:bg-white/10 rounded-full transition">
                            <Icon name="x" size={24} />
                        </button>

                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-brand-accent/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-brand-accent/30">
                                <span className="text-4xl">♞</span>
                            </div>
                            <h2 className="text-2xl font-bold mb-2">أهلاً بك في سبيل التفوق</h2>
                            <p className="text-slate-400 text-sm">سجل دخولك الآن وابدأ رحلة التعلم</p>
                        </div>

                        <div className="space-y-4">
                            {/* Google Login Button */}
                            <button onClick={onGoogleLogin} className="w-full bg-white text-black p-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:scale-[1.02] transition shadow-lg">
                                <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-6 h-6" alt="Google" />
                                تسجيل الدخول باستخدام Google
                            </button>

                            {/* Facebook Login Button */}
                            <button onClick={() => alert('قريباً.. الميزة تحت التطوير')} className="w-full bg-[#1877F2] text-white p-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:scale-[1.02] transition shadow-lg opacity-80">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" className="w-6 h-6" alt="Facebook" />
                                تسجيل الدخول باستخدام Facebook
                            </button>

                            <div className="relative my-6 text-center">
                                <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-white/10"></div></div>
                                <span className="relative bg-[#171717] px-4 text-xs text-slate-500">أو باستخدام الهاتف</span>
                            </div>

                            {/* Phone Login Button */}
                            <button onClick={onPhoneLogin}
                                className="w-full bg-white/5 border border-white/10 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-white/10 transition">
                                <Icon name="smartphone" size={20} className="text-brand-accent" />
                                الدخول برقم الهاتف
                            </button>
                        </div>

                        <p className="text-center text-xs text-slate-500 mt-6">
                            بمجرد تسجيل الدخول، أنت توافق على شروط الاستخدام وسياسة الخصوصية الخاصة بالمنصة.
                        </p>
                    </div>
                </div>
            );
        };

        // 🏆 Honor Board Component
        const HonorBoard = ({ students, isDarkMode }) => {
            const topStudents = students
                .filter(s => !['admin', 'boss'].includes(s.role))
                .map(s => ({ ...s, points: s.points || 0 }))
                .sort((a, b) => b.points - a.points)
                .slice(0, 10);

            const getGradeBadge = (grade) => {
                if (grade === '1sec') return { text: 'الصف الأول', color: 'bg-blue-500/20 text-blue-300' };
                if (grade === '2sec') return { text: 'الصف الثاني', color: 'bg-purple-500/20 text-purple-300' };
                return { text: 'الصف الثالث', color: 'bg-green-500/20 text-green-300' };
            };

            const getRankStyle = (index) => {
                if (index === 0) return 'bg-gradient-to-r from-yellow-500/30 to-yellow-600/20 border-2 border-yellow-500 shadow-xl shadow-yellow-500/20';
                if (index === 1) return 'bg-gradient-to-r from-slate-400/20 to-slate-500/10 border border-slate-400';
                if (index === 2) return 'bg-gradient-to-r from-orange-600/20 to-orange-700/10 border border-orange-600';
                return 'bg-white/5 border border-white/10';
            };

            return (
                <div className="glass-panel p-6 animate-slide-up">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="glass-icon bg-gradient-to-r from-zinc-400/30 to-zinc-500/20 border-zinc-400">
                            <Icon name="award" size={24} className="text-zinc-300" />
                        </div>
                        <div>
                            <h2 className="text-xl font-bold">♞ فرسان التفوق</h2>
                            <p className="text-xs text-slate-400">أفضل 10 طلاب بالمنصة</p>
                        </div>
                    </div>

                    <div className="space-y-3">
                        {topStudents.length === 0 ? (
                            <div className="text-center py-8 text-slate-400">
                                <Icon name="users" size={40} className="mx-auto mb-2 opacity-50" />
                                <p>لا يوجد طلاب بعد</p>
                            </div>
                        ) : (
                            topStudents.map((student, index) => {
                                const gradeBadge = getGradeBadge(student.grade);
                                return (
                                    <div key={student.id} className={`p-4 rounded-xl flex items-center gap-4 transition hover:scale-[1.02] ${getRankStyle(index)}`}>
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-lg ${index === 0 ? 'bg-yellow-500 text-black' :
                                            index === 1 ? 'bg-slate-400 text-black' :
                                                index === 2 ? 'bg-orange-600 text-white' :
                                                    'bg-white/10 text-slate-400'
                                            }`}>
                                            {index === 0 ? '👑' : index + 1}
                                        </div>
                                        <img src={student.photo || 'https://via.placeholder.com/40'} className={`w-12 h-12 rounded-full ${index === 0 ? 'border-4 border-yellow-500' : 'border-2 border-white/20'}`} />
                                        <div className="flex-1">
                                            <p className={`font-bold ${index === 0 ? 'text-yellow-300' : ''}`}>{student.name}</p>
                                            <div className="flex items-center gap-2 mt-1">
                                                <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${gradeBadge.color}`}>
                                                    {gradeBadge.text}
                                                </span>
                                                <RankBadge points={student.points} />
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <p className={`text-2xl font-black ${index === 0 ? 'text-yellow-400' : 'text-brand-accent'}`}>
                                                {student.points}
                                            </p>
                                            <p className="text-xs text-slate-400">نقطة</p>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        // ✅ Courses Catalog Component
        const CoursesCatalog = ({ courses }) => {
            return (
                <div className="glass-panel p-6 animate-slide-up">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="glass-icon bg-purple-500/20 text-purple-500 border-purple-500/30">
                            <Icon name="book-open" size={24} />
                        </div>
                        <div>
                            <h2 className="text-xl font-bold">♞ الكورسات المتاحة</h2>
                            <p className="text-xs text-slate-400">اختر الباقة المناسبة لمستواك</p>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-4">
                        {courses.map((course, index) => (
                            <div key={course.id || index} className="bg-white/5 rounded-xl border border-white/10 overflow-hidden hover:scale-105 transition-transform duration-300">
                                <div className="h-32 bg-slate-800 relative">
                                    <img src={course.image || 'https://via.placeholder.com/300x150?text=Course'} className="w-full h-full object-cover opacity-60" />
                                    <span className="absolute top-2 right-2 bg-brand-accent/20 text-brand-accent px-2 py-1 rounded-lg text-xs font-bold border border-brand-accent/30">
                                        {course.grade === '1sec' ? 'أولى ثانوي' : course.grade === '2sec' ? 'تانية ثانوي' : 'تالتة ثانوي'}
                                    </span>
                                </div>
                                <div className="p-4">
                                    <h3 className="font-bold text-lg mb-1 line-clamp-1">{course.title}</h3>
                                    <p className="text-xs text-slate-400 mb-3 line-clamp-2">{course.description}</p>
                                    <div className="flex justify-between items-center">
                                        <span className="text-2xl font-black text-brand-accent">{course.price} <span className="text-xs text-slate-500">ج.م</span></span>
                                        <span className="text-xs text-slate-500">{course.duration} يوم</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 💳 Subscription Status Card Component
        const SubscriptionStatusCard = ({ user, enrolledCourses }) => {
            if (!user?.isPaid) return null;

            const endDate = new Date(user.subscriptionEnd);
            const now = new Date();
            const totalDays = 30;
            const daysLeft = Math.ceil((endDate - now) / (1000 * 60 * 60 * 24));
            const isExpired = daysLeft <= 0;
            const progress = Math.min(100, Math.max(0, (daysLeft / totalDays) * 100));

            return (
                <div className="glass-panel p-6 mb-6 border-r-4 border-blue-500 relative overflow-hidden animate-slide-up">
                    <div className="relative z-10 flex justify-between items-end">
                        <div className="flex-1">
                            <h3 className="text-slate-400 text-sm font-bold mb-1 flex items-center gap-2">
                                <Icon name="credit-card" size={16} /> حالة الاشتراك
                            </h3>
                            <div className="flex flex-wrap items-center gap-3 mb-2">
                                <span className={`text-2xl font-black ${isExpired ? 'text-red-500' : 'text-green-400'}`}>
                                    {isExpired ? 'اشتراكك منتهي' : 'اشتراكك نشط'}
                                </span>
                            </div>
                            <p className="text-slate-400 text-xs flex items-center gap-1">
                                <Icon name="clock" size={12} />
                                {isExpired ? 'يرجى تجديد الاشتراك للاستمرار' : `ينتهي في: ${endDate.toLocaleDateString('en-CA')} (${daysLeft} يوم)`}
                            </p>
                        </div>
                        {!isExpired && (
                            <div className="text-right hidden sm:block">
                                <span className="text-4xl font-black text-white">{daysLeft}</span>
                                <span className="text-sm text-slate-400 mr-1">يوم</span>
                            </div>
                        )}
                    </div>

                    {!isExpired && (
                        <div className="mt-4 h-3 bg-black/30 rounded-full overflow-hidden border border-white/5">
                            <div
                                className="h-full bg-gradient-to-r from-blue-600 to-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.5)] transition-all duration-1000 ease-out"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                    )}

                    {!isExpired && enrolledCourses && enrolledCourses.length > 0 && (
                        <div className="mt-6">
                            <h4 className="text-sm font-bold text-slate-400 mb-3 flex items-center gap-2">
                                <Icon name="bookmark" size={14} /> كورساتي المشترك فيها:
                            </h4>
                            <div className="flex flex-wrap gap-2">
                                {enrolledCourses.map(courseId => {
                                    const course = window.allCourses?.find(c => c.id === courseId);
                                    return (
                                        <button key={courseId} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1">
                                            <Icon name="play-circle" size={12} /> {course?.title || 'كورس'}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 📝 Exam Builder Component
        const ExamBuilder = ({ onClose, onSave, isDarkMode }) => {
            const [examMode, setExamMode] = useState(null);
            const [question, setQuestion] = useState('');
            const [options, setOptions] = useState([{ text: '', isCorrect: false }]);
            const [imageUrl, setImageUrl] = useState('');
            const [grade, setGrade] = useState('all');

            const addOption = () => {
                if (options.length < 6) {
                    setOptions([...options, { text: '', isCorrect: false }]);
                }
            };

            const updateOption = (index, text) => {
                const newOptions = [...options];
                newOptions[index].text = text;
                setOptions(newOptions);
            };

            const setCorrectAnswer = (index) => {
                const newOptions = options.map((opt, i) => ({ ...opt, isCorrect: i === index }));
                setOptions(newOptions);
            };

            const removeOption = (index) => {
                if (options.length > 2) {
                    setOptions(options.filter((_, i) => i !== index));
                }
            };

            const handleSave = () => {
                if (!question.trim()) return;

                const examData = {
                    type: examMode,
                    question,
                    grade,
                    timestamp: Date.now()
                };

                if (examMode === 'mcq') {
                    examData.options = options.filter(o => o.text.trim());
                    examData.correctIndex = options.findIndex(o => o.isCorrect);
                } else if (examMode === 'whatsapp') {
                    examData.imageUrl = imageUrl;
                }

                onSave(examData);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={onClose}>
                    <div className="glass-panel p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                <div className="glass-icon"><Icon name="file-plus" size={24} /></div>
                                إنشاء امتحان جديد
                            </h2>
                            <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-xl">
                                <Icon name="x" size={24} />
                            </button>
                        </div>

                        {!examMode ? (
                            <div className="grid md:grid-cols-3 gap-4">
                                <button onClick={() => setExamMode('mcq')} className="glass-panel p-6 text-center hover:border-brand-accent transition group">
                                    <div className="glass-icon mx-auto mb-4 group-hover:shadow-lg">
                                        <Icon name="list-checks" size={32} />
                                    </div>
                                    <h3 className="font-bold mb-2">اختيار من متعدد</h3>
                                    <p className="text-xs text-slate-400">MCQ مع إجابات متعددة</p>
                                </button>

                                <button onClick={() => setExamMode('essay')} className="glass-panel p-6 text-center hover:border-brand-accent transition group">
                                    <div className="glass-icon mx-auto mb-4 group-hover:shadow-lg">
                                        <Icon name="file-text" size={32} />
                                    </div>
                                    <h3 className="font-bold mb-2">سؤال مقالي</h3>
                                    <p className="text-xs text-slate-400">إجابة نصية مفتوحة</p>
                                </button>

                                <button onClick={() => setExamMode('whatsapp')} className="glass-panel p-6 text-center hover:border-brand-accent transition group">
                                    <div className="glass-icon mx-auto mb-4 group-hover:shadow-lg">
                                        <Icon name="send" size={32} />
                                    </div>
                                    <h3 className="font-bold mb-2">واتساب/صورة</h3>
                                    <p className="text-xs text-slate-400">إرسال الحل للمعلم</p>
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <button onClick={() => setExamMode(null)} className="flex items-center gap-2 text-slate-400 hover:text-white">
                                    <Icon name="arrow-right" size={18} /> رجوع لاختيار النوع
                                </button>

                                <div>
                                    <label className="block text-sm font-bold mb-2">الصف الدراسي</label>
                                    <select value={grade} onChange={e => setGrade(e.target.value)}
                                        className="w-full p-3 bg-white/5 border border-white/10 rounded-xl">
                                        <option value="all">كل الصفوف</option>
                                        <option value="1sec">أولى ثانوي</option>
                                        <option value="2sec">تانية ثانوي</option>
                                        <option value="3sec">تالتة ثانوي</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold mb-2">السؤال</label>
                                    <textarea
                                        value={question}
                                        onChange={e => setQuestion(e.target.value)}
                                        placeholder="اكتب السؤال هنا..."
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-xl h-32 resize-none"
                                    />
                                </div>

                                {examMode === 'mcq' && (
                                    <div>
                                        <label className="block text-sm font-bold mb-2">الاختيارات</label>
                                        <div className="space-y-3">
                                            {options.map((option, index) => (
                                                <div key={index} className="flex items-center gap-3">
                                                    <input
                                                        type="radio"
                                                        name="correctAnswer"
                                                        checked={option.isCorrect}
                                                        onChange={() => setCorrectAnswer(index)}
                                                        className="w-5 h-5 accent-green-500"
                                                    />
                                                    <input
                                                        type="text"
                                                        value={option.text}
                                                        onChange={e => updateOption(index, e.target.value)}
                                                        placeholder={`الاختيار ${index + 1}`}
                                                        className="flex-1 p-3 bg-white/5 border border-white/10 rounded-xl"
                                                    />
                                                    {options.length > 2 && (
                                                        <button onClick={() => removeOption(index)} className="p-2 hover:bg-red-500/20 rounded-lg text-red-400">
                                                            <Icon name="trash-2" size={18} />
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={addOption} className="mt-3 flex items-center gap-2 text-brand-accent hover:underline">
                                            <Icon name="plus-circle" size={18} /> إضافة اختيار
                                        </button>
                                        <p className="text-xs text-slate-400 mt-2">اختر الإجابة الصحيحة بالضغط على الدائرة</p>
                                    </div>
                                )}

                                {examMode === 'whatsapp' && (
                                    <div>
                                        <label className="block text-sm font-bold mb-2">رابط الصورة (اختياري)</label>
                                        <input
                                            type="url"
                                            value={imageUrl}
                                            onChange={e => setImageUrl(e.target.value)}
                                            placeholder="رابط الصورة من Drive أو أي رابط"
                                            className="w-full p-4 bg-white/5 border border-white/10 rounded-xl"
                                        />
                                    </div>
                                )}

                                <div className="flex gap-3 pt-4">
                                    <button onClick={onClose} className="flex-1 py-4 bg-white/10 rounded-xl font-bold">إلغاء</button>
                                    <button onClick={handleSave} className="flex-1 btn-main py-4 rounded-xl font-bold">
                                        حفظ الامتحان
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 🃏 Flashcard Component
        const Flashcard = ({ question, answer }) => {
            const [flipped, setFlipped] = useState(false);
            return (
                <div className="flashcard-container">
                    <div className={`flashcard ${flipped ? 'flipped' : ''}`} onClick={() => setFlipped(!flipped)}>
                        <div className="flashcard-front">
                            <div>
                                <Icon name="help-circle" size={32} className="text-blue-400 mb-3 mx-auto" />
                                <p className="text-lg font-bold">{question}</p>
                                <p className="text-xs text-slate-400 mt-2">اضغط للإجابة</p>
                            </div>
                        </div>
                        <div className="flashcard-back">
                            <div>
                                <Icon name="lightbulb" size={32} className="text-yellow-400 mb-3 mx-auto" />
                                <p className="text-lg font-bold">{answer}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 🏆 Rank Badge Component
        const RankBadge = ({ points }) => {
            let rank, rankClass;
            if (points >= 200) { rank = 'أسطوري'; rankClass = 'rank-legend'; }
            else if (points >= 51) { rank = 'متقدم'; rankClass = 'rank-advanced'; }
            else { rank = 'مبتدئ'; rankClass = 'rank-novice'; }
            return (
                <span className={`${rankClass} px-3 py-1 rounded-full text-xs font-bold`}>
                    {rank}
                </span>
            );
        };

        // 🔒 Locked Content Overlay
        const LockedOverlay = ({ message = 'المحتوى مغلق' }) => (
            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-10 rounded-xl">
                <div className="text-center">
                    <div className="glass-icon mx-auto mb-2"><Icon name="lock" size={32} /></div>
                    <p className="font-bold">{message}</p>
                </div>
            </div>
        );

        // 🔐 Admin Password Prompt
        const AdminPasswordPrompt = ({ onSubmit, onBack }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState(false);
            return (
                <div className="min-h-screen bg-brand-dark flex items-center justify-center p-4">
                    <div className="glass-panel p-8 w-full max-w-md text-center">
                        <GlassIcon name="shield" size={48} className="mx-auto mb-4" />
                        <h2 className="text-2xl font-bold mb-2">منطقة محمية</h2>
                        <p className="text-slate-400 mb-6">أدخل كلمة السر للوصول لبيانات الطلاب</p>
                        <input
                            type="password"
                            value={password}
                            onChange={e => { setPassword(e.target.value); setError(false); }}
                            className={`w-full p-4 bg-white/5 border ${error ? 'border-red-500' : 'border-white/10'} rounded-xl mb-4 text-center text-2xl tracking-widest`}
                            placeholder="••••••••"
                        />
                        {error && <p className="text-red-400 text-sm mb-4">كلمة السر غلط!</p>}
                        <div className="flex gap-3">
                            <button onClick={onBack} className="flex-1 py-3 bg-white/10 rounded-xl font-bold">رجوع</button>
                            <button onClick={() => {
                                if (password === ADMIN_SECRET_PASSWORD) onSubmit();
                                else setError(true);
                            }} className="flex-1 btn-main py-3 rounded-xl">دخول</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 📅 Attendance Table Component
        const AttendanceTable = ({ students, attendance, onUpdateAttendance, isSuperAdmin }) => {
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="flex justify-between items-center glass-panel p-4">
                        <h2 className="text-xl font-bold flex items-center gap-2">
                            <Icon name="calendar-check" /> الحضور والمتابعة
                        </h2>
                        <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)}
                            className="bg-black/20 border border-white/10 text-white rounded-lg px-3 py-2 cursor-pointer" />
                    </div>

                    <div className="glass-panel overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right min-w-[800px]">
                                <thead className="bg-white/5 text-slate-300">
                                    <tr>
                                        <th className="p-4">الطالب</th>
                                        <th className="p-4">الحالة</th>
                                        <th className="p-4">المستوى</th>
                                        <th className="p-4">إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5">
                                    {students.filter(s => !['admin', 'boss'].includes(s.role)).map(student => {
                                        const record = attendance[student.id]?.[selectedDate] || {};
                                        return (
                                            <tr key={student.id} className="hover:bg-white/5 transition">
                                                <td className="p-4 font-bold">{student.name}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded text-xs ${record.status === 'present' ? 'bg-green-500/20 text-green-300' : record.status === 'absent' ? 'bg-red-500/20 text-red-300' : 'bg-slate-500/20 text-slate-400'}`}>
                                                        {record.status === 'present' ? 'حاضر' : record.status === 'absent' ? 'غائب' : '-'}
                                                    </span>
                                                </td>
                                                <td className="p-4">
                                                    {record.performance && <span className="bg-blue-500/20 text-blue-300 px-2 py-1 rounded text-xs">{record.performance}</span>}
                                                </td>
                                                <td className="p-4 flex gap-2">
                                                    <button onClick={() => onUpdateAttendance(student.id, selectedDate, 'present')} className="p-2 hover:bg-green-500/20 text-green-400 rounded-lg"><Icon name="check" /></button>
                                                    <button onClick={() => onUpdateAttendance(student.id, selectedDate, 'absent')} className="p-2 hover:bg-red-500/20 text-red-400 rounded-lg"><Icon name="x" /></button>
                                                    <div className="relative group">
                                                        <button className="p-2 hover:bg-white/10 rounded-lg"><Icon name="more-vertical" /></button>
                                                        <div className="absolute left-0 top-full mt-1 bg-black border border-white/10 rounded-lg hidden group-hover:block z-10 w-32">
                                                            <button onClick={() => onUpdateAttendance(student.id, selectedDate, record.status || 'present', 'excellent')} className="block w-full text-right px-4 py-2 hover:bg-white/10 text-green-400 text-xs">ممتاز</button>
                                                            <button onClick={() => onUpdateAttendance(student.id, selectedDate, record.status || 'present', 'good')} className="block w-full text-right px-4 py-2 hover:bg-white/10 text-blue-400 text-xs">جيد</button>
                                                            <button onClick={() => onUpdateAttendance(student.id, selectedDate, record.status || 'present', 'needsWork')} className="block w-full text-right px-4 py-2 hover:bg-white/10 text-yellow-400 text-xs">يحتاج متابعة</button>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // 👥 Admin Management Component
        const AdminManagement = ({ admins, onAddAdmin, onRemoveAdmin, isSuperAdmin, showNotification }) => {
            const [showAddForm, setShowAddForm] = useState(false);
            const [newAdminEmail, setNewAdminEmail] = useState('');
            const [newAdminRole, setNewAdminRole] = useState('admin');
            const [managerPassword, setManagerPassword] = useState('');
            const [passwordError, setPasswordError] = useState(false);

            const handleAddAdmin = () => {
                if (managerPassword !== MANAGER_PASSWORD) {
                    setPasswordError(true);
                    return;
                }
                if (!newAdminEmail) {
                    showNotification('أدخل إيميل الأدمن', 'error');
                    return;
                }
                onAddAdmin(newAdminEmail, newAdminRole);
                setShowAddForm(false);
                setNewAdminEmail('');
                setManagerPassword('');
                setPasswordError(false);
            };

            if (!isSuperAdmin) {
                return (
                    <div className="glass-panel p-8 text-center">
                        <div className="glass-icon mx-auto mb-4"><Icon name="lock" size={32} /></div>
                        <h3 className="text-xl font-bold mb-2">صلاحية غير متاحة</h3>
                        <p className="text-slate-400">هذا القسم متاح للمدير الأعلى فقط</p>
                    </div>
                );
            }

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-bold flex items-center gap-2">
                            <div className="glass-icon"><Icon name="shield" size={24} /></div>
                            إدارة المديرين
                        </h2>
                        <button onClick={() => setShowAddForm(true)} className="btn-main px-6 py-2 rounded-xl font-bold flex items-center gap-2">
                            <Icon name="user-plus" size={18} /> إضافة مدير
                        </button>
                    </div>

                    <div className="glass-panel p-6">
                        <h3 className="font-bold mb-4 flex items-center gap-2">
                            <Icon name="users" size={18} /> المديرين الحاليين
                        </h3>
                        <div className="space-y-3">
                            {admins.map(admin => (
                                <div key={admin.id} className="bg-white/5 p-4 rounded-xl flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <img src={admin.photo} className="w-12 h-12 rounded-full border-2 border-brand-accent" />
                                        <div>
                                            <p className="font-bold">{admin.name}</p>
                                            <p className="text-xs text-slate-400">{admin.email}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${admin.email === SUPER_ADMIN_EMAIL ? 'bg-yellow-500/20 text-yellow-300' : 'bg-blue-500/20 text-blue-300'
                                            }`}>
                                            {admin.email === SUPER_ADMIN_EMAIL ? '👑 المدير الأعلى' : admin.role === 'boss' ? 'مدير' : 'مساعد'}
                                        </span>
                                        {admin.email !== SUPER_ADMIN_EMAIL && (
                                            <button onClick={() => onRemoveAdmin(admin.id)}
                                                className="p-2 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-red-300">
                                                <Icon name="trash-2" size={16} />
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {showAddForm && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={() => setShowAddForm(false)}>
                            <div className="glass-panel p-8 max-w-md w-full" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                                    <div className="glass-icon"><Icon name="user-plus" size={24} /></div>
                                    إضافة مدير جديد
                                </h3>

                                <div className="space-y-4">
                                    <input
                                        type="email"
                                        placeholder="إيميل المدير الجديد"
                                        value={newAdminEmail}
                                        onChange={(e) => setNewAdminEmail(e.target.value)}
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none"
                                    />

                                    <select
                                        value={newAdminRole}
                                        onChange={(e) => setNewAdminRole(e.target.value)}
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none"
                                    >
                                        <option value="admin">مساعد</option>
                                        <option value="boss">مدير</option>
                                    </select>

                                    <input
                                        type="password"
                                        placeholder="كلمة سر المدير الأعلى"
                                        value={managerPassword}
                                        onChange={(e) => { setManagerPassword(e.target.value); setPasswordError(false); }}
                                        className={`w-full p-4 bg-white/5 border ${passwordError ? 'border-red-500' : 'border-white/10'} rounded-xl outline-none text-center tracking-widest`}
                                    />
                                    {passwordError && <p className="text-red-400 text-sm text-center">كلمة السر غلط!</p>}

                                    <div className="flex gap-3">
                                        <button onClick={() => setShowAddForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl font-bold">إلغاء</button>
                                        <button onClick={handleAddAdmin} className="flex-1 btn-main py-3 rounded-xl font-bold">إضافة</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ✅ Course Manager Component (for Admin)
        const CourseManager = ({ courses, onAddCourse, onDeleteCourse, isSuperAdmin }) => {
            const [showAddForm, setShowAddForm] = useState(false);
            const [newCourse, setNewCourse] = useState({
                title: '',
                description: '',
                image: '',
                price: '',
                duration: '30',
                grade: '1sec'
            });

            const handleInputChange = (e) => {
                setNewCourse({ ...newCourse, [e.target.name]: e.target.value });
            };

            const handleSubmit = () => {
                if (!newCourse.title || !newCourse.description || !newCourse.image || !newCourse.price) {
                    alert('يرجى ملء جميع الحقول');
                    return;
                }
                onAddCourse(newCourse);
                setShowAddForm(false);
                setNewCourse({ title: '', description: '', image: '', price: '', duration: '30', grade: '1sec' });
            };

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-bold flex items-center gap-2">
                            <div className="glass-icon"><Icon name="book-open" size={24} /></div>
                            إدارة الكورسات
                        </h2>
                        <button onClick={() => setShowAddForm(true)} className="btn-main px-6 py-2 rounded-xl font-bold flex items-center gap-2">
                            <Icon name="plus" size={18} /> إضافة كورس
                        </button>
                    </div>

                    {showAddForm && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={() => setShowAddForm(false)}>
                            <div className="glass-panel p-8 max-w-md w-full max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                                    <div className="glass-icon"><Icon name="plus-circle" size={24} /></div>
                                    إضافة كورس جديد
                                </h3>
                                <div className="space-y-4">
                                    <input name="title" value={newCourse.title} onChange={handleInputChange} placeholder="عنوان الكورس" className="w-full p-3 bg-white/5 border border-white/10 rounded-xl" />
                                    <textarea name="description" value={newCourse.description} onChange={handleInputChange} placeholder="وصف الكورس" className="w-full p-3 bg-white/5 border border-white/10 rounded-xl h-24 resize-none" />
                                    <input name="image" value={newCourse.image} onChange={handleInputChange} placeholder="رابط الصورة التوضيحية" className="w-full p-3 bg-white/5 border border-white/10 rounded-xl" />
                                    <input name="price" type="number" value={newCourse.price} onChange={handleInputChange} placeholder="السعر (ج.م)" className="w-full p-3 bg-white/5 border border-white/10 rounded-xl" />
                                    <input name="duration" type="number" value={newCourse.duration} onChange={handleInputChange} placeholder="المدة (أيام)" className="w-full p-3 bg-white/5 border border-white/10 rounded-xl" />
                                    <select name="grade" value={newCourse.grade} onChange={handleInputChange} className="w-full p-3 bg-white/5 border border-white/10 rounded-xl">
                                        <option value="1sec">الصف الأول الثانوي</option>
                                        <option value="2sec">الصف الثاني الثانوي</option>
                                        <option value="3sec">الصف الثالث الثانوي</option>
                                    </select>
                                    <div className="flex gap-3 pt-4">
                                        <button onClick={() => setShowAddForm(false)} className="flex-1 py-3 bg-white/10 rounded-xl font-bold">إلغاء</button>
                                        <button onClick={handleSubmit} className="flex-1 btn-main py-3 rounded-xl font-bold">إضافة</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="grid gap-4">
                        {courses.map(course => (
                            <div key={course.id} className="glass-panel p-4 flex flex-col md:flex-row gap-4 items-center">
                                <img src={course.image} className="w-24 h-24 rounded-xl object-cover" onError={(e) => { e.target.src = 'https://via.placeholder.com/150'; }} />
                                <div className="flex-1">
                                    <h3 className="font-bold text-lg">{course.title}</h3>
                                    <p className="text-sm text-slate-400 line-clamp-2">{course.description}</p>
                                    <div className="flex gap-4 mt-2 text-sm">
                                        <span className="bg-brand-accent/10 text-brand-accent px-2 py-1 rounded">السعر: {course.price} ج.م</span>
                                        <span className="bg-blue-500/10 text-blue-400 px-2 py-1 rounded">المدة: {course.duration} يوم</span>
                                        <span className="bg-purple-500/10 text-purple-400 px-2 py-1 rounded">الصف: {course.grade}</span>
                                    </div>
                                </div>
                                <button onClick={() => onDeleteCourse(course.id)} className="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white p-2 rounded-lg transition">
                                    <Icon name="trash-2" size={18} />
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ✅ Updated SubscriptionManager with better button layout and colors
        const SubscriptionManager = ({ students, onConfirmPayment, onDeactivate, isSuperAdmin }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [yearFilter, setYearFilter] = useState('all');
            const [activatingId, setActivatingId] = useState(null);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [newSubscription, setNewSubscription] = useState({
                studentId: '',
                studentName: '',
                days: 30,
                grade: '1sec'
            });

            const [showActivationModal, setShowActivationModal] = useState(false);
            const [selectedStudentForActivation, setSelectedStudentForActivation] = useState(null);
            const [activationConfig, setActivationConfig] = useState({ grade: '1sec', days: 30 });

            const handleOpenActivation = (student) => {
                setSelectedStudentForActivation(student);
                setActivationConfig({ grade: student.grade || '1sec', days: 30 });
                setShowActivationModal(true);
            };

            const handleOpenAddSubscription = (student) => {
                setSelectedStudent(student);
                setNewSubscription({
                    studentId: student.id,
                    studentName: student.name,
                    days: 30,
                    grade: student.grade || '1sec'
                });
                setShowAddModal(true);
            };

            const handleConfirmAddSubscription = async () => {
                if (!selectedStudent) return;

                setActivatingId(selectedStudent.id);
                setShowAddModal(false);

                try {
                    const durationDays = parseInt(newSubscription.days) || 30;
                    const endDate = new Date();
                    endDate.setDate(endDate.getDate() + durationDays);

                    await window.rtdb.update(window.rtdb.ref(window.db, `users/${selectedStudent.id}`), {
                        isPaid: true,
                        grade: newSubscription.grade,
                        subscriptionEnd: endDate.toISOString(),
                        subscriptionStart: new Date().toISOString()
                    });
                    
                    showNotification(`✅ تم تفعيل اشتراك ${selectedStudent.name} لمدة ${durationDays} يوم`, 'success');
                } catch (error) {
                    console.error("Activation Error:", error);
                    showNotification('حدث خطأ أثناء التفعيل', 'error');
                } finally {
                    setActivatingId(null);
                    setSelectedStudent(null);
                }
            };

            const handleConfirmActivation = async () => {
                if (!selectedStudentForActivation) return;

                setActivatingId(selectedStudentForActivation.id);
                setShowActivationModal(false);

                try {
                    const durationDays = parseInt(activationConfig.days) || 30;
                    const endDate = new Date();
                    endDate.setDate(endDate.getDate() + durationDays);

                    await window.rtdb.update(window.rtdb.ref(window.db, `users/${selectedStudentForActivation.id}`), {
                        isPaid: true,
                        grade: activationConfig.grade,
                        subscriptionEnd: endDate.toISOString(),
                        subscriptionStart: new Date().toISOString()
                    });
                    
                    showNotification(`✅ تم تفعيل اشتراك ${selectedStudentForActivation.name}`, 'success');
                } catch (error) {
                    console.error("Activation Error:", error);
                    showNotification('حدث خطأ أثناء التفعيل', 'error');
                } finally {
                    setActivatingId(null);
                    setSelectedStudentForActivation(null);
                }
            };

            const filteredStudents = students.filter(s => {
                const matchesSearch = s.name?.toLowerCase().includes(searchTerm.toLowerCase()) || s.email?.toLowerCase().includes(searchTerm.toLowerCase());
                if (yearFilter !== 'all' && s.grade !== yearFilter) return false;
                return matchesSearch;
            });

            return (
                <div className="space-y-6 animate-slide-up">
                    {showActivationModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="glass-panel p-6 w-full max-w-md animate-scale-in border border-brand-accent/30">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <GlassIcon name="zap" className="text-brand-accent" />
                                    تفعيل اشتراك الطالب
                                </h3>
                                <p className="mb-4 text-slate-300">
                                    الطالب: <span className="font-bold text-white">{selectedStudentForActivation?.name}</span>
                                </p>

                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-sm font-bold mb-2">الصف الدراسي</label>
                                        <select
                                            value={activationConfig.grade}
                                            onChange={e => setActivationConfig({ ...activationConfig, grade: e.target.value })}
                                            className="w-full bg-black/20 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-brand-accent"
                                        >
                                            <option value="1sec">الصف الأول الثانوي</option>
                                            <option value="2sec">الصف الثاني الثانوي</option>
                                            <option value="3sec">الصف الثالث الثانوي</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2">مدة الاشتراك (يوم)</label>
                                        <input
                                            type="number"
                                            value={activationConfig.days}
                                            onChange={e => setActivationConfig({ ...activationConfig, days: e.target.value })}
                                            className="w-full bg-black/20 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-brand-accent"
                                        />
                                    </div>
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setShowActivationModal(false)} className="flex-1 py-3 rounded-xl bg-white/10 font-bold hover:bg-white/20 transition">إلغاء</button>
                                    <button onClick={handleConfirmActivation} className="flex-1 py-3 rounded-xl btn-main font-bold flex items-center justify-center gap-2">
                                        <Icon name="check" /> تأكيد التفعيل
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAddModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="glass-panel p-6 w-full max-w-md animate-scale-in border border-green-500/30">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <GlassIcon name="credit-card" className="text-green-500" />
                                    إضافة اشتراك جديد
                                </h3>
                                <p className="mb-4 text-slate-300">
                                    الطالب: <span className="font-bold text-white">{newSubscription.studentName}</span>
                                </p>

                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-sm font-bold mb-2">الصف الدراسي</label>
                                        <select
                                            value={newSubscription.grade}
                                            onChange={e => setNewSubscription({ ...newSubscription, grade: e.target.value })}
                                            className="w-full bg-black/20 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-green-500"
                                        >
                                            <option value="1sec">الصف الأول الثانوي</option>
                                            <option value="2sec">الصف الثاني الثانوي</option>
                                            <option value="3sec">الصف الثالث الثانوي</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2">مدة الاشتراك (يوم)</label>
                                        <input
                                            type="number"
                                            value={newSubscription.days}
                                            onChange={e => setNewSubscription({ ...newSubscription, days: e.target.value })}
                                            className="w-full bg-black/20 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-green-500"
                                            min="1"
                                            max="365"
                                        />
                                    </div>
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setShowAddModal(false)} className="flex-1 py-3 rounded-xl bg-white/10 font-bold hover:bg-white/20 transition">إلغاء</button>
                                    <button onClick={handleConfirmAddSubscription} className="flex-1 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white font-bold flex items-center justify-center gap-2">
                                        <Icon name="check" size={18} /> تأكيد الإضافة
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="glass-panel p-6 space-y-4">
                        <div className="flex flex-wrap justify-between items-center gap-4">
                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                <GlassIcon name="credit-card" size={24} /> إدارة الاشتراكات
                            </h2>
                        </div>

                        <div className="flex flex-wrap gap-4 items-center">
                            <input
                                placeholder="بحث بالاسم أو البريد الإلكتروني..."
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                className="bg-white/5 border border-white/10 p-3 rounded-xl flex-1 min-w-[250px] focus:border-brand-primary/50 transition outline-none"
                            />

                            <div className="flex bg-white/5 p-1 rounded-xl border border-white/10">
                                {['all', '1sec', '2sec', '3sec'].map(y => (
                                    <button
                                        key={y}
