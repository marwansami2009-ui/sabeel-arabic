            transform-style: preserve-3d;
            transition: transform 0.6s;

        .flashcard.flipped {

            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;

        }

        .quiz-option.selected {

            border-color: #d4af37;
        }

        .attendance-btn {
            transition: all 0.3s ease;

        .attendance-btn:hover:not(:disabled) {

            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }
        
        .attendance-btn:disabled {

        .attendance-day {

        .attendance-day.absent {
            background-color: rgba(239, 68, 68, 0.2);

        /* WhatsApp Floating Button */
        .whatsapp-float {
            position: fixed;

        .whatsapp-float:hover {

            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);

        /* Video player container */
        .plyr-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;

        .custom-video-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;

        .custom-control-btn {
            background: #8b0000;
            color: white;
            border: 2px solid #d4af37;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;

            border: 2px solid #d4af37;
            background: rgba(139, 0, 0, 0.1);
        }
        
        .correct-answer {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
        }
        
        .wrong-answer {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 🔐 Security Constants
        const SUPER_ADMIN_EMAIL = 'marwansami2009@gmail.com';
        const SUPER_ADMIN_UID = 'O3NqanKElfVqOpilTTl4lME9m1q2';
        const ADMIN_SECRET_PASSWORD = '123456789';
        const MANAGER_PASSWORD = '01023456789';

        // 📱 Contact Info
        const CONTACT_INFO = {
            whatsapp: 'https://wa.me/201000000000',
            facebook: 'https://facebook.com/yourpage',
            youtube: 'https://youtube.com/yourchannel',
            telegram: 'https://t.me/yourchannel',
            vodafoneNumber: '010xxxxxxxx',
            supportWhatsapp: 'https://wa.me/201000000000'
        };

        // 🏷️ Platform Branding
        const PLATFORM_NAME = 'منصة سبيل التفوق';
        const PLATFORM_SHORT = 'سبيل التفوق';
        const TEACHER_NAME = 'أستاذ محمد حامد';
        const SUBJECT_NAME = 'اللغة العربية';

        // 🎨 Icon Component
        const Icon = ({ name, size = 20, className = '' }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // 🎨 Glass Icon Component
        const GlassIcon = ({ name, size = 24, className = '' }) => (
            <div className={`glass-icon inline-flex items-center justify-center ${className}`}>
                <Icon name={name} size={size} />
            </div>
        );

        // ✅ New Plyr Video Player Component
        const PlyrVideoPlayer = ({ src, title = "فيديو" }) => {
            const videoRef = useRef(null);
            const playerRef = useRef(null);
            const containerRef = useRef(null);
            
            useEffect(() => {
                if (!videoRef.current) return;
                
                // تنظيف المشغل القديم
                if (playerRef.current) {
                    playerRef.current.destroy();
                }
                
                // تحويل الرابط إذا كان YouTube
                let videoSrc = src;
                let isYouTube = false;
                
                if (src.includes('youtube.com/watch') || src.includes('youtu.be') || src.includes('youtube.com/embed')) {
                    // استخراج YouTube ID
                    let videoId = '';
                    if (src.includes('youtube.com/watch')) {
                        const urlParams = new URLSearchParams(new URL(src).search);
                        videoId = urlParams.get('v');
                    } else if (src.includes('youtu.be')) {
                        videoId = src.split('/').pop().split('?')[0];
                    } else if (src.includes('youtube.com/embed')) {
                        videoId = src.split('/').pop().split('?')[0];
                    }
                    
                    if (videoId) {
                        videoSrc = `https://www.youtube.com/watch?v=${videoId}`;
                        isYouTube = true;
                    }
                }
                
                // إنشاء مشغل Plyr
                const player = new Plyr(videoRef.current, {
                    controls: [
                        'play-large',
                        'play',
                        'rewind', // ترجيع 10 ثواني
                        'fast-forward', // تقديم 10 ثواني
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'captions',
                        'settings',
                        'fullscreen'
                    ],
                    settings: ['captions', 'quality', 'speed'],
                    speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
                    quality: { default: 720, options: [4320, 2880, 2160, 1440, 1080, 720, 576, 480, 360, 240] },
                    i18n: {
                        rewind: 'رجوع ١٠ ثواني',
                        fastForward: 'تقديم ١٠ ثواني',
                        play: 'تشغيل',
                        pause: 'إيقاف',
                        volume: 'مستوى الصوت',
                        mute: 'كتم الصوت',
                        unmute: 'إلغاء كتم الصوت',
                        enterFullscreen: 'ملء الشاشة',
                        exitFullscreen: 'خروج من ملء الشاشة',
                        settings: 'الإعدادات',
                    }
                });
                
                playerRef.current = player;
                
                return () => {
                    if (playerRef.current) {
                        playerRef.current.destroy();
                    }
                };
            }, [src]);
            
            // دالة تقديم 5 ثواني
            const skipForward = () => {
                if (playerRef.current) {
                    const currentTime = playerRef.current.currentTime;
                    playerRef.current.currentTime = currentTime + 5;
                }
            };
            
            // دالة ترجيع 5 ثواني
            const skipBackward = () => {
                if (playerRef.current) {
                    const currentTime = playerRef.current.currentTime;
                    playerRef.current.currentTime = currentTime - 5;
                }
            };
            
            return (
                <div className="plyr-container" ref={containerRef}>
                    <video
                        ref={videoRef}
                        className="plyr"
                        playsInline
                        controls
                        crossOrigin="anonymous"
                    >
                        <source src={src} type="video/mp4" />
                        <source src={src.replace('.mp4', '.webm')} type="video/webm" />
                        <a href={src} download>تحميل الفيديو</a>
                    </video>
                    
                    {/* أزرار التحكم المخصصة - 5 ثواني */}
                    <div className="custom-video-controls">
                        <button onClick={skipBackward} className="custom-control-btn">
                            <Icon name="rotate-ccw" size={16} /> -٥ ثواني
                        </button>
                        <button onClick={skipForward} className="custom-control-btn">
                            +٥ ثواني <Icon name="rotate-cw" size={16} />
                        </button>
                    </div>
                </div>
            );
        };

        // ✅ Phone Login Component
        const PhoneLoginModal = ({ onClose, onLoginSuccess }) => {
            const [phoneNumber, setPhoneNumber] = useState('');
            const [otp, setOtp] = useState('');
            const [step, setStep] = useState('phone');
            const [verificationId, setVerificationId] = useState(null);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const setupRecaptcha = () => {
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new window.authMethods.RecaptchaVerifier('recaptcha-container', {
                        'size': 'invisible',
                        'callback': () => { }
                    }, window.auth);
                }
            };

            const handleSendOtp = async () => {
                setLoading(true);
                setError('');
                try {
                    setupRecaptcha();
                    const formattedPhone = phoneNumber.startsWith('+20') ? phoneNumber : `+2${phoneNumber}`;
                    const confirmation = await window.authMethods.signInWithPhoneNumber(window.auth, formattedPhone, window.recaptchaVerifier);
                    setVerificationId(confirmation.verificationId);
                    setStep('otp');
                } catch (err) {
                    console.error("Phone auth error:", err);
                    setError('فشل إرسال الرمز. تأكد من رقم الهاتف وحاول مجدداً.');
                } finally {
                    setLoading(false);
                }
            };

            const handleVerifyOtp = async () => {
                setLoading(true);
                setError('');
                try {
                    const credential = window.auth.PhoneAuthProvider.credential(verificationId, otp);
                    const userCredential = await window.auth.signInWithCredential(credential);
                    onLoginSuccess(userCredential.user);
                    onClose();
                } catch (err) {
                    console.error("OTP verification error:", err);
                    setError('الرمز غير صحيح. حاول مجدداً.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={onClose}>
                    <div className="glass-panel p-8 max-w-md w-full" onClick={e => e.stopPropagation()}>
                        <h2 className="text-2xl font-bold mb-6 text-center">تسجيل الدخول برقم الهاتف</h2>
                        <div id="recaptcha-container"></div>

                        {step === 'phone' && (
                            <>
                                <input
                                    type="tel"
                                    placeholder="رقم الهاتف (مثال: 01001234567)"
                                    value={phoneNumber}

                                    {loading ? 'جاري الإرسال...' : 'إرسال رمز التحقق'}
                                    <Icon name="send" size={18} />
                                </button>
                            </>
                        )}

                        {step === 'otp' && (
                            <>
                                <input
                                    type="text"
                                    placeholder="أدخل الرمز المكون من 6 أرقام"
                                    value={otp}
                                    onChange={(e) => setOtp(e.target.value.replace(/[^0-9]/g, ''))}
                                    className="w-full p-4 bg-white/5 border border-white/10 rounded-xl mb-4 outline-none text-center tracking-widest"
                                />
                                {error && <p className="text-red-400 text-sm mb-4 text-center">{error}</p>}
                                <button
                                    onClick={handleVerifyOtp}
                                    disabled={loading}
                                    className="btn-main w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50"
                                >
                                    {loading ? 'جاري التحقق...' : 'تأكيد الرمز'}
                                    <Icon name="check" size={18} />
                                </button>
                            </>
                        )}

                        <button onClick={onClose} className="mt-4 w-full py-3 bg-white/10 rounded-xl font-bold text-sm">
                            إلغاء
                        </button>
                    </div>
                </div>
            );
        };

        // ✅ New Auth Modal Component
        const AuthModal = ({ isOpen, onClose, onGoogleLogin, onPhoneLogin }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-[200] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="glass-panel p-8 w-full max-w-md relative animate-slide-up border border-white/10" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 left-4 p-2 hover:bg-white/10 rounded-full transition">
                            <Icon name="x" size={24} />
                        </button>

                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-brand-accent/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-brand-accent/30">
                                <span className="text-4xl">♞</span>
                            </div>
                            <h2 className="text-2xl font-bold mb-2">أهلاً بك في سبيل التفوق</h2>
                            <p className="text-slate-400 text-sm">سجل دخولك الآن وابدأ رحلة التعلم</p>
                        </div>

                        <div className="space-y-4">
                            <button onClick={onGoogleLogin} className="w-full bg-white text-black p-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:scale-[1.02] transition shadow-lg">
                                <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-6 h-6" alt="Google" />
                                تسجيل الدخول باستخدام Google
                            </button>

                            <button onClick={() => alert('قريباً.. الميزة تحت التطوير')} className="w-full bg-[#1877F2] text-white p-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:scale-[1.02] transition shadow-lg opacity-80">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" className="w-6 h-6" alt="Facebook" />
                                تسجيل الدخول باستخدام Facebook
                            </button>

                            <div className="relative my-6 text-center">
                                <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-white/10"></div></div>
                                <span className="relative bg-[#171717] px-4 text-xs text-slate-500">أو باستخدام الهاتف</span>
                            </div>

                            <button onClick={onPhoneLogin}
                                className="w-full bg-white/5 border border-white/10 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-white/10 transition">
                                <Icon name="smartphone" size={20} className="text-brand-accent" />
                                الدخول برقم الهاتف
                            </button>
                        </div>

                        <p className="text-center text-xs text-slate-500 mt-6">
                            بمجرد تسجيل الدخول، أنت توافق على شروط الاستخدام وسياسة الخصوصية الخاصة بالمنصة.
                        </p>
                    </div>
                </div>
            );
        };

        // 🏆 Honor Board Component
        const HonorBoard = ({ students, isDarkMode }) => {
            const topStudents = students
                .filter(s => !['admin', 'boss'].includes(s.role))
                .map(s => ({ ...s, points: s.points || 0 }))
                .sort((a, b) => b.points - a.points)
                .slice(0, 10);

            const getGradeBadge = (grade) => {
                if (grade === '1sec') return { text: 'الصف الأول', color: 'bg-blue-500/20 text-blue-300' };
                if (grade === '2sec') return { text: 'الصف الثاني', color: 'bg-purple-500/20 text-purple-300' };
                return { text: 'الصف الثالث', color: 'bg-green-500/20 text-green-300' };
            };

            const getRankStyle = (index) => {
                if (index === 0) return 'bg-gradient-to-r from-yellow-500/30 to-yellow-600/20 border-2 border-yellow-500 shadow-xl shadow-yellow-500/20';
                if (index === 1) return 'bg-gradient-to-r from-slate-400/20 to-slate-500/10 border border-slate-400';
                if (index === 2) return 'bg-gradient-to-r from-orange-600/20 to-orange-700/10 border border-orange-600';
                return 'bg-white/5 border border-white/10';
            };

            return (
                <div className="glass-panel p-6 animate-slide-up">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="glass-icon bg-gradient-to-r from-zinc-400/30 to-zinc-500/20 border-zinc-400">
                            <Icon name="award" size={24} className="text-zinc-300" />
                        </div>
                        <div>
                            <h2 className="text-xl font-bold">♞ فرسان التفوق</h2>
                            <p className="text-xs text-slate-400">أفضل 10 طلاب بالمنصة</p>
                        </div>
                    </div>

                    <div className="space-y-3">
                        {topStudents.length === 0 ? (
                            <div className="text-center py-8 text-slate-400">
                                <Icon name="users" size={40} className="mx-auto mb-2 opacity-50" />
                                <p>لا يوجد طلاب بعد</p>
                            </div>
                        ) : (
                            topStudents.map((student, index) => {
                                const gradeBadge = getGradeBadge(student.grade);
                                return (
                                    <div key={student.id} className={`p-4 rounded-xl flex items-center gap-4 transition hover:scale-[1.02] ${getRankStyle(index)}`}>
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-lg ${index === 0 ? 'bg-yellow-500 text-black' :
                                            index === 1 ? 'bg-slate-400 text-black' :
                                                index === 2 ? 'bg-orange-600 text-white' :
                                                    'bg-white/10 text-slate-400'
                                            }`}>
                                            {index === 0 ? '👑' : index + 1}
                                        </div>
                                        <img src={student.photo || 'https://via.placeholder.com/40'} className={`w-12 h-12 rounded-full ${index === 0 ? 'border-4 border-yellow-500' : 'border-2 border-white/20'}`} />
                                        <div className="flex-1">
                                            <p className={`font-bold ${index === 0 ? 'text-yellow-300' : ''}`}>{student.name}</p>
                                            <div className="flex items-center gap-2 mt-1">
                                                <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${gradeBadge.color}`}>
                                                    {gradeBadge.text}
                                                </span>
                                                <RankBadge points={student.points} />
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <p className={`text-2xl font-black ${index === 0 ? 'text-yellow-400' : 'text-brand-accent'}`}>
                                                {student.points}
                                            </p>
                                            <p className="text-xs text-slate-400">نقطة</p>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        // ✅ Courses Catalog Component (for public view) 
        const CoursesCatalog = ({ courses, onSelect }) => {
            return (
                <div className="glass-panel p-6 animate-slide-up">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="glass-icon bg-purple-500/20 text-purple-500 border-purple-500/30">
                            <Icon name="book-open" size={24} />
                        </div>
                        <div>
                            <h2 className="text-xl font-bold">♞ الكورسات المتاحة</h2>
                            <p className="text-xs text-slate-400">اختر الباقة المناسبة لمستواك</p>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-4">
                        {courses.map((course, index) => (
                            <div 
                                key={course.id || index} 
                                onClick={() => onSelect && onSelect(course)}
                                className="bg-white/5 rounded-xl border border-white/10 overflow-hidden hover:scale-105 transition-transform duration-300 cursor-pointer min-h-[400px] flex flex-col"
                            >
                                <div className="h-48 bg-slate-800 relative">
                                    <img src={course.image || 'https://via.placeholder.com/300x150?text=Course'} className="w-full h-full object-cover opacity-60" />
                                    <span className="absolute top-2 right-2 bg-brand-accent/20 text-brand-accent px-2 py-1 rounded-lg text-xs font-bold border border-brand-accent/30">
                                        {course.grade === '1sec' ? 'أولى ثانوي' : course.grade === '2sec' ? 'تانية ثانوي' : 'تالتة ثانوي'}
                                    </span>
                                </div>
                                <div className="p-4 flex-1 flex flex-col justify-between">
                                    <div>
                                        <h3 className="font-bold text-lg mb-1 line-clamp-1">{course.title}</h3>
                                        <p className="text-xs text-slate-400 mb-3 line-clamp-2">{course.description}</p>
                                    </div>
                                    <div className="flex justify-between items-center mt-auto">
                                        <span className="text-2xl font-black text-brand-accent">{course.price} <span className="text-xs text-slate-500">ج.م</span></span>
                                        <span className="text-xs text-slate-500">{course.duration} يوم</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ✅ NEW: Course Purchase Modal Component
        const CoursePurchaseModal = ({ course, onClose, teacherNumber, user, onRequireLogin }) => {
            const [step, setStep] = useState(1); // 1: Details, 2: Warning, 3: Payment

            if (!course) return null;

            const handleSubscribeClick = () => {
                if (!user) {
                    onRequireLogin();
                } else {
                    setStep(2);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/95 z-[300] flex items-center justify-center p-4 backdrop-blur-sm" onClick={onClose}>
                    <div className="glass-panel p-6 w-full max-w-lg relative animate-scale-in border border-brand-accent/20" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 left-4 p-2 hover:bg-white/10 rounded-full"><Icon name="x" /></button>

                        {step === 1 && (
                            <div className="space-y-6">
                                <div className="h-48 rounded-xl overflow-hidden relative">
                                    <img src={course.image} className="w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex items-end p-4">
                                        <h2 className="text-2xl font-bold text-white">{course.title}</h2>
                                    </div>
                                </div>
                                
                                <div className="space-y-4">
                                    <div className="bg-white/5 p-4 rounded-xl">
                                        <h3 className="font-bold text-brand-accent mb-2">مميزات الكورس:</h3>
                                        <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap">{course.description}</p>
                                    </div>
                                    <div className="flex justify-between items-center text-sm font-bold">
                                        <span className="bg-blue-500/20 text-blue-300 px-3 py-1 rounded-lg">{course.duration} يوم</span>
                                        <span className="text-2xl text-green-400">{course.price} ج.م</span>
                                    </div>
                                </div>
                                <button onClick={handleSubscribeClick} className="btn-main w-full py-4 rounded-xl font-bold text-lg">اشترك الآن</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="text-center space-y-8 py-8">
                                <div className="w-24 h-24 bg-yellow-500/20 text-yellow-500 rounded-full flex items-center justify-center mx-auto animate-pulse">
                                    <Icon name="alert-triangle" size={48} />
                                </div>
                                <div>
                                    <h3 className="text-2xl font-bold text-white mb-2">تأكيد الاختيار</h3>
                                    <p className="text-slate-300">هل أنت متأكد من رغبتك في الاشتراك في كورس<br/><span className="text-brand-accent font-bold">"{course.title}"</span>؟</p>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setStep(1)} className="flex-1 py-3 bg-white/10 rounded-xl font-bold hover:bg-white/20">تراجع</button>
                                    <button onClick={() => setStep(3)} className="flex-1 py-3 bg-brand-accent text-brand-dark rounded-xl font-bold hover:scale-105 transition">نعم، متابعة للدفع</button>
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6">
                                <div className="text-center border-b border-white/10 pb-4">
                                    <h3 className="text-xl font-bold text-green-400 mb-1">بيانات الدفع</h3>
                                    <p className="text-xs text-slate-400">حول المبلغ المطلوب ثم أرسل صورة الإيصال</p>
                                </div>
                                
                                <div className="bg-white/5 p-6 rounded-xl space-y-4">
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-400">المبلغ المطلوب:</span>
                                        <span className="text-2xl font-black text-white">{course.price} ج.م</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-400">رقم فودافون كاش:</span>
                                        <span className="text-xl font-mono font-bold text-brand-accent select-all">{teacherNumber}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-400">كود الطالب:</span>
                                        <span className="text-xl font-mono font-bold text-yellow-400 select-all">{user?.code || 'لم يتم تعيينه'}</span>
                                    </div>
                                </div>

                                <div className="bg-yellow-500/10 p-4 rounded-xl text-xs text-yellow-200 flex gap-2">
                                    <Icon name="info" size={16} className="shrink-0" />
                                    <p>بعد التحويل، اضغط الزر بالأسفل لإرسال الإيصال مع كود الطالب واسم الكورس عبر واتساب وسيتم تفعيل اشتراكك فوراً.</p>
                                </div>

                                <a href={`https://wa.me/201000000000?text=السلام عليكم، قمت بتحويل مبلغ ${course.price} جنيه للاشتراك في كورس "${course.title}".%0Aكود الطالب: ${user?.code || 'غير متوفر'}%0Aالرجاء تفعيل الاشتراك`} 
                                   target="_blank" 
                                   className="flex items-center justify-center gap-2 w-full py-4 bg-[#25D366] hover:bg-[#1ebd59] text-white rounded-xl font-bold transition shadow-lg shadow-green-900/20">
                                    <Icon name="message-circle" /> إرسال الإيصال وتأكيد الحجز
                                </a>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ✅ NEW: Student Enrolled Courses Component
        const StudentEnrolledCourses = ({ user, enrolledCourses, onBackToHome }) => {
            if (!user) return null;

            return (
                <div className="glass-panel p-6 animate-slide-up">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="glass-icon bg-green-500/20 text-green-500 border-green-500/30">
                            <Icon name="check-circle" size={24} />
                        </div>
                        <div>
                            <h2 className="text-xl font-bold">♞ كورساتي المفعلة</h2>
                            <p className="text-xs text-slate-400">الكورسات التي قمت بالاشتراك فيها</p>
                        </div>
                    </div>

                    {enrolledCourses.length === 0 ? (
                        <div className="text-center py-12 border border-dashed border-white/10 rounded-xl">
                            <GlassIcon name="book-open" size={48} className="mx-auto mb-4 opacity-50" />
                            <h3 className="text-lg font-bold mb-2">لا توجد كورسات مفعلة</h3>
                            <p className="text-sm text-slate-400 mb-6">لم تقم بالاشتراك في أي كورس بعد</p>
                            <button 
                                onClick={onBackToHome}
                                className="btn-main px-6 py-3 rounded-xl font-bold inline-flex items-center gap-2"
                            >
                                <Icon name="shopping-cart" size={18} /> تصفح الكورسات المتاحة
                            </button>
                        </div>
                    ) : (
                        <div className="grid md:grid-cols-2 gap-4">
                            {enrolledCourses.map(course => (
                                <div key={course.id} className="bg-white/5 rounded-xl border border-green-500/30 overflow-hidden hover:border-green-500 transition group">
                                    <div className="h-32 bg-slate-800 relative">
                                        <img src={course.image} className="w-full h-full object-cover opacity-60" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex items-end p-3">
                                            <h3 className="font-bold text-white">{course.title}</h3>
                                        </div>
                                        <span className="absolute top-2 right-2 bg-green-500 text-white px-2 py-1 rounded-lg text-xs font-bold">
                                            مفعل ✓
                                        </span>
                                    </div>
                                    <div className="p-4">
                                        <p className="text-sm text-slate-400 line-clamp-2 mb-3">{course.description}</p>
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs bg-white/10 px-2 py-1 rounded">
                                                {course.grade === '1sec' ? 'أولى ثانوي' : course.grade === '2sec' ? 'تانية ثانوي' : 'تالتة ثانوي'}
                                            </span>
                                            <button 
                                                onClick={() => window.location.href = '#lectures'}
                                                className="bg-green-600/20 hover:bg-green-600 text-green-400 hover:text-white px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1"
                                            >
                                                <Icon name="play-circle" size={14} /> مشاهدة المحاضرات
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="mt-6 text-center border-t border-white/10 pt-6">
                        <button 
                            onClick={onBackToHome}
                            className="bg-brand-primary/20 hover:bg-brand-primary text-brand-accent hover:text-white px-6 py-3 rounded-xl font-bold transition inline-flex items-center gap-2"
                        >
                            <Icon name="arrow-right" size={18} /> العودة للصفحة الرئيسية وشراء كورسات جديدة
                        </button>
                    </div>
                </div>
            );
        };

        // ✅ NEW: Enhanced Attendance Tracker Component
        const EnhancedAttendanceTracker = ({ attendance, studentId, onMarkAttendance }) => {
            const [todayMarked, setTodayMarked] = useState(false);
            const [loading, setLoading] = useState(false);
            
            const today = new Date().toISOString().split('T')[0];
            const studentAttendance = attendance[studentId] || {};
            const todayRecord = studentAttendance[today];
            
            // الحصول على آخر 7 أيام مع حالتها
            const last7Days = [];
            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                const record = studentAttendance[dateStr];
                last7Days.push({
                    date: dateStr,
                    dayName: date.toLocaleDateString('ar-EG', { weekday: 'short' }),
                    dayMonth: date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' }),
                    status: record?.status || null
                });
            }
            
            // حساب الإحصائيات
            const totalDays = Object.keys(studentAttendance).length;
            const presentDays = Object.values(studentAttendance).filter(r => r.status === 'present').length;
            const attendanceRate = totalDays > 0 ? Math.round((presentDays / totalDays) * 100) : 0;
            
            const handleMarkAttendance = async () => {
                if (todayRecord || loading) return;
                setLoading(true);
                try {
                    await onMarkAttendance(studentId, today, 'present');
                    setTodayMarked(true);
                } catch (error) {
                    console.error("Error marking attendance:", error);
                } finally {
                    setLoading(false);
                }
            };
            
            useEffect(() => {
                if (todayRecord) {
                    setTodayMarked(true);
                } else {
                    setTodayMarked(false);
                }
            }, [todayRecord]);

            return (
                <div className="glass-panel p-6 animate-slide-up border-r-4 border-green-500">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="glass-icon bg-green-500/20 text-green-500 border-green-500/30">
                            <Icon name="calendar-check" size={24} />
                        </div>
                        <div>
                            <h3 className="text-xl font-bold">♞ نظام الحضور</h3>
                            <p className="text-xs text-slate-400">سجل حضورك اليومي</p>
                        </div>
                    </div>

                    {/* زر تسجيل الحضور اليومي */}
                    <div className="bg-gradient-to-r from-green-900/30 to-green-800/20 p-6 rounded-xl mb-6 text-center">
                        <button
                            onClick={handleMarkAttendance}
                            disabled={todayMarked || loading}
                            className={`attendance-btn px-8 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 mx-auto transition-all ${
                                todayMarked 
                                    ? 'bg-green-600 text-white cursor-not-allowed' 
                                    : 'btn-main hover:scale-105'
                            }`}
                        >
                            {todayMarked ? (
                                <>
                                    <Icon name="check-circle" size={24} /> تم تسجيل حضورك اليوم
                                </>
                            ) : (
                                <>
                                    <Icon name="log-in" size={24} /> سجل حضورك الآن
                                </>
                            )}
                        </button>
                        <p className="text-xs text-slate-400 mt-3">
                            {todayMarked 
                                ? 'شكراً لك! سيتم تحديث الحضور غداً' 
                                : 'يمكنك تسجيل الحضور مرة واحدة فقط يومياً'
                            }
                        </p>
                    </div>

                    {/* عرض آخر 7 أيام */}
                    <div className="mb-6">
                        <h4 className="text-sm font-bold mb-3 flex items-center gap-2">
                            <Icon name="calendar" size={16} /> آخر 7 أيام
                        </h4>
                        <div className="grid grid-cols-7 gap-2">
                            {last7Days.map(day => (
                                <div key={day.date} className="text-center">
                                    <div className={`attendance-day w-10 h-10 rounded-full mx-auto flex items-center justify-center text-sm font-bold border-2 ${
                                        day.status === 'present' 
                                            ? 'present' 
                                            : day.status === 'absent' 
                                                ? 'absent' 
                                                : 'border-white/10 bg-white/5 text-slate-500'
                                    }`}>
                                        {day.status === 'present' ? '✓' : day.status === 'absent' ? '✗' : '-'}
                                    </div>
                                    <span className="text-xs text-slate-400 mt-1 block">{day.dayMonth}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* إحصائيات الحضور */}
                    <div className="bg-white/5 p-4 rounded-xl">
                        <div className="flex justify-between items-center mb-2">
                            <span className="text-sm font-bold">نسبة الحضور الإجمالية</span>
                            <span className="text-lg font-black text-green-400">{attendanceRate}%</span>
                        </div>
                        <div className="h-2 bg-white/10 rounded-full overflow-hidden mb-3">
                            <div 
                                className="h-full bg-green-500 rounded-full transition-all duration-500" 
                                style={{ width: `${attendanceRate}%` }}
                            ></div>
                        </div>
                        <div className="flex justify-between text-xs text-slate-400">
                            <span>✅ حاضر: {presentDays} يوم</span>
                            <span>❌ غائب: {totalDays - presentDays} يوم</span>
                            <span>📊 إجمالي: {totalDays} يوم</span>
                        </div>
                    </div>
                </div>
            );
        };

        // ✅ NEW: Subscription Activation Modal for Admin
        const SubscriptionActivationModal = ({ student, onClose, onActivate, courses }) => {
            const [selectedCourse, setSelectedCourse] = useState('');
            const [days, setDays] = useState(30);
            const [loading, setLoading] = useState(false);

            const handleActivate = async () => {
                if (!selectedCourse) {
                    alert('الرجاء اختيار كورس للتفعيل');
                    return;
                }
                setLoading(true);
                try {
                    await onActivate(student.id, selectedCourse, days);
                    onClose();
                } catch (error) {
                    console.error("Activation error:", error);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4" onClick={onClose}>
                    <div className="glass-panel p-8 max-w-md w-full animate-scale-in" onClick={e => e.stopPropagation()}>
                        <h3 className="text-2xl font-bold mb-6 flex items-center gap-2">
                            <GlassIcon name="zap" className="text-green-500" />
                            تفعيل اشتراك الطالب
                        </h3>

                        <div className="mb-6">
                            <p className="text-sm text-slate-400 mb-2">الطالب:</p>
                            <div className="bg-white/5 p-3 rounded-xl flex items-center gap-3">
                                <img src={student.photo} className="w-10 h-10 rounded-full" />
                                <div>
                                    <p className="font-bold">{student.name}</p>
                                    <p className="text-xs text-slate-400">{student.email}</p>
                                </div>
                            </div>
                        </div>

                        <div className="space-y-4 mb-6">
                            <div>
                                <label className="block text-sm font-bold mb-2">اختر الكورس للتفعيل</label>
                                <select 
                                    value={selectedCourse}
                                    onChange={e => setSelectedCourse(e.target.value)}
                                    className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none"
                                >
                                    <option value="">-- اختر كورس --</option>
                                    {courses.map(course => (
                                        <option key={course.id} value={course.id}>
                                            {course.title} - {course.grade === '1sec' ? 'أولى ثانوي' : course.grade === '2sec' ? 'تانية ثانوي' : 'تالتة ثانوي'} ({course.price} ج.م)
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-bold mb-2">مدة الاشتراك (أيام)</label>
                                <input 
                                    type="number"
                                    value={days}
                                    onChange={e => setDays(parseInt(e.target.value) || 30)}
                                    min="1"
                                    max="365"
                                    className="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none"
                                />
                            </div>
                        </div>

                        <div className="flex gap-3">
                            <button 
                                onClick={onClose}
                                className="flex-1 py-4 bg-white/10 rounded-xl font-bold hover:bg-white/20 transition"
                            >
                                إلغاء
                            </button>
                            <button 
                                onClick={handleActivate}
                                disabled={loading || !selectedCourse}
                                className="flex-1 btn-main py-4 rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {loading ? 'جاري التفعيل...' : 'تفعيل الاشتراك'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ✅ Updated SubscriptionManager with course selection
        const SubscriptionManager = ({ students, courses, onConfirmPayment, onDeactivate, isSuperAdmin }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [yearFilter, setYearFilter] = useState('all');
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [showActivationModal, setShowActivationModal] = useState(false);

            const filteredStudents = students.filter(s => {
                const matchesSearch = s.name?.toLowerCase().includes(searchTerm.toLowerCase()) || s.email?.toLowerCase().includes(searchTerm.toLowerCase());
                if (yearFilter !== 'all' && s.grade !== yearFilter) return false;
                return matchesSearch && !['admin', 'boss'].includes(s.role);
            });

            const handleActivateSubscription = async (studentId, courseId, days) => {
                const endDate = new Date();
                endDate.setDate(endDate.getDate() + days);
                
                const student = students.find(s => s.id === studentId);
                const currentEnrolled = student?.enrolledCourses || [];
                
                if (!currentEnrolled.includes(courseId)) {
                    const updatedEnrolled = [...currentEnrolled, courseId];
                    
                    await window.rtdb.update(window.rtdb.ref(window.db, `users/${studentId}`), {
                        isPaid: true,
                        enrolledCourses: updatedEnrolled,
                        subscriptionEnd: endDate.toISOString(),
                        subscriptionStart: new Date().toISOString()
                    });
                    
                    onConfirmPayment(studentId, days);
                } else {
                    alert('الطالب مشترك بالفعل في هذا الكورس');
                }
            };

            return (
                <div className="space-y-6 animate-slide-up">
                    <div className="glass-panel p-6 space-y-4">
                        <h2 className="text-2xl font-bold flex items-center gap-2">
                            <GlassIcon name="credit-card" size={24} /> إدارة الاشتراكات
                        </h2>

                        <div className="flex flex-wrap gap-4 items-center">
                            <input
                                placeholder="بحث بالاسم أو البريد الإلكتروني..."
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                className="bg-white/5 border border-white/10 p-3 rounded-xl flex-1 min-w-[250px] focus:border-brand-primary/50 transition outline-none"
                            />

                            <div className="flex bg-white/5 p-1 rounded-xl border border-white/10">
                                {['all', '1sec', '2sec', '3sec'].map(y => (
                                    <button
                                        key={y}
                                        onClick={() => setYearFilter(y)}
                                        className={`px-4 py-2 rounded-lg text-sm font-bold transition ${yearFilter === y ? 'bg-brand-primary text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        {y === 'all' ? 'الكل' : y === '1sec' ? '1ث' : y === '2sec' ? '2ث' : '3ث'}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="glass-panel overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-right min-w-[1000px]">
                                <thead className="bg-white/5 text-slate-300">
                                    <tr>
                                        <th className="p-4">الطالب</th>
                                        <th className="p-4">الكورسات المفعلة</th>
                                        <th className="p-4">تاريخ الانتهاء</th>
                                        <th className="p-4">إجراءات المدير</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredStudents.map(student => {
                                        const daysLeft = student.subscriptionEnd ? Math.ceil((new Date(student.subscriptionEnd) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
                                        const enrolledCourses = student.enrolledCourses || [];
                                        const enrolledCourseDetails = courses.filter(c => enrolledCourses.includes(c.id));

                                        return (
                                            <tr key={student.id} className="border-b border-white/5 hover:bg-white/5 transition">
                                                <td className="p-4">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 rounded-full bg-slate-700 overflow-hidden">
                                                            <img src={student.photo} className="w-full h-full object-cover" />
                                                        </div>
                                                        <div>
                                                            <p className="font-bold">{student.name}</p>
                                                            <p className="text-xs text-slate-400">{student.email}</p>
                                                            <p className="text-xs text-slate-500 mt-1">كود: {student.code}</p>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="p-4">
                                                    {enrolledCourseDetails.length > 0 ? (
                                                        <div className="flex flex-wrap gap-1">
                                                            {enrolledCourseDetails.map(c => (
                                                                <span key={c.id} className="bg-green-500/20 text-green-300 px-2 py-1 rounded text-xs font-bold">
                                                                    {c.title}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <span className="text-slate-500 text-sm">لا يوجد</span>
                                                    )}
                                                </td>
                                                <td className="p-4 font-mono text-sm">
                                                    {student.isPaid && student.subscriptionEnd ? (
                                                        <div className={daysLeft > 0 ? "text-green-400" : "text-red-400"}>
                                                            {new Date(student.subscriptionEnd).toLocaleDateString('en-CA')}
                                                            <div className="text-xs opacity-70">
                                                                {daysLeft > 0 ? `باقي ${daysLeft} يوم` : 'منتهي'}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <span className="text-slate-500 font-bold">--</span>
                                                    )}
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex gap-2 flex-wrap">
                                                        <button 
                                                            onClick={() => {
                                                                setSelectedStudent(student);
                                                                setShowActivationModal(true);
                                                            }}
                                                            className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md"
                                                        >
                                                            <Icon name="zap" size={14} /> تفعيل كورس
                                                        </button>
                                                        
                                                        <button 
                                                            onClick={() => {
                                                                if (confirm(`هل أنت متأكد من إلغاء اشتراك ${student.name}؟`)) {
                                                                    onDeactivate(student.id);
                                                                }
                                                            }} 
                                                            className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-md"
                                                        >
                                                            <Icon name="x-circle" size={14} /> إلغاء الاشتراك
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {showActivationModal && selectedStudent && (
                        <SubscriptionActivationModal
                            student={selectedStudent}
                            courses={courses}
                            onClose={() => {
                                setShowActivationModal(false);
                                setSelectedStudent(null);
                            }}
                            onActivate={handleActivateSubscription}
                        />
                    )}
                </div>
            );
        };

        // 💳 Subscription Status Card Component
        const SubscriptionStatusCard = ({ user, enrolledCourses }) => {
            if (!user?.isPaid) return null;

            const endDate = new Date(user.subscriptionEnd);
            const now = new Date();
            const totalDays = 30;
            const daysLeft = Math.ceil((endDate - now) / (1000 * 60 * 60 * 24));
            const isExpired = daysLeft <= 0;
            const progress = Math.min(100, Math.max(0, (daysLeft / totalDays) * 100));

            return (
                <div className="glass-panel p-6 mb-6 border-r-4 border-blue-500 relative overflow-hidden animate-slide-up">
                    <div className="relative z-10 flex justify-between items-end">
                        <div className="flex-1">
                            <h3 className="text-slate-400 text-sm font-bold mb-1 flex items-center gap-2">
                                <Icon name="credit-card" size={16} /> حالة الاشتراك
                            </h3>
                            <div className="flex flex-wrap items-center gap-3 mb-2">
                                <span className={`text-2xl font-black ${isExpired ? 'text-red-500' : 'text-green-400'}`}>
                                    {isExpired ? 'اشتراكك منتهي' : 'اشتراكك نشط'}
                                </span>
                            </div>
                            <p className="text-slate-400 text-xs flex items-center gap-1">
                                <Icon name="clock" size={12} />
                                {isExpired ? 'يرجى تجديد الاشتراك للاستمرار' : `ينتهي في: ${endDate.toLocaleDateString('en-CA')} (${daysLeft} يوم)`}
                            </p>
                        </div>
                        {!isExpired && (
                            <div className="text-right hidden sm:block">
                                <span className="text-4xl font-black text-white">{daysLeft}</span>
                                <span className="text-sm text-slate-400 mr-1">يوم</span>
                            </div>
                        )}
                    </div>

                    {!isExpired && (
                        <div className="mt-4 h-3 bg-black/30 rounded-full overflow-hidden border border-white/5">
                            <div
                                className="h-full bg-gradient-to-r from-blue-600 to-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.5)] transition-all duration-1000 ease-out"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                    )}
                </div>
            );
        };

        // ✅ NEW: Exam Builder Component with Course and Grade
        const ExamBuilder = ({ onClose, onSave, isDarkMode }) => {
            const [examMode, setExamMode] = useState(null);
            const [question, setQuestion] = useState('');
            const [options, setOptions] = useState([{ text: '', isCorrect: false }]);
            const [imageUrl, setImageUrl] = useState('');
            const [grade, setGrade] = useState('1sec');
            const [courseId, setCourseId] = useState('');
            const [courses, setCourses] = useState([]);

            useEffect(() => {
                // تحميل الكورسات من Firebase
                const coursesRef = window.rtdb.ref(window.db, 'courses');
                window.rtdb.onValue(coursesRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const coursesData = Object.entries(snapshot.val()).map(([id, data]) => ({
                            id,
                            ...data
                        }));
                        setCourses(coursesData);
                    }
                });
            }, []);

            const addOption = () => {
                if (options.length < 6) {
                    setOptions([...options, { text: '', isCorrect: false }]);
                }
            };

            const updateOption = (index, text) => {
                const newOptions = [...options];
                newOptions[index].text = text;
                setOptions(newOptions);
            };

            const setCorrectAnswer = (index) => {
                const newOptions = options.map((opt, i) => ({ ...opt, isCorrect: i === index }));
                setOptions(newOptions);
            };

            const removeOption = (index) => {
                if (options.length > 2) {
                    setOptions(options.filter((_, i) => i !== index));
                }
            };

            const handleSave = () => {
                if (!question.trim() || !courseId) {
                    alert('يرجى ملء جميع الحقول المطلوبة');
                    return;
                }

                const examData = {
                    type: examMode,
                    question,
                    grade,
                    courseId,
                    timestamp: Date.now(),
                    date: new Date().toLocaleDateString('ar-EG')
                };

                if (examMode === 'mcq') {
                    examData.options = options.filter(o => o.text.trim());
                    examData.correctIndex = options.findIndex(o => o.isCorrect);
                } else if (examMode === 'whatsapp') {
                    examData.imageUrl = imageUrl;
                }

                onSave(examData);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={onClose}>
                    <div className="glass-panel p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                <div className="glass-icon"><Icon name="file-plus" size={24} /></div>
                                إنشاء امتحان جديد
                            </h2>
                            <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-xl">
                                <Icon name="x" size={24} />
                            </button>
                        </div>

                        {!examMode ? (
                            <div className="grid md:grid-cols-3 gap-4">
                                <button onClick={() => setExamMode('mcq')} className="glass-panel p-6 text-center hover:border-brand-accent transition group">
                                    <div className="glass-icon mx-auto mb-4 group-hover:shadow-lg">
                                        <Icon name="list-checks" size={32} />
                                    </div>
                                    <h3 className="font-bold mb-2">اختيار من متعدد</h3>
                                    <p className="text-xs text-slate-400">MCQ مع إجابات متعددة</p>
                                </button>

                                <button onClick={() => setExamMode('essay')} className="glass-panel p-6 text-center hover:border-brand-accent transition group">
                                    <div className="glass-icon mx-auto mb-4 group-hover:shadow-lg">
                                        <Icon name="file-text" size={32} />
                                    </div>
                                    <h3 className="font-bold mb-2">سؤال مقالي</h3>
                                    <p className="text-xs text-slate-400">إجابة نصية مفتوحة</p>
                                </button>

                                <button onClick={() => setExamMode('whatsapp')} className="glass-panel p-6 text-center hover:border-brand-accent transition group">
                                    <div className="glass-icon mx-auto mb-4 group-hover:shadow-lg">
                                        <Icon name="send" size={32} />
                                    </div>
                                    <h3 className="font-bold mb-2">واتساب/صورة</h3>
                                    <p className="text-xs text-slate-400">إرسال الحل للمعلم</p>
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <button onClick={() => setExamMode(null)} className="flex items-center gap-2 text-slate-400 hover:text-white">
                                    <Icon name="arrow-right" size={18} /> رجوع لاختيار النوع
                                </button>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-bold mb-2">الصف الدراسي</label>
                                        <select value={grade} onChange={e => setGrade(e.target.value)}
                                            className="w-full p-3 bg-white/5 border border-white/10 rounded-xl">
                                            <option value="1sec">أولى ثانوي</option>
                                            <option value="2sec">تانية ثانوي</option>
                                            <option value="3sec">تالتة ثانوي</option>
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold mb-2">الكورس</label>
                                        <select value={courseId} onChange={e => setCourseId(e.target.value)}
                                            className="w-full p-3 bg-white/5 border border-white/10 rounded-xl">
                                            <option value="">-- اختر كورس --</option>
                                            {courses.map(course => (
                                                <option key={course.id} value={course.id}>
                                                    {course.title}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold mb-2">السؤال</label>
                                    <textarea
                                        value={question}
                                        onChange={e => setQuestion(e.target.value)}
                                        placeholder="اكتب السؤال هنا..."
                                        className="w-full p-4 bg-white/5 border border-white/10 rounded-xl h-32 resize-none"
                                    />
                                </div>

                                {examMode === 'mcq' && (
                                    <div>
                                        <label className="block text-sm font-bold mb-2">الاختيارات</label>
                                        <div className="space-y-3">
                                            {options.map((option, index) => (
                                                <div key={index} className="flex items-center gap-3">
                                                    <input
                                                        type="radio"
                                                        name="correctAnswer"
                                                        checked={option.isCorrect}
                                                        onChange={() => setCorrectAnswer(index)}
                                                        className="w-5 h-5 accent-green-500"
                                                    />
                                                    <input
                                                        type="text"
                                                        value={option.text}
                                                        onChange={e => updateOption(index, e.target.value)}
                                                        placeholder={`الاختيار ${index + 1}`}
                                                        className="flex-1 p-3 bg-white/5 border border-white/10 rounded-xl"
                                                    />
                                                    {options.length > 2 && (
                                                        <button onClick={() => removeOption(index)} className="p-2 hover:bg-red-500/20 rounded-lg text-red-400">
                                                            <Icon name="trash-2" size={18} />
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={addOption} className="mt-3 flex items-center gap-2 text-brand-accent hover:underline">
                                            <Icon name="plus-circle" size={18} /> إضافة اختيار
                                        </button>
                                        <p className="text-xs text-slate-400 mt-2">اختر الإجابة الصحيحة بالضغط على الدائرة</p>
                                    </div>
                                )}

                                {examMode === 'whatsapp' && (
                                    <div>
                                        <label className="block text-sm font-bold mb-2">رابط الصورة (اختياري)</label>
                                        <input
                                            type="url"
                                            value={imageUrl}
                                            onChange={e => setImageUrl(e.target.value)}
                                            placeholder="رابط الصورة من Drive أو أي رابط"
                                            className="w-full p-4 bg-white/5 border border-white/10 rounded-xl"
                                        />
                                    </div>
                                )}

                                <div className="flex gap-3 pt-4">
                                    <button onClick={onClose} className="flex-1 py-4 bg-white/10 rounded-xl font-bold">إلغاء</button>
                                    <button onClick={handleSave} className="flex-1 btn-main py-4 rounded-xl font-bold">
                                        حفظ الامتحان
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ✅ NEW: Exam Player Component for Students
        const ExamPlayer = ({ exam, onClose, user, onComplete }) => {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [result, setResult] = useState(null);
            const [showResult, setShowResult] = useState(false);
            
            const handleOptionSelect = (questionId, optionIndex) => {
                if (submitted) return;
                setAnswers({ ...answers, [questionId]: optionIndex });
            };
            
            const handleEssayChange = (questionId, text) => {
                if (submitted) return;
                setAnswers({ ...answers, [questionId]: text });
            };
            
            const handleSubmit = () => {
                if (exam.type === 'mcq') {
                    // تصحيح MCQ
                    const isCorrect = answers[exam.id] === exam.correctIndex;
                    const score = isCorrect ? 1 : 0;
                    
                    setResult({
                        correct: isCorrect,
                        score: score,
                        total: 1,
                        percentage: isCorrect ? 100 : 0,
                        selectedAnswer: answers[exam.id],
                        correctAnswer: exam.options[exam.correctIndex]?.text
                    });
                } else {
                    // مقالي أو واتساب - عرض رسالة
                    setResult({
                        message: 'تم استلام إجابتك، سيتم تصحيحها من قبل المعلم قريباً'
                    });
                }
                
                setSubmitted(true);
                setShowResult(true);
                
                // حفظ النتيجة في Firebase
                const resultData = {
                    examId: exam.id,
                    studentId: user?.uid,
                    studentName: user?.name,
                    answers: answers,
                    timestamp: Date.now(),
                    date: new Date().toLocaleDateString('ar-EG')
                };
                
                if (exam.type === 'mcq') {
                    resultData.score = result?.score;
                    resultData.correct = result?.correct;
                }
                
                window.rtdb.push(window.rtdb.ref(window.db, 'examResults'), resultData);
                
                if (onComplete) {
                    onComplete(resultData);
                }
            };
            
            return (
                <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-[300] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="glass-panel p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                <GlassIcon name="clipboard-list" size={24} />
                                امتحان
                            </h2>
                            <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-xl">
                                <Icon name="x" size={24} />
                            </button>
                        </div>
                        
                        {!showResult ? (
                            <>
                                <div className="mb-6">
                                    <h3 className="text-xl font-bold text-brand-gold mb-2">{exam.question}</h3>
                                    <p className="text-sm text-slate-400">نوع الامتحان: {
                                        exam.type === 'mcq' ? 'اختيار من متعدد' : 
                                        exam.type === 'essay' ? 'مقالي' : 'واتساب'
                                    }</p>
                                </div>
                                
                                {exam.type === 'mcq' && (
                                    <div className="space-y-4 mb-8">
                                        {exam.options?.map((option, idx) => (
                                            <div
